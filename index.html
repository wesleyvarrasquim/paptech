<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPTECH - Gestão Comercial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg-app-1: #FFFFFF;
    --bg-app-2: #F2F7F2;
    --painel: #FFFFFF;
    --painel-solido: #FFFFFF;
    --borda: #DCE6DC;
    --texto: #1E2A20;
    --texto-suave: #5E6F60;
    --accent: #2E7D32;
    --accent-2: #1B5E20;
    --accent-glow: rgba(46,125,50,0.18);
    --perigo: #C62828;
    --alerta: #B8860B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(46,125,50,0.04), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(27,94,32,0.03), transparent 40%),
      linear-gradient(180deg, var(--bg-app-1), var(--bg-app-2));
    background-attachment: fixed;
    color: var(--texto);
    min-height: 100vh;
  }
  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  .marca-dagua {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: min(440px, 55vw) auto;
    opacity: 0.06;
  }
  .logo-preview { max-width: 220px; max-height: 120px; display: block; margin: 10px 0; border-radius: 8px; background: rgba(0,0,0,0.04); padding: 8px; }
  .totais-relatorio { margin-top: 14px; text-align: right; font-size: 15px; color: var(--accent-2); }

  .sidebar { width: 290px; display: flex; flex-direction: column; gap: 8px; padding: 22px 14px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; background: #F7FBF7; border-right: 1px solid var(--borda); overflow-y: auto; }
  .sidebar .logo { color: var(--accent-2); font-size: 20px; font-weight: 800; text-align: center; padding: 4px 0 16px; letter-spacing: 3px; }
  .sidebar .logo span { color: var(--accent); }
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .nav-btn {
    background: #FFFFFF;
    border: 1px solid var(--borda);
    color: var(--texto-suave);
    text-align: left;
    padding: 9px 10px;
    font-size: 12px;
    line-height: 1.2;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .nav-btn .icone { font-size: 16px; line-height: 1; }
  .nav-btn:hover { background: rgba(46,125,50,0.08); border-color: var(--accent); color: var(--accent-2); transform: translateY(-2px); }
  .nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px rgba(46,125,50,0.35);
  }

  .content { flex: 1; padding: 30px 36px; overflow-x: auto; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-header h1 { color: var(--texto); margin: 0; font-size: 23px; }
  .header-botoes { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn-primary { background: var(--accent); color: #fff; border: none; padding: 11px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 8px rgba(46,125,50,0.3); }
  .btn-primary:hover { background: var(--accent-2); box-shadow: 0 4px 14px rgba(46,125,50,0.4); }
  .btn-secondary { background: #FFFFFF; color: var(--accent-2); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 12px; cursor: pointer; }
  .btn-secondary:hover { background: rgba(46,125,50,0.08); color: var(--accent-2); }
  .file-label { display: inline-block; }

  .data-table { width: 100%; border-collapse: collapse; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
  .data-table th, .data-table td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--borda); font-size: 13.5px; }
  .data-table th { background: #F0F6F0; color: var(--accent-2); text-transform: uppercase; font-size: 11.5px; letter-spacing: .6px; }
  .data-table tr:hover td { background: rgba(46,125,50,0.05); }
  .data-table tr.linha-clicavel { cursor: pointer; }
  .tags-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 10px; }
  .tag-similar { display: inline-flex; align-items: center; gap: 6px; background: rgba(46,125,50,0.1); border: 1px solid rgba(46,125,50,0.35); color: var(--accent-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
  .tag-similar button { background: none; border: none; color: var(--accent-2); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .tag-similar button:hover { color: var(--perigo); }
  .data-table .acoes button, .data-table .acoes label.acao-label { background: none; border: none; cursor: pointer; font-size: 15px; margin-right: 6px; color: var(--texto-suave); display: inline-block; }
  .data-table .acoes button:hover, .data-table .acoes label.acao-label:hover { color: var(--accent); }
  .data-table .acoes button.btn-dar-entrada, .data-table .acoes button.btn-emitir-nfe, .data-table .acoes button.btn-gerar-recebimento { font-size: 12px; font-weight: 700; color: var(--accent-2); background: rgba(46,125,50,0.1); border: 1px solid rgba(46,125,50,0.35); border-radius: 999px; padding: 5px 10px; margin-right: 6px; white-space: nowrap; }
  .data-table .acoes button.btn-dar-entrada:hover, .data-table .acoes button.btn-emitir-nfe:hover, .data-table .acoes button.btn-gerar-recebimento:hover { background: var(--accent); color: #fff; }
  .data-table .acoes button.btn-estornar { font-size: 12px; font-weight: 700; color: var(--perigo); background: rgba(198,40,40,0.08); border: 1px solid rgba(198,40,40,0.35); border-radius: 999px; padding: 5px 10px; margin-right: 6px; white-space: nowrap; }
  .data-table .acoes button.btn-estornar:hover { background: var(--perigo); color: #fff; }
  .vazio { text-align: center; color: var(--texto-suave); padding: 20px; }
  .texto-suave-pequeno { color: var(--texto-suave); font-size: 12px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,30,20,0.45); display: none; align-items: center; justify-content: center; z-index: 3100; padding: 20px; }
  .modal { background: #FFFFFF; border: 1px solid var(--borda); box-shadow: 0 10px 40px rgba(0,0,0,0.18); border-radius: 16px; padding: 26px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; color: var(--texto); }
  .modal h2 { color: var(--accent-2); margin-top: 0; }
  .modal.modal-largo { max-width: 920px; }

  .produto-modal-layout { display: flex; gap: 22px; align-items: flex-start; }
  .produto-modal-principal { flex: 1; min-width: 0; }
  .produto-foto-painel { width: 220px; flex-shrink: 0; position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; }
  .produto-foto-painel label { font-size: 12.5px; color: var(--texto-suave); }
  .produto-foto-preview-wrap { width: 100%; aspect-ratio: 1; border: 1px solid var(--borda); border-radius: 12px; background: #F7FBF7; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .produto-foto-preview { width: 100%; height: 100%; object-fit: cover; }
  .produto-foto-placeholder { color: var(--texto-suave); font-size: 12.5px; text-align: center; padding: 10px; }
  .produto-foto-botao { width: 100%; }

  .tela-login { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 20%, rgba(46,125,50,0.08), transparent 55%), linear-gradient(135deg, #F2F7F2, #FFFFFF); padding: 20px; }
  .login-card { background: #FFFFFF; border: 1px solid var(--borda); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
  .login-logo { font-size: 26px; font-weight: 800; text-align: center; color: var(--texto); margin-bottom: 4px; }
  .login-logo span { color: var(--accent); }
  .login-subtitulo { text-align: center; color: var(--texto-suave); font-size: 13px; margin-bottom: 22px; }
  .login-erro { color: var(--perigo); font-size: 13px; min-height: 18px; margin: 4px 0 8px; text-align: center; }
  .login-botao { width: 100%; margin-top: 6px; }
  .login-captcha { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .login-captcha canvas { border: 1px solid var(--borda); border-radius: 8px; background: #fff; max-width: 100%; }
  .login-captcha-novo { padding: 6px 10px; font-size: 16px; }
  .login-dica { margin-top: 16px; font-size: 11.5px; color: var(--texto-suave); text-align: center; }
  .login-dica:hover { text-decoration: underline; color: var(--accent); }

  .tela-painel-admin { position: fixed; inset: 0; z-index: 2200; background: linear-gradient(135deg, #F2F7F2, #FFFFFF); overflow: auto; padding: 28px 20px; }
  .painel-admin-caixa { max-width: 1000px; margin: 0 auto; }

  .sidebar-usuario-info { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--borda); font-size: 12.5px; }
  .sidebar-usuario-info .usuario-nome { color: var(--texto); font-weight: 600; margin-bottom: 2px; }
  .sidebar-usuario-info .usuario-nivel { color: var(--texto-suave); font-weight: 400; font-size: 11px; display: block; margin-bottom: 8px; }
  .sidebar-usuario-info .btn-sair { width: 100%; background: #FFFFFF; border: 1px solid var(--perigo); color: var(--perigo); border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sidebar-usuario-info .btn-sair:hover { background: var(--perigo); color: #fff; }

  .indicador-sync { margin-top: 10px; font-size: 11.5px; text-align: center; padding: 5px 8px; border-radius: 8px; }
  .indicador-sync.sync-ok { background: rgba(46,125,50,0.1); color: var(--accent-2); }
  .indicador-sync.sync-erro { background: rgba(184,134,11,0.12); color: #8A6400; }
  .indicador-sync.sync-off { background: rgba(0,0,0,0.04); color: var(--texto-suave); }

  .btn-atualizar-sistema { margin-top: 8px; width: 100%; background: #FFFFFF; border: 1px solid var(--borda); color: var(--texto); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .btn-atualizar-sistema:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .tela-carregando { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, #F2F7F2, #FFFFFF); }
  .tela-carregando .spinner { width: 34px; height: 34px; border: 4px solid var(--borda); border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite; }
  .tela-carregando .texto { color: var(--texto-suave); font-size: 13.5px; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .permissoes-grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin: 6px 0 14px; }
  .campos-empresa-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px; }
  .campos-empresa-grid .campo { grid-column: span 1; }
  .campos-empresa-grid .campo-span-2 { grid-column: span 2; }
  @media (max-width: 720px) { .campos-empresa-grid { grid-template-columns: 1fr; } }
  .permissao-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--texto); }
  .permissao-item input { width: auto; }
  .permissao-item-granular { grid-column: 1 / -1; justify-content: space-between; }
  .permissao-item-granular select { width: auto; max-width: 220px; font-size: 12.5px; padding: 4px 6px; }

  .campo { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 12.5px; color: var(--texto-suave); }
  .campo input, .campo select, .campo textarea { padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; font-size: 14px; width: 100%; background: #FFFFFF; color: var(--texto); font-family: inherit; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
  .campo textarea { resize: vertical; }
  .campo-linha { display: flex; gap: 8px; }
  .campo-linha input { flex: 1; }
  .campo-checkbox label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto); }
  .campo-checkbox input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .modal-botoes { display: flex; gap: 10px; margin-top: 16px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--borda); }
  .tab-btn { background: none; border: none; padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--texto-suave); border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
  .valor-calculado { font-weight: bold; color: var(--accent-2); padding: 8px 0; font-size: 16px; }

  .item-fieldset { border: 1px solid var(--borda); background: #FAFCFA; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .item-fieldset legend { padding: 0 6px; color: var(--texto-suave); font-size: 13px; }
  .info-cliente-caixa { background: #F5F9F5; border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--texto-suave); line-height: 1.7; margin-bottom: 14px; }
  .info-cliente-caixa strong { color: var(--texto); }
  .item-linha { display: flex; gap: 8px; flex-wrap: wrap; }
  .item-linha select, .item-linha input { padding: 8px; border: 1px solid var(--borda); border-radius: 8px; background: #FFFFFF; color: var(--texto); }
  .item-linha select { flex: 2; min-width: 150px; }
  .item-linha input { flex: 1; min-width: 80px; }

  .nfe-ambiente { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.02em; }
  .nfe-ambiente-homologacao { background: #E3F2FD; color: #0D47A1; border: 1px solid #90CAF9; }
  .nfe-ambiente-producao { background: #FDECEA; color: #B71C1C; border: 1px solid #EF9A9A; }
  .nfe-erros { background: #FDECEA; border: 1px solid #EF9A9A; color: #8E1B1B; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .nfe-erros ul { margin: 6px 0 0; padding-left: 18px; }
  .nfe-totais { font-size: 13px; margin: 8px 0 14px; color: #333; }
  .nfe-status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 10px 0; line-height: 1.5; }
  .nfe-status-info { background: #E3F2FD; color: #0D47A1; border: 1px solid #90CAF9; }
  .nfe-status-ok { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
  .nfe-status-erro { background: #FDECEA; color: #8E1B1B; border: 1px solid #EF9A9A; }
  .nfe-chave { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .nfe-botoes { flex-wrap: wrap; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-perigo { background: #C62828; color: #fff; border: none; padding: 11px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }
  .btn-perigo:disabled { opacity: 0.5; cursor: not-allowed; }
  .aviso { background: #FFF6DE; border: 1px solid #EBCB78; color: #7A5B00; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .certificado-a1-caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 18px; font-size: 13.5px; }
  .certificado-a1-caixa p { margin: 0 0 8px; }
  .certificado-a1-lista { margin: 0 0 10px; padding-left: 20px; }
  .certificado-a1-lista li { margin-bottom: 4px; }
  .certificado-a1-lista a { color: var(--accent-2); font-weight: 600; text-decoration: none; }
  .certificado-a1-lista a:hover { text-decoration: underline; }
  .certificado-a1-dica { color: var(--texto-suave); font-size: 12.5px; margin: 0; }

  .resumo-total { margin-bottom: 16px; font-size: 14px; color: var(--texto); background: var(--painel); border: 1px solid var(--borda); padding: 10px 16px; border-radius: 10px; display: inline-block; }  .resumo-total strong { color: var(--accent-2); }
  .filtro-periodo-caixa { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .filtro-periodo-caixa .campo { margin-bottom: 0; min-width: 160px; }
  .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: bold; display: inline-block; white-space: nowrap; }
  .status-pago { background: rgba(46,125,50,0.14); color: var(--accent-2); }
  .status-pendente { background: rgba(184,134,11,0.14); color: #8A6400; }
  .status-vencido { background: rgba(198,40,40,0.12); color: var(--perigo); }

  .autocomplete-wrap { position: relative; }
  .autocomplete-lista { position: absolute; top: 100%; left: 0; right: 0; background: #FFFFFF; border: 1px solid var(--borda); border-top: none; max-height: 190px; overflow-y: auto; z-index: 10; border-radius: 0 0 8px 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
  .autocomplete-item { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--borda); color: var(--texto); }
  .autocomplete-item:hover { background: rgba(46,125,50,0.08); }
  .autocomplete-item small { color: var(--texto-suave); display: block; margin-top: 2px; }
  .autocomplete-vazio { padding: 8px 10px; color: var(--texto-suave); font-size: 13px; }
  .produto-selecionado-info { background: rgba(46,125,50,0.1); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: var(--accent-2); font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .produto-selecionado-info button { background: none; border: none; cursor: pointer; color: var(--accent-2); font-size: 15px; }

  .campo.busca-produtos { max-width: 460px; margin-bottom: 18px; }

  .acoes-conta { white-space: nowrap; }
  .acoes-conta button { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-right: 6px; background: #F0F6F0; }
  .btn-baixa { border: 1px solid var(--accent); color: var(--accent-2); }
  .btn-baixa:hover { background: rgba(46,125,50,0.14); }
  .btn-excluir { border: 1px solid var(--perigo); color: var(--perigo); }
  .btn-excluir:hover { background: rgba(198,40,40,0.1); color: var(--perigo); }

  .dashboard-logo-painel { display: flex; align-items: center; justify-content: center; background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 22px; margin-bottom: 22px; min-height: 110px; }
  .dashboard-logo-painel-cheio { min-height: calc(100vh - 60px); }
  .dashboard-logo-img { max-height: min(60vh, 420px); max-width: 90%; object-fit: contain; }
  .dashboard-logo-vazio { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--texto-suave); font-size: 15px; text-align: center; }
  .dashboard-logo-icone { font-size: 46px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi-card { position: relative; overflow: hidden; background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 18px 20px; }
  .kpi-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top right, rgba(46,125,50,0.06), transparent 60%); pointer-events: none; }
  .kpi-icone { font-size: 22px; }
  .kpi-valor { font-size: 23px; font-weight: 800; color: var(--texto); margin-top: 10px; }
  .kpi-label { font-size: 11.5px; color: var(--texto-suave); margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; }
  .kpi-card.kpi-destaque { border-color: var(--accent); box-shadow: 0 2px 14px rgba(46,125,50,0.18); }
  .kpi-card.kpi-verde .kpi-valor { color: var(--accent); }
  .kpi-card.kpi-alerta .kpi-valor { color: #8A6400; }
  .kpi-card.kpi-perigo { border-color: var(--perigo); }
  .kpi-card.kpi-perigo .kpi-valor { color: var(--perigo); }

  .dashboard-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .dashboard-painel h2 { font-size: 15px; color: var(--texto); margin-bottom: 10px; font-weight: 700; }

  .launcher-titulo { font-size: 13px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 12px; }
  .launcher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .launcher-tile {

<script>
/* =========================================================
   PAPTECH - Sistema de Gestao Comercial (versao HTML)
   Todos os dados ficam salvos no localStorage do navegador,
   ou seja, ficam gravados neste computador/navegador.
   (Os nomes internos de armazenamento continuam com o
   prefixo "westech_" de propósito, para não perder os dados
   de quem já vinha usando o sistema antes da troca de nome.)
   ========================================================= */

const STORAGE_KEYS = {
  clientes: 'westech_clientes',
  fornecedores: 'westech_fornecedores',
  transportadoras: 'westech_transportadoras',
  produtos: 'westech_produtos',
  compras: 'westech_compras',
  vendas: 'westech_vendas',
  contas_receber: 'westech_contas_receber',
  contas_pagar: 'westech_contas_pagar',
  movimentos_estoque: 'westech_movimentos_estoque',
  vendedores: 'westech_vendedores',
  compradores: 'westech_compradores',
  configuracoes: 'westech_configuracoes',
  usuarios: 'westech_usuarios',
  caixas: 'westech_caixas',
};

/* Seções que podem ter acesso liberado/bloqueado por usuário.
   "dashboard" não entra aqui: todo usuário logado pode ver o Dashboard. */
const SECOES_PERMISSAO = [
  ['clientes', 'Clientes'],
  ['fornecedores', 'Fornecedores'],
  ['transportadoras', 'Transportadoras'],
  ['produtos', 'Produtos'],
  ['compras', 'Compras'],
  ['vendas', 'Vendas'],
  ['pdv', 'Frente de Caixa'],
  ['notas-fiscais', 'Notas Fiscais'],
  ['contas-receber', 'Contas a Receber'],
  ['contas-pagar', 'Contas a Pagar'],
  ['cobranca', 'Cobrança'],
  ['calendario', 'Calendário Financeiro'],
  ['calculadora', 'Calculadora'],
  ['backup', 'Backup / Restauração'],
  ['configuracoes', 'Configurações'],
];
/* Estas três áreas têm permissão em 3 níveis (Sem acesso / Visualizar / Cadastrar) em vez de
   simples sim/não — dá pra liberar alguém só para consultar Produtos/Clientes/Fornecedores
   sem poder cadastrar, editar ou excluir. */
const SECOES_GRANULARES = ['produtos', 'clientes', 'fornecedores'];
const CHAVE_SESSAO_USUARIO = 'westech_sessao_usuario_id';

/* ---------- licenciamento (multiempresa) ---------- */
/* O sistema é vendido para vários clientes, todos usando o mesmo link e o mesmo banco
   Supabase — então cada cliente precisa de um "código de ativação" próprio, que separa
   os dados dele dos demais (campo "licenca" nas tabelas da nuvem e nas chaves locais).
   Sem um código de ativação válido, o sistema nem chega a mostrar a tela de login. */
const CHAVE_LICENCA = 'westech_licenca_codigo';
/* Código especial que abre o Painel de Controle (gerenciar clientes) em vez de ativar
   um cliente comum. Troque por outro valor seu — como este arquivo é público no GitHub,
   qualquer pessoa pode ver este código olhando o código-fonte, então ele funciona mais
   como uma "porta dos fundos" prática do que como segurança forte. */
const CODIGO_MASTER_ADMIN = 'PAPTECH-MASTER-7F3K9X';
let licencaAtual = localStorage.getItem(CHAVE_LICENCA) || null;

function chaveLocalComLicenca(chave) {
  return STORAGE_KEYS[chave] + '::' + (licencaAtual || 'sem_licenca');
}

function chaveSessaoAtual() {
  return CHAVE_SESSAO_USUARIO + '::' + (licencaAtual || 'sem_licenca');
}

/* ---------- banco de dados online (Supabase) ---------- */
/* Preencha estes dois valores com os dados do seu projeto Supabase
   (Project Settings -> API: "Project URL" e a chave "anon public").
   Enquanto estiverem em branco, o sistema funciona normalmente, só que
   100% local (como antes), sem compartilhar dados entre computadores. */
const SUPABASE_URL = 'https://cyvnsnebgumnbgfdapit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5dm5zbmViZ3VtbmJnZmRhcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzgyOTEsImV4cCI6MjEwNjQ1NDI5MX0.pojOH9crgsCJioR-DoMACmyxfjvdG0O_O_LCyl3JwD0';

const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function nuvemConfigurada() {
  return !!supabaseClient;
}

let ultimoErroSync = '';

function atualizarIndicadorSync(status, mensagem) {
  if (status === 'ok') ultimoErroSync = '';
  const el = document.getElementById('indicador-sync');
  if (!el) return;
  el.className = 'indicador-sync ' + (status === 'ok' ? 'sync-ok' : status === 'erro' ? 'sync-erro' : 'sync-off');
  const textos = {
    ok: '☁ Sincronizado',
    erro: '⚠ Sem conexão com a nuvem',
    off: '☁ Somente local (nuvem não configurada)',
  };
  el.textContent = mensagem || textos[status] || '';
}

/* Clicar no indicador de sincronização mostra o detalhe técnico do último erro (quando
   houver) — ajuda a identificar o problema real (ex: coluna/tabela faltando no Supabase)
   sem precisar abrir o console do navegador. */
function mostrarDetalheSync() {
  if (ultimoErroSync) {
    alert('Detalhe do erro de sincronização:\n\n' + ultimoErroSync);
  } else {
    alert('Sincronização com a nuvem funcionando normalmente.');
  }
}

/* Botão "Atualizar Sistema": recarrega a página, o que já faz o navegador
   buscar a versão mais recente do arquivo (quando hospedado numa URL) e
   também aciona de novo o sincronizarComNuvem() que roda ao carregar —
   ou seja, atualiza o código E os dados numa única ação. */
function atualizarSistema() {
  const telaCarregando = document.getElementById('tela-carregando');
  if (telaCarregando) {
    telaCarregando.querySelector('.texto').textContent = 'Atualizando sistema...';
    telaCarregando.style.display = 'flex';
  }
  window.location.reload();
}

/* Busca TODAS as coleções na nuvem de uma vez e sobrescreve o localStorage
   local com o que estiver lá — a nuvem passa a ser a fonte da verdade.
   Chamado uma vez, ao abrir a página, antes de decidir login/painel. */
async function sincronizarComNuvem() {
  if (!nuvemConfigurada() || !licencaAtual) {
    atualizarIndicadorSync('off');
    return;
  }
  try {
    const { data, error } = await supabaseClient.from('registros').select('colecao, dados').eq('licenca', licencaAtual);
    if (error) throw error;

    const porColecao = {};
    Object.keys(STORAGE_KEYS).forEach(chave => { porColecao[chave] = []; });
    (data || []).forEach(linha => {
      if (porColecao[linha.colecao]) porColecao[linha.colecao].push(linha.dados);
    });
    Object.keys(porColecao).forEach(chave => {
      localStorage.setItem(chaveLocalComLicenca(chave), JSON.stringify(porColecao[chave]));
    });
    atualizarIndicadorSync('ok');
  } catch (erro) {
    console.warn('Não foi possível sincronizar com a nuvem, usando dados locais:', erro);
    ultimoErroSync = (erro && (erro.message || erro.details || erro.hint)) || String(erro);
    atualizarIndicadorSync('erro');
  }
}

/* Envia uma coleção inteira para a nuvem: grava/atualiza cada item da lista
   e apaga da nuvem qualquer item que não esteja mais nela (mesmo padrão de
   "substituir o array inteiro" que o resto do app já usa). Roda em segundo
   plano, sem travar a tela — se falhar, só avisa, não desfaz o salvamento
   local (que já aconteceu antes desta chamada). Toda linha leva a "licenca" do
   cliente atual, para os dados de um cliente nunca se misturarem com os de outro
   dentro do mesmo banco Supabase. */
async function enviarParaNuvem(chave, lista) {
  if (!nuvemConfigurada() || !licencaAtual) return;
  try {
    const linhas = lista.filter(item => item && item.id != null).map(item => ({
      colecao: chave,
      registro_id: item.id,
      dados: item,
      licenca: licencaAtual,
    }));

    if (linhas.length) {
      const { error: erroUpsert } = await supabaseClient
        .from('registros')
        .upsert(linhas, { onConflict: 'licenca,colecao,registro_id' });
      if (erroUpsert) throw erroUpsert;
    }

    const idsAtuais = lista.map(item => item.id).filter(id => id != null);
    let queryDelete = supabaseClient.from('registros').delete().eq('colecao', chave).eq('licenca', licencaAtual);
    queryDelete = idsAtuais.length ? queryDelete.not('registro_id', 'in', `(${idsAtuais.join(',')})` ) : queryDelete;
    const { error: erroDelete } = await queryDelete;
    if (erroDelete) throw erroDelete;

    atualizarIndicadorSync('ok');
  } catch (erro) {
    console.warn(`Não foi possível enviar "${chave}" para a nuvem:`, erro);
    ultimoErroSync = (erro && (erro.message || erro.details || erro.hint)) || String(erro);
    atualizarIndicadorSync('erro');
  }
}

let itensCompraTemp = [];
let itensVendaTemp = [];
let itemVendaEditando = -1; // índice do item em edição na tabela de itens da venda
let pesoManualVenda = false; // true quando o usuário digitou o peso (não recalcula pelos itens)
let produtoSelecionadoVenda = null;
let produtoSelecionadoCompra = null;
let produtoSelecionadoMovimento = null;
let similaresProdutoTemp = [];
let fotoProdutoTemp = null;
let produtoEmEdicaoId = null;
let filtroContasTemp = { receber: { inicio: '', fim: '' }, pagar: { inicio: '', fim: '' } };
let relatorioContasTemp = { receber: null, pagar: null };

/* ---------- utilidades gerais ---------- */

function loadList(chave) {
  try {
    return JSON.parse(localStorage.getItem(chaveLocalComLicenca(chave)) || '[]');
  } catch (e) {
    return [];
  }
}

function saveList(chave, lista) {
  localStorage.setItem(chaveLocalComLicenca(chave), JSON.stringify(lista));
  // Envia para a nuvem em segundo plano (não espera/bloqueia a tela).
  enviarParaNuvem(chave, lista);
}

function nextId(lista) {
  return lista.length ? Math.max(...lista.map(x => x.id)) + 1 : 1;
}

function gerarCodigoInternoAleatorio() {
  const existentes = new Set(loadList('produtos').map(p => (p.cod_interno || '').trim()));
  let codigo;
  do {
    // 8 dígitos (0-99999999), sempre com zeros à esquerda para manter o tamanho fixo.
    codigo = String(Math.floor(Math.random() * 100000000)).padStart(8, '0');
  } while (existentes.has(codigo));
  return codigo;
}

function escapeHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function numeroBr(valor) {
  const n = parseFloat(String(valor ?? '0').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function formatarMoeda(valor) {
  return 'R$ ' + (Number(valor) || 0).toFixed(2).replace('.', ',');
}

function formatarDataBr(data) {
  if (!data) return '-';
  const partes = data.split('-');
  if (partes.length !== 3) return data;
  const [ano, mes, dia] = partes;
  return `${dia}/${mes}/${ano}`;
}

function cabecalhoEmpresaImpressaoHtml() {
  const config = obterConfiguracoes();
  const empresa = config.dados_empresa || {};
  const temDados = Object.values(empresa).some(v => (v || '').trim());

  if (!temDados) {
    return `<div class="cabecalho-empresa"><h1>PAPTECH</h1></div>`;
  }

  const enderecoLinha = [
    empresa.endereco,
    empresa.numero,
    empresa.bairro,
  ].filter(Boolean).join(', ');
  const cidadeUfCep = [
    [empresa.cidade, empresa.uf].filter(Boolean).join('/'),
    empresa.cep,
  ].filter(Boolean).join(' - ');

  return `
    <div class="cabecalho-empresa">
      <div class="cabecalho-empresa-topo">
        ${config.logo_base64 ? `<img src="${config.logo_base64}" class="cabecalho-empresa-logo">` : ''}
        <div>
          <h1>${escapeHtml(empresa.nome_fantasia || empresa.razao_social || 'PAPTECH')}</h1>
          ${empresa.razao_social && empresa.nome_fantasia ? `<div class="cabecalho-empresa-linha">${escapeHtml(empresa.razao_social)}</div>` : ''}
        </div>
      </div>
      <div class="cabecalho-empresa-linha">
        ${empresa.cnpj ? `CNPJ: ${escapeHtml(empresa.cnpj)}` : ''}${empresa.cnpj && empresa.inscricao_estadual ? ' &nbsp;|&nbsp; ' : ''}${empresa.inscricao_estadual ? `IE: ${escapeHtml(empresa.inscricao_estadual)}` : ''}
      </div>
      ${enderecoLinha ? `<div class="cabecalho-empresa-linha">${escapeHtml(enderecoLinha)}</div>` : ''}
      ${cidadeUfCep ? `<div class="cabecalho-empresa-linha">${escapeHtml(cidadeUfCep)}</div>` : ''}
      <div class="cabecalho-empresa-linha">

/* ---------- login / usuarios / controle de acesso ---------- */

function permissoesTotais() {
  const permissoes = {};
  SECOES_PERMISSAO.forEach(([chave]) => {
    permissoes[chave] = SECOES_GRANULARES.includes(chave) ? 'cadastrar' : true;
  });
  permissoes.emitir_nf = true;
  return permissoes;
}

function permissoesVazias() {
  const permissoes = {};
  SECOES_PERMISSAO.forEach(([chave]) => {
    permissoes[chave] = SECOES_GRANULARES.includes(chave) ? 'nenhum' : false;
  });
  permissoes.emitir_nf = false;
  return permissoes;
}

/* Garante que exista ao menos um usuário Administrador, para nunca travar o acesso
   ao sistema (ex.: primeira vez que o sistema é aberto neste navegador). */
function inicializarUsuariosPadrao() {
  const lista = loadList('usuarios');
  if (lista.length === 0) {
    saveList('usuarios', [{
      id: 1,
      nome: 'Administrador',
      login: 'admin',
      senha: 'admin',
      trocar_senha: true,
      nivel: 'Administrador',
      status: 'Ativo',
      permissoes: permissoesTotais(),
    }]);
  }
}

function usuarioLogado() {
  const id = Number(localStorage.getItem(chaveSessaoAtual()));
  if (!id) return null;
  const usuario = loadList('usuarios').find(u => u.id === id);
  if (!usuario || usuario.status === 'Inativo') return null;
  return usuario;
}

function temPermissao(secao) {
  if (secao === 'dashboard') return true;
  const usuario = usuarioLogado();
  if (!usuario) return false;
  if (usuario.nivel === 'Administrador') return true;
  const valor = usuario.permissoes && usuario.permissoes[secao];
  // "true" é aceito também para compatibilidade com usuários salvos antes desta área ganhar
  // os 3 níveis (Sem acesso/Visualizar/Cadastrar) — antes era só sim/não.
  if (SECOES_GRANULARES.includes(secao)) return valor === 'visualizar' || valor === 'cadastrar' || valor === true;
  return !!valor;
}

/* Para as áreas com permissão em 3 níveis (Produtos/Clientes/Fornecedores): diz se o usuário
   logado pode cadastrar/editar/excluir ali, em vez de só visualizar. Para as demais áreas
   (permissão simples sim/não), equivale ao próprio temPermissao. */
function podeCadastrar(secao) {
  const usuario = usuarioLogado();
  if (!usuario) return false;
  if (usuario.nivel === 'Administrador') return true;
  if (!SECOES_GRANULARES.includes(secao)) return temPermissao(secao);
  const valor = usuario.permissoes && usuario.permissoes[secao];
  return valor === 'cadastrar' || valor === true;
}

/* Permissão específica (não ligada a uma tela): pode marcar uma venda como Nota Fiscal
   emitida/cancelada (botão "Emitir NFe" em Vendas). Separada do acesso à tela "Notas
   Fiscais" — um usuário pode ver as notas já emitidas sem poder emitir novas, ou vice-versa. */
function podeEmitirNf() {
  const usuario = usuarioLogado();
  if (!usuario) return false;
  if (usuario.nivel === 'Administrador') return true;
  return !!(usuario.permissoes && usuario.permissoes.emitir_nf);
}

/* Confere se uma licença (código já ativado neste navegador) ainda está liberada.
   Retorna 'ok' (libera e já atualiza "último acesso"), 'bloqueada' (código bloqueado
   ou excluído — nega o acesso), ou 'sem_conexao' (não foi possível confirmar agora —
   nesse caso o sistema segue com os dados locais já salvos, sem travar o usuário por
   uma falha de internet). */
async function consultarSituacaoLicenca(codigo) {
  if (!nuvemConfigurada()) return 'sem_conexao';
  try {
    const { data, error } = await supabaseClient.from('licencas').select('ativo').eq('codigo', codigo).maybeSingle();
    if (error) throw error;
    if (!data || !data.ativo) return 'bloqueada';
    supabaseClient.from('licencas').update({ ultimo_acesso: new Date().toISOString() }).eq('codigo', codigo).then(() => {}, () => {});
    return 'ok';
  } catch (erro) {
    console.warn('Não foi possível confirmar a situação da licença agora:', erro);
    return 'sem_conexao';
  }
}

async function tentarAtivacao(event) {
  event.preventDefault();
  const codigoDigitado = document.getElementById('ativacao-codigo').value.trim();
  const erroEl = document.getElementById('ativacao-erro');
  erroEl.textContent = '';
  if (!codigoDigitado) return false;

  if (codigoDigitado === CODIGO_MASTER_ADMIN) {
    ocultarTelaAtivacao();
    abrirPainelAdmin();
    return false;
  }

  if (!nuvemConfigurada()) {
    erroEl.textContent = 'A ativação precisa de conexão com a internet na primeira vez. Verifique sua conexão e tente de novo.';
    return false;
  }

  erroEl.textContent = 'Verificando código...';
  try {
    const { data, error } = await supabaseClient.from('licencas').select('*').eq('codigo', codigoDigitado).maybeSingle();
    if (error) throw error;
    if (!data) {
      erroEl.textContent = 'Código de ativação não encontrado.';
      return false;
    }
    if (!data.ativo) {
      erroEl.textContent = 'Este código está bloqueado. Fale com o fornecedor do sistema.';
      return false;
    }

    licencaAtual = codigoDigitado;
    localStorage.setItem(CHAVE_LICENCA, codigoDigitado);
    supabaseClient.from('licencas').update({ ultimo_acesso: new Date().toISOString() }).eq('codigo', codigoDigitado).then(() => {}, () => {});

    ocultarTelaAtivacao();
    document.getElementById('tela-carregando').style.display = 'flex';
    await sincronizarComNuvem();
    document.getElementById('tela-carregando').style.display = 'none';
    inicializarUsuariosPadrao();
    mostrarTelaLogin();
  } catch (erro) {
    erroEl.textContent = 'Não foi possível verificar o código agora. Verifique sua conexão e tente de novo.';
  }
  return false;
}

/* Código curto, sem letras/números fáceis de confundir (sem O/0/I/1), em dois
   blocos de 5 (ex: "7KPX9-M3QRT") pra ficar fácil de ler e digitar por telefone. */
function gerarCodigoLicenca() {
  const caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let codigo = '';
  for (let i = 0; i < 10; i++) codigo += caracteres[Math.floor(Math.random() * caracteres.length)];
  return codigo.slice(0, 5) + '-' + codigo.slice(5);
}

/* ---------- segurança do login: senha com hash, captcha e bloqueio por tentativas ---------- */

const LOGIN_MAX_FALHAS = 5;          // erros seguidos antes de bloquear
const LOGIN_BLOQUEIO_BASE_MIN = 5;   // 1º bloqueio: 5 min; depois 10, 20, 40... (máx. 60)
const LOGIN_BLOQUEIO_MAX_MIN = 60;
const CAPTCHA_CARACTERES = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem I, O, 0, 1 (evita confusão)
let captchaLoginAtual = '';
let temporizadorBloqueioLogin = null;
let usuarioTrocaSenhaPendente = null;

function chaveBloqueioLogin() {
  return 'paptech_login_bloqueio::' + (licencaAtual || 'sem_licenca');
}

function lerBloqueioLogin() {
  try {
    const dados = JSON.parse(localStorage.getItem(chaveBloqueioLogin()) || '{}');
    return { falhas: Number(dados.falhas) || 0, nivel: Number(dados.nivel) || 0, ate: Number(dados.ate) || 0 };
  } catch (e) { return { falhas: 0, nivel: 0, ate: 0 }; }
}

function gravarBloqueioLogin(estado) {
  try { localStorage.setItem(chaveBloqueioLogin(), JSON.stringify(estado)); } catch (e) { /* sem armazenamento */ }
}

/* Registra uma senha errada. Devolve o estado novo (com "ate" preenchido quando bloqueou). */
function registrarFalhaLogin(agora) {
  const estado = lerBloqueioLogin();
  estado.falhas += 1;
  if (estado.falhas >= LOGIN_MAX_FALHAS) {
    estado.nivel += 1;
    const minutos = Math.min(LOGIN_BLOQUEIO_BASE_MIN * Math.pow(2, estado.nivel - 1), LOGIN_BLOQUEIO_MAX_MIN);
    estado.ate = agora + minutos * 60000;
    estado.falhas = 0;
  }
  gravarBloqueioLogin(estado);
  return estado;
}

function limparBloqueioLogin() {
  try { localStorage.removeItem(chaveBloqueioLogin()); } catch (e) { /* ignora */ }
}

function textoTempoRestante(ms) {
  const total = Math.max(1, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60), sg = total % 60;
  return m > 0 ? `${m} min ${String(sg).padStart(2, '0')} s` : `${sg} s`;
}

/* Se o login está bloqueado, mostra a contagem regressiva e desabilita o botão. */
function atualizarEstadoBloqueioLogin() {
  const botao = document.getElementById('login-botao');
  const erro = document.getElementById('login-erro');
  if (!botao || !erro) return false;
  clearInterval(temporizadorBloqueioLogin);
  const restante = lerBloqueioLogin().ate - Date.now();
  if (restante <= 0) { botao.disabled = false; return false; }
  botao.disabled = true;
  const mostrar = () => {
    const falta = lerBloqueioLogin().ate - Date.now();
    if (falta <= 0) {
      clearInterval(temporizadorBloqueioLogin);
      botao.disabled = false;
      erro.textContent = '';
      return;
    }
    erro.textContent = `Muitas tentativas erradas. Tente novamente em ${textoTempoRestante(falta)}.`;
  };
  mostrar();
  temporizadorBloqueioLogin = setInterval(mostrar, 1000);
  return true;
}

function gerarTextoCaptcha() {
  const bytes = new Uint8Array(5);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  return Array.from(bytes, b => CAPTCHA_CARACTERES[b % CAPTCHA_CARACTERES.length]).join('');
}

function gerarCaptchaLogin() {
  captchaLoginAtual = gerarTextoCaptcha();
  const canvas = document.getElementById('login-captcha-img');
  const campo = document.getElementById('login-captcha');
  if (campo) campo.value = '';
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rnd = (min, max) => min + Math.random() * (max - min);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const fundo = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  fundo.addColorStop(0, '#eef4ee');
  fundo.addColorStop(1, '#f7f1e6');
  ctx.fillStyle = fundo;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 7; i++) {            // linhas de ruído
    ctx.strokeStyle = `rgba(${Math.floor(rnd(60, 150))},${Math.floor(rnd(60, 150))},${Math.floor(rnd(60, 150))},0.55)`;
    ctx.lineWidth = rnd(1, 2.2);
    ctx.beginPath();
    ctx.moveTo(rnd(0, canvas.width), rnd(0, canvas.height));
    ctx.bezierCurveTo(rnd(0, canvas.width), rnd(0, canvas.height), rnd(0, canvas.width), rnd(0, canvas.height), rnd(0, canvas.width), rnd(0, canvas.height));
    ctx.stroke();
  }
  const passo = canvas.width / (captchaLoginAtual.length + 0.6);
  for (let i = 0; i < captchaLoginAtual.length; i++) {
    ctx.save();
    ctx.translate(passo * (i + 0.8) + rnd(-3, 3), canvas.height / 2 + rnd(-5, 5));
    ctx.rotate(rnd(-0.45, 0.45));
    ctx.font = `bold ${Math.floor(rnd(26, 34))}px Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgb(${Math.floor(rnd(20, 110))},${Math.floor(rnd(20, 110))},${Math.floor(rnd(20, 110))})`;
    ctx.fillText(captchaLoginAtual[i], 0, 0);
    ctx.restore();
  }
  for (let i = 0; i < 60; i++) {           // pontinhos
    ctx.fillStyle = `rgba(${Math.floor(rnd(0, 120))},${Math.floor(rnd(0, 120))},${Math.floor(rnd(0, 120))},0.5)`;
    ctx.fillRect(rnd(0, canvas.width), rnd(0, canvas.height), 1.6, 1.6);
  }
}

/* Hash de senha: PBKDF2-SHA256 (100 mil voltas) com sal aleatório por usuário. */
function bytesParaHex(bytes) { return Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2, '0')).join(''); }

function gerarSalSenha() {
  const sal = new Uint8Array(16);
  crypto.getRandomValues(sal);
  return bytesParaHex(sal);
}

async function hashSenha(senha, salHex) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Este navegador não oferece criptografia segura (use HTTPS ou um navegador atualizado).');
  const chave = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const sal = new Uint8Array(salHex.match(/.{2}/g).map(h => parseInt(h, 16)));
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: sal, iterations: 100000, hash: 'SHA-256' }, chave, 256);
  return bytesParaHex(bits);
}

async function conferirSenhaUsuario(usuario, senha) {
  if (usuario.senha_hash && usuario.senha_sal) {
    return (await hashSenha(senha, usuario.senha_sal)) === usuario.senha_hash;
  }
  return typeof usuario.senha === 'string' && usuario.senha === senha;   // usuário antigo (texto puro), migrado no 1º login
}

/* Troca a senha de um registro de usuário por uma versão com hash (remove o texto puro). */
async function aplicarSenhaComHash(usuario, senhaNova) {
  const sal = gerarSalSenha();
  usuario.senha_hash = await hashSenha(senhaNova, sal);
  usuario.senha_sal = sal;
  delete usuario.senha;
  delete usuario.trocar_senha;
}

/* Regras para uma senha nova. Devolve a mensagem de erro, ou '' se está boa. */
function validarSenhaNova(senha, login) {
  if (senha.length < 8) return 'A senha precisa ter ao menos 8 caracteres.';
  if (!/[A-Za-z]/.test(senha) || !/\d/.test(senha)) return 'Use letras e números na senha.';
  const baixa = senha.toLowerCase();
  if (baixa === String(login || '').toLowerCase() || ['admin', 'admin123', '12345678', 'senha123', 'paptech123'].includes(baixa)) return 'Escolha uma senha menos óbvia.';
  return '';
}

function mostrarTelaLogin(mensagemErro) {
  document.getElementById('app-principal').style.display = 'none';
  document.getElementById('tela-ativacao').style.display = 'none';
  document.getElementById('tela-painel-admin').style.display = 'none';
  document.getElementById('login-troca').style.display = 'none';
  usuarioTrocaSenhaPendente = null;
  const tela = document.getElementById('tela-login');
  tela.style.display = 'flex';
  const formLogin = tela.querySelector('form');
  formLogin.style.display = '';
  document.getElementById('login-erro').textContent = mensagemErro || '';
  const campoUsuario = document.getElementById('login-usuario');
  const campoSenha = document.getElementById('login-senha');
  campoUsuario.value = '';
  campoSenha.value = '';
  gerarCaptchaLogin();
  atualizarEstadoBloqueioLogin();
  setTimeout(() => campoUsuario.focus(), 50);
}

function ocultarTelaLogin() {
  clearInterval(temporizadorBloqueioLogin);
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app-principal').style.display = 'flex';
}

async function tentarLogin(event) {
  event.preventDefault();
  const erro = document.getElementById('login-erro');
  if (atualizarEstadoBloqueioLogin()) return false;

  // 1) Captcha primeiro: se errar, a senha nem é conferida e a tentativa não conta como falha.
  const digitado = document.getElementById('login-captcha').value.trim().toUpperCase();
  if (!captchaLoginAtual || digitado !== captchaLoginAtual) {
    erro.textContent = 'Caracteres da imagem incorretos. Tente de novo.';
    gerarCaptchaLogin();
    return false;
  }

  const login = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const usuario = loadList('usuarios').find(u => (u.login || '').toLowerCase() === login.toLowerCase());

  let ok = false;
  try {
    ok = !!usuario && await conferirSenhaUsuario(usuario, senha);
  } catch (e) {
    erro.textContent = e.message;
    gerarCaptchaLogin();
    return false;
  }

  if (!ok) {
    const estado = registrarFalhaLogin(Date.now());
    document.getElementById('login-senha').value = '';
    gerarCaptchaLogin();
    if (!atualizarEstadoBloqueioLogin()) {
      const restam = LOGIN_MAX_FALHAS - estado.falhas;
      erro.textContent = `Usuário ou senha incorretos. ${restam} tentativa(s) antes do bloqueio temporário.`;
    }
    return false;
  }
  if (usuario.status === 'Inativo') {
    erro.textContent = 'Este usuário está inativo. Fale com um administrador.';
    gerarCaptchaLogin();
    return false;
  }

  limparBloqueioLogin();

  // Senha padrão ("admin") ou marcada para troca: exige uma senha nova antes de entrar.
  if (usuario.trocar_senha || (!usuario.senha_hash && usuario.senha === 'admin')) {
    usuarioTrocaSenhaPendente = usuario.id;
    document.getElementById('tela-login').querySelector('form').style.display = 'none';
    document.getElementById('login-troca').style.display = '';
    document.getElementById('troca-senha-1').value = '';
    document.getElementById('troca-senha-2').value = '';
    document.getElementById('troca-erro').textContent = '';
    setTimeout(() => document.getElementById('troca-senha-1').focus(), 50);
    return false;
  }

  // Usuário antigo com senha em texto puro: converte para hash agora que a senha foi conferida.
  if (!usuario.senha_hash) {
    try {
      const lista = loadList('usuarios');
      const alvo = lista.find(u => u.id === usuario.id);
      await aplicarSenhaComHash(alvo, senha);
      saveList('usuarios', lista);
    } catch (e) { /* segue sem migrar; tenta de novo no próximo login */ }
  }

  localStorage.setItem(chaveSessaoAtual(), String(usuario.id));
  ocultarTelaLogin();
  iniciarAppLogado();
  return false;
}

async function confirmarTrocaSenhaLogin(event) {
  event.preventDefault();
  const erro = document.getElementById('troca-erro');
  const s1 = document.getElementById('troca-senha-1').value;
  const s2 = document.getElementById('troca-senha-2').value;
  const lista = loadList('usuarios');
  const alvo = lista.find(u => u.id === usuarioTrocaSenhaPendente);
  if (!alvo) { mostrarTelaLogin(); return false; }
  const problema = validarSenhaNova(s1, alvo.login);
  if (problema) { erro.textContent = problema; return false; }
  if (s1 !== s2) { erro.textContent = 'As duas senhas não são iguais.'; return false; }
  try {
    await aplicarSenhaComHash(alvo, s1);
  } catch (e) { erro.textContent = e.message; return false; }
  saveList('usuarios', lista);
  localStorage.setItem(chaveSessaoAtual(), String(alvo.id));
  usuarioTrocaSenhaPendente = null;
  document.getElementById('login-troca').style.display = 'none';
  ocultarTelaLogin();
  iniciarAppLogado();
  return false;
}

function fazerLogout() {
  localStorage.removeItem(chaveSessaoAtual());
  mostrarTelaLogin();
}

/* Mostra/esconde os botões do menu lateral de acordo com as permissões
   do usuário logado, e exibe o nome dele + botão de sair. */
function aplicarPermissoesNaTela() {
  const usuario = usuarioLogado();
  if (!usuario) return;

  document.querySelectorAll('.nav-btn[data-section]').forEach(botao => {
    const secao = botao.dataset.section;
    botao.style.display = temPermissao(secao) ? '' : 'none';
  });

  const infoEl = document.getElementById('sidebar-usuario-info');
  if (infoEl) {
    infoEl.innerHTML = `
      <span class="usuario-nome">${escapeHtml(usuario.nome)}</span>
      <span class="usuario-nivel">${escapeHtml(usuario.nivel)}</span>
      <button type="button" class="btn-sair" onclick="fazerLogout()">Sair</button>
    `;
  }
}

function iniciarAppLogado() {
  aplicarPermissoesNaTela();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const botaoDashboard = document.querySelector('.nav-btn[data-section="dashboard"]');

function filtrarPessoasPorTermo(lista, termoBusca) {
  const fragmentos = normalizarTextoBusca(termoBusca)
    .split('*')
    .map(f => f.trim())
    .filter(Boolean);

  if (!fragmentos.length) return lista;

  return lista.filter(p => {
    const alvo = normalizarTextoBusca([
      p.razao_social || '',
      p.nome_fantasia || '',
      p.cnpj || '',
    ].join(' '));
    return fragmentos.every(frag => alvo.includes(frag));
  });
}

function renderPessoaSection(tipo) {
  const titulo = TITULOS_PESSOA[tipo];
  const singular = SINGULAR_PESSOA[tipo];
  const container = document.getElementById('sec-' + tipo);
  const buscaAtual = buscaPessoaTemp[tipo];

  container.innerHTML = `
    <div class="section-header">
      <h1>${titulo}</h1>
      ${podeCadastrar(tipo) ? `<button class="btn-primary" onclick="abrirFormPessoa('${tipo}')">+ Cadastrar ${singular}</button>` : ''}

function onBuscaPessoaInput(tipo) {
  buscaPessoaTemp[tipo] = document.getElementById(`busca-${tipo}`).value;
  atualizarTabelaPessoas(tipo);
}

function atualizarTabelaPessoas(tipo) {
  const todos = loadList(tipo);
  const lista = filtrarPessoasPorTermo(todos, buscaPessoaTemp[tipo]);
  const tbody = document.getElementById(`${tipo}-tbody`);
  if (!tbody) return;

  const podeEditar = podeCadastrar(tipo);

    <tr>

function abrirFormPessoa(tipo, id) {
  if (!podeCadastrar(tipo)) {
    alert('Você não tem permissão para cadastrar/editar nesta área.');
    return;
  }
  const lista = loadList(tipo);
  const registro = id ? lista.find(p => p.id === id) : null;
  const singular = SINGULAR_PESSOA[tipo];

  const camposHtml = CAMPOS_PESSOA.map(([chave, rotulo]) => {
    const valor = registro ? (registro[chave] || '') : '';
    const botaoBuscar = chave === 'cep'
      ? `<button type="button" class="btn-secondary" onclick="buscarCepForm()">Buscar</button>`
      : '';
    return `
      <div class="campo">
        <label>${rotulo}</label>
        <div class="campo-linha">
          <input type="text" id="campo-${chave}" value="${escapeHtml(valor)}">
          ${botaoBuscar}
        </div>
      </div>
    `;
  }).join('');

  const camposExtraClienteHtml = tipo === 'clientes' ? `
    <label style="font-size:12.5px;color:var(--texto-suave); margin-top:10px; display:block">Comprador / NF-e</label>
    ${CAMPOS_EXTRA_CLIENTE.map(([chave, rotulo]) => {
      const valor = registro ? (registro[chave] || '') : '';
      return `
        <div class="campo">
          <label>${rotulo}</label>
          <input type="text" id="campo-${chave}" value="${escapeHtml(valor)}">
        </div>
      `;
    }).join('')}
  ` : '';

  abrirModal(`
    <h2>${registro ? 'Editar' : 'Cadastrar'} ${singular}</h2>
    <form id="form-pessoa" onsubmit="return salvarPessoa(event, '${tipo}', ${id || 'null'})">
      ${camposHtml}
      ${camposExtraClienteHtml}
      <div class="modal-botoes">
        <button type="submit" class="btn-primary">Salvar</button>
        <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      </div>
    </form>
  `);
}

async function buscarCepForm() {
  const cepInput = document.getElementById('campo-cep');
  const cep = (cepInput.value || '').replace(/\D/g, '');
  if (cep.length !== 8) {
    alert('Digite um CEP válido com 8 dígitos.');
    return;
  }
  try {
    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const dados = await resposta.json();
    if (dados.erro) {
      alert('CEP não encontrado.');
      return;
    }
    document.getElementById('campo-endereco').value = dados.logradouro || '';
    document.getElementById('campo-bairro').value = dados.bairro || '';
    document.getElementById('campo-cidade').value = dados.localidade || '';
    document.getElementById('campo-uf').value = dados.uf || '';
  } catch (erro) {
    alert('Não foi possível consultar o CEP. Verifique sua conexão com a internet.');
  }
}

function salvarPessoa(event, tipo, id) {
  event.preventDefault();
  if (!podeCadastrar(tipo)) {
    alert('Você não tem permissão para cadastrar/editar nesta área.');
    return false;
  }
  const dados = {};
  CAMPOS_PESSOA.forEach(([chave]) => {
    dados[chave] = document.getElementById('campo-' + chave).value.trim();
  });
  if (tipo === 'clientes') {
    CAMPOS_EXTRA_CLIENTE.forEach(([chave]) => {
      dados[chave] = document.getElementById('campo-' + chave).value.trim();
    });
  }
  if (!dados.razao_social) {
    alert('Informe a Razão Social.');
    return false;
  }

  const lista = loadList(tipo);
  if (id) {
    const idx = lista.findIndex(p => p.id === id);
    lista[idx] = { ...lista[idx], ...dados };
  } else {
    dados.id = nextId(lista);
    lista.push(dados);
  }
  saveList(tipo, lista);
  fecharModal();
  renderPessoaSection(tipo);
  return false;
}

function excluirPessoa(tipo, id) {
  if (!podeCadastrar(tipo)) {
    alert('Você não tem permissão para excluir nesta área.');
    return;
  }
  if (!confirm('Deseja realmente excluir este registro?')) return;
  const lista = loadList(tipo).filter(p => p.id !== id);
  saveList(tipo, lista);
  renderPessoaSection(tipo);
}

let produtosFiltroAtual = '';

function normalizarTextoBusca(texto) {
  return String(texto ?? '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

// C\u00f3digos similares sao guardados como lista de {codigo, marca}. Estas fun\u00e7\u00f5es tambem leem
// o formato antigo (lista simples de strings) de cadastros feitos antes dessa mudan\u00e7a.
function codigosSimilares(produto) {
  if (!produto || !Array.isArray(produto.similares)) return [];
  return produto.similares
    .map(item => (typeof item === 'string' ? item : (item && item.codigo) || ''))
    .filter(Boolean);
}

function textoSimilares(produto) {
  if (!produto || !Array.isArray(produto.similares)) return '';
  return produto.similares
    .map(item => {
      if (typeof item === 'string') return item;
      if (!item || !item.codigo) return '';
      return item.marca ? `${item.codigo} (${item.marca})` : item.codigo;
    })
    .filter(Boolean)
    .join(', ');
}

function filtrarProdutosPorTermo(produtos, termoBusca) {
  const fragmentos = normalizarTextoBusca(termoBusca)
    .split('*')
    .map(f => f.trim())
    .filter(Boolean);

  if (!fragmentos.length) return produtos;

  return produtos.filter(p => {
    const alvo = normalizarTextoBusca([
      p.cod_interno || '',
      p.cod_original || '',
      p.descricao || '',
      textoSimilares(p),
    ].join(' '));
    return fragmentos.every(frag => alvo.includes(frag));
  });
}

function estoqueBadge(p) {
  const atual = Number(p.estoque_atual) || 0;
  const minimo = Number(p.estoque_minimo) || 0;
  if (minimo > 0 && atual <= minimo) {
    return `<span class="status-badge status-vencido">${atual} (baixo)</span>`;
  }
  return String(atual);
}

  '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331',
  '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111',
  '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214',
  '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111',

];

function textoSeguroCode128(texto) {
  return String(texto == null ? '' : texto).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^\x20-\x7E]/g, '-');
}

/* Devolve os módulos do Code 128 como texto de 0/1 (1 = barra). Usa o conjunto C (mais compacto)
   quando o texto é só de dígitos com tamanho par; senão usa o conjunto B (ASCII). */
function modulosCode128(textoOriginal) {
  const texto = textoSeguroCode128(textoOriginal);
  const codigos = [];
  if (/^\d{4,}$/.test(texto) && texto.length % 2 === 0) {
    codigos.push(105);
    for (let i = 0; i < texto.length; i += 2) codigos.push(parseInt(texto.slice(i, i + 2), 10));
  } else {
    codigos.push(104);
    for (const ch of texto) codigos.push(ch.charCodeAt(0) - 32);
  }
  let soma = codigos[0];
  for (let i = 1; i < codigos.length; i++) soma += codigos[i] * i;
  codigos.push(soma % 103, 106);
  let saida = '';
  codigos.forEach(c => {
    let barra = true;
    for (const largura of CODE128_PADROES[c]) {
      saida += (barra ? '1' : '0').repeat(Number(largura));
      barra = !barra;
    }
  });
  return saida;
}

const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'];
const EAN_R = EAN_L.map(p => p.replace(/[01]/g, d => (d === '0' ? '1' : '0')));
const EAN_PARIDADE = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];

function digitoVerificadorEan(corpo) {
  let soma = 0;
  for (let i = 0; i < corpo.length; i++) {
    const d = Number(corpo[corpo.length - 1 - i]);
    soma += d * (i % 2 === 0 ? 3 : 1);
  }
  return (10 - (soma % 10)) % 10;
}

/* Aceita EAN-13, UPC-A (12 dígitos, vira EAN-13 com 0 na frente) e EAN-8 com dígito verificador certo. */
function normalizarEan(texto) {
  let d = String(texto || '').replace(/\D/g, '');
  if (d.length === 12) d = '0' + d;
  if (![8, 13].includes(d.length)) return '';
  return digitoVerificadorEan(d.slice(0, -1)) === Number(d[d.length - 1]) ? d : '';
}

function modulosEan(digitos) {
  if (digitos.length === 13) {
    const paridade = EAN_PARIDADE[Number(digitos[0])];
    let m = '101';
    for (let i = 0; i < 6; i++) m += (paridade[i] === 'L' ? EAN_L : EAN_G)[Number(digitos[i + 1])];
    m += '01010';
    for (let i = 7; i < 13; i++) m += EAN_R[Number(digitos[i])];
    return m + '101';
  }
  let m = '101';
  for (let i = 0; i < 4; i++) m += EAN_L[Number(digitos[i])];
  m += '01010';
  for (let i = 4; i < 8; i++) m += EAN_R[Number(digitos[i])];
  return m + '101';
}

/* Desenha os módulos como SVG (com margem silenciosa de 10 módulos de cada lado). */
function svgCodigoBarras(modulos) {
  const margem = 10;
  const retangulos = [];
  let i = 0;
  while (i < modulos.length) {
    if (modulos[i] === '1') {
      let j = i;
      while (j < modulos.length && modulos[j] === '1') j++;
      retangulos.push(`<rect x="${i + margem}" y="0" width="${j - i}" height="100"/>`);
      i = j;
    } else i++;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${modulos.length + margem * 2} 100" preserveAspectRatio="none" shape-rendering="crispEdges" fill="#000"><rect x="0" y="0" width="${modulos.length + margem * 2}" height="100" fill="#fff"/>${retangulos.join('')}</svg>`;
}

/* Define o que vai no código de barras: GTIN/EAN do cadastro (se válido) ou o código interno. */
function dadosCodigoBarrasProduto(produto, fonte) {
  const ean = normalizarEan(produto.gtin_venda);
  const interno = String(produto.cod_interno || produto.cod_original || '').trim();
  if (fonte !== 'interno' && ean) return { valor: ean, modulos: modulosEan(ean), tipo: 'EAN' };
  const valor = interno || String(produto.gtin_venda || '').trim();
  return valor ? { valor, modulos: modulosCode128(valor), tipo: 'Code128' } : null;
}

function htmlEtiquetaProduto(produto, opcoes) {
  const larg = opcoes.largura, alt = opcoes.altura;
  const cb = dadosCodigoBarrasProduto(produto, opcoes.fonte);
  const interno = String(produto.cod_interno || produto.cod_original || '-');
  const base = Math.max(6, Math.min(alt / 3.2, larg / 6)); // tamanho de fonte-base em pt, proporcional à etiqueta
  return `
    <div class="etq" style="width:${larg}mm;height:${alt}mm;">
      <div class="etq-topo">
        <span class="etq-cod" style="font-size:${(base * 1.25).toFixed(1)}pt">${escapeHtml(interno)}</span>
        <span class="etq-loc" style="font-size:${(base * 1.05).toFixed(1)}pt">${produto.localizacao ? 'LOC: ' + escapeHtml(produto.localizacao) : ''}</span>
      </div>
      <div class="etq-desc" style="font-size:${base.toFixed(1)}pt">${escapeHtml(produto.descricao || '')}</div>
      <div class="etq-barras">${cb ? svgCodigoBarras(cb.modulos) : '<em style="font-size:7pt">sem código de barras</em>'}</div>
      <div class="etq-num" style="font-size:${(base * 0.9).toFixed(1)}pt">${cb ? escapeHtml(cb.valor) : ''}</div>
    </div>`;
}

  .etq-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 2mm; }

  .etq-barras { flex: 1 1 0; min-height: 0; margin-top: .6mm; position: relative; }
  .etq-barras svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .etq-topo, .etq-desc, .etq-num { flex: 0 0 auto; }
  .etq-num { text-align: center; letter-spacing: .15em; line-height: 1.1; }
`;

function opcoesEtiquetaDaTela() {
  let tam = document.getElementById('etq-tam').value;
  document.getElementById('etq-outro').style.display = tam === 'outro' ? '' : 'none';
  let largura, altura;
  if (tam === 'outro') {
    largura = Math.min(150, Math.max(20, Number(document.getElementById('etq-larg').value) || 50));
    altura = Math.min(150, Math.max(15, Number(document.getElementById('etq-alt').value) || 30));
  } else [largura, altura] = tam.split('x').map(Number);
  return {
    largura, altura,
    fonte: document.getElementById('etq-fonte').value,
    quantidade: Math.min(500, Math.max(1, Math.floor(Number(document.getElementById('etq-qtd').value) || 1))),
  };
}

function atualizarPreviaEtiqueta(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  document.getElementById('etq-previa').innerHTML = htmlEtiquetaProduto(produto, opcoesEtiquetaDaTela());
}

/* Cada etiqueta sai em uma página do tamanho exato dela (impressoras térmicas de etiqueta). */
function imprimirEtiquetaProduto(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  const o = opcoesEtiquetaDaTela();
  const w = window.open('', '_blank', 'width=520,height=420');
  if (!w) { alert('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.'); return; }
  const uma = htmlEtiquetaProduto(produto, o);
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Etiqueta ${escapeHtml(produto.cod_interno || produto.descricao)}</title>
    <style>
      @page { size: ${o.largura}mm ${o.altura}mm; margin: 0; }
      html, body { margin: 0; padding: 0; }
      .pagina { width: ${o.largura}mm; height: ${o.altura}mm; page-break-after: always; break-after: page; overflow: hidden; }
      .pagina:last-child { page-break-after: auto; break-after: auto; }
      ${ETIQUETA_CSS}
      @media screen { body { background: #ddd; } .pagina { margin: 6px auto; background: #fff; } }
    </style></head><body>${Array.from({ length: o.quantidade }, () => `<div class="pagina">${uma}</div>`).join('')}
    <script>window.onload = function () { window.print(); }<\/script></body></html>`);
  w.document.close();
}

function custoRealProduto(p) {

}

/* Painel de "Último Movimento" de um produto: a última venda (NF do cliente, cliente e valor
   vendido), a última compra (NF do fornecedor, fornecedor e valor de custo de entrada) e,
   quando a compra teve devolução registrada, a devolução ao fornecedor logo abaixo dela. */
function abrirUltimoMovimentoProduto(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;

  const clientes = loadList('clientes');
  const fornecedores = loadList('fornecedores');

  const vendasComItem = loadList('vendas')
    .filter(v => (v.itens || []).some(it => it.produto_id === produtoId))
    .map(v => ({ venda: v, item: v.itens.find(it => it.produto_id === produtoId) }))
    .sort((a, b) => (b.venda.data_venda || '').localeCompare(a.venda.data_venda || ''));
  const ultimaVenda = vendasComItem[0] || null;

  const comprasComItem = loadList('compras')
    .filter(c => (c.itens || []).some(it => it.produto_id === produtoId))
    .map(c => ({ compra: c, item: c.itens.find(it => it.produto_id === produtoId) }))
    .sort((a, b) => (b.compra.data_compra || '').localeCompare(a.compra.data_compra || ''));
  const ultimaCompra = comprasComItem[0] || null;

  let blocoVenda;
  if (ultimaVenda) {
    const cliente = clientes.find(c => c.id === ultimaVenda.venda.cliente_id);
    blocoVenda = `
      <div class="info-cliente-caixa">
        <div><strong>Data:</strong> ${ultimaVenda.venda.data_venda ? formatarDataBr(ultimaVenda.venda.data_venda) : '-'}</div>
        <div><strong>NF do Cliente:</strong> ${escapeHtml(ultimaVenda.venda.numero_nf || 'Pendente de emissão')}</div>
        <div><strong>Cliente:</strong> ${escapeHtml(cliente ? cliente.razao_social : 'Não cadastrado')}</div>
        <div><strong>Valor Vendido:</strong> ${formatarMoeda(ultimaVenda.item.valor_unitario)}</div>
      </div>
    `;
  } else {
    blocoVenda = '<div class="aviso">Nenhuma venda registrada para este produto.</div>';
  }

  let blocoCompra;
  let blocoDevolucao = '';
  if (ultimaCompra) {
    const fornecedor = fornecedores.find(f => f.id === ultimaCompra.compra.fornecedor_id);
    blocoCompra = `
      <div class="info-cliente-caixa">
        <div><strong>Data:</strong> ${ultimaCompra.compra.data_compra ? formatarDataBr(ultimaCompra.compra.data_compra) : '-'}</div>
        <div><strong>NF do Fornecedor:</strong> ${escapeHtml(ultimaCompra.compra.numero_nf || '-')}</div>
        <div><strong>Fornecedor:</strong> ${escapeHtml(fornecedor ? fornecedor.razao_social : 'Não cadastrado')}</div>
        <div><strong>Valor Custo de Entrada:</strong> ${formatarMoeda(ultimaCompra.item.valor_unitario)}</div>
      </div>
    `;
    if (ultimaCompra.compra.devolucao_numero_nf) {
      blocoDevolucao = `
        <h3 style="margin-top:16px">Devolução ao Fornecedor</h3>
        <div class="info-cliente-caixa">
          <div><strong>Data:</strong> ${ultimaCompra.compra.devolucao_data ? formatarDataBr(ultimaCompra.compra.devolucao_data) : '-'}</div>
          <div><strong>NF de Devolução:</strong> ${escapeHtml(ultimaCompra.compra.devolucao_numero_nf)}</div>
          <div><strong>Fornecedor:</strong> ${escapeHtml(fornecedor ? fornecedor.razao_social : 'Não cadastrado')}</div>
          <div><strong>Valor:</strong> ${formatarMoeda(ultimaCompra.compra.devolucao_valor)}</div>
        </div>
      `;
    } else {
      blocoDevolucao = '<div class="aviso" style="margin-top:12px">Sem devolução registrada para esta compra.</div>';
    }
  } else {
    blocoCompra = '<div class="aviso">Nenhuma compra registrada para este produto.</div>';
  }

  abrirModal(`
    <h2>Último Movimento — ${escapeHtml(produto.descricao)}</h2>
    <h3>Última Venda</h3>
    ${blocoVenda}
    <h3 style="margin-top:16px">Última Compra</h3>
    ${blocoCompra}
    ${blocoDevolucao}
    <div class="modal-botoes">
      <button type="button" class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
  `);
}

function clonarProduto(id) {
  if (!podeCadastrar('produtos')) {
    alert('Você não tem permissão para cadastrar produtos.');
    return;
  }
  const lista = loadList('produtos');
  const original = lista.find(p => p.id === id);
  if (!original) return;
  if (!confirm(`Clonar o produto "${original.descricao}"? Um novo cadastro será criado para você ajustar código e descrição.`)) return;

  const clone = JSON.parse(JSON.stringify(original));
  clone.id = nextId(lista);
  clone.cod_interno = original.cod_interno ? original.cod_interno + '-COPIA' : '';
  clone.descricao = original.descricao ? original.descricao + ' (Cópia)' : '(Cópia)';
  clone.estoque_atual = 0;
  lista.push(clone);
  saveList('produtos', lista);
  atualizarTabelaProdutos();
  abrirFormProduto(clone.id);
}

function renderCampoProduto(definicao, registro) {
  const [chave, rotulo, tipo, opcoes] = definicao;
  let valorInicial = '';
  if (registro) {
    valorInicial = registro[chave] ?? '';
  }

  if (tipo === 'select') {
    const optionsHtml = opcoes.map(opcao => `
      <option value="${escapeHtml(opcao)}" ${valorInicial === opcao ? 'selected' : ''}>${escapeHtml(opcao)}</option>
    `).join('');
    return `
      <div class="campo">
        <label>${rotulo}</label>
        <select id="campo-${chave}">${optionsHtml}</select>
      </div>
    `;
  }

  if (tipo === 'textarea') {
    return `
      <div class="campo">
        <label>${rotulo}</label>
        <textarea id="campo-${chave}" rows="3">${escapeHtml(valorInicial)}</textarea>
      </div>
    `;
  }

  const gatilhoRecalculo = (chave === 'valor_custo' || chave === 'margem_lucro') ? ' oninput="recalcularVendaForm()"' : '';
  return `
    <div class="campo">
      <label>${rotulo}</label>
      <input type="text" id="campo-${chave}" value="${escapeHtml(valorInicial)}"${gatilhoRecalculo}>
    </div>
  `;
}

function adicionarSimilarProduto() {
  const codigoEl = document.getElementById('similar-novo-codigo');
  const marcaEl = document.getElementById('similar-novo-marca');
  const codigo = codigoEl.value.trim();
  const marca = marcaEl.value.trim();
  if (!codigo) {
    alert('Informe o código similar.');
    return;
  }
  if (similaresProdutoTemp.some(item => item.codigo === codigo && (item.marca || '') === marca)) {
    alert('Esse código similar já foi adicionado.');
    return;
  }

  const marcaAtual = (document.getElementById('campo-marca').value || '').trim();
  const marcaDiferente = !!(marca && marcaAtual && normalizarTextoBusca(marca) !== normalizarTextoBusca(marcaAtual));

  similaresProdutoTemp.push({ codigo, marca });
  codigoEl.value = '';
  marcaEl.value = '';
  codigoEl.focus();
  renderSimilaresProdutoTemp();

  if (marcaDiferente) {
    clonarProdutoParaSimilarDeOutraMarca(codigo, marca, marcaAtual);
  }
}

/* Quando um similar é adicionado com uma marca diferente da marca do produto que está sendo
   editado, cria automaticamente um cadastro de produto separado para essa outra marca (mesmo
   padrão do botão "Clonar Produto", com estoque zerado para o usuário ajustar) — marcas
   diferentes de uma mesma peça normalmente têm estoque e preço próprios. O produto clonado já
   fica com uma referência de similar de volta para o produto original, para a busca encontrar
   os dois lados. Só acontece com produtos já salvos (com id); num cadastro novo ainda não
   salvo, o similar é só adicionado à lista normalmente. */
function clonarProdutoParaSimilarDeOutraMarca(codigoSimilar, marcaSimilar, marcaOriginal) {
  if (!produtoEmEdicaoId) {
    alert(`Similar da marca "${marcaSimilar}" adicionado à lista. Como este produto ainda não foi salvo, a clonagem automática para essa marca só ocorre depois que você salvar o produto pela primeira vez.`);
    return;
  }

  const lista = loadList('produtos');
  const original = lista.find(p => p.id === produtoEmEdicaoId);
  if (!original) return;

  const jaExisteProdutoParaEssaMarca = lista.some(p =>
    p.id !== original.id &&
    normalizarTextoBusca(p.cod_original || '') === normalizarTextoBusca(codigoSimilar) &&
    normalizarTextoBusca(p.marca || '') === normalizarTextoBusca(marcaSimilar)
  );
  if (jaExisteProdutoParaEssaMarca) {
    alert(`Já existe um produto cadastrado com o código "${codigoSimilar}" da marca "${marcaSimilar}" — nenhum novo cadastro foi criado.`);
    return;
  }

  const clone = JSON.parse(JSON.stringify(original));
  clone.id = nextId(lista);
  clone.cod_interno = gerarCodigoInternoAleatorio();
  clone.cod_original = codigoSimilar;
  clone.marca = marcaSimilar;
  clone.estoque_atual = 0;
  clone.similares = (Array.isArray(original.similares) ? original.similares : [])
    .filter(item => !(item && item.codigo === codigoSimilar && (item.marca || '') === marcaSimilar));
  if (original.cod_original) {
    clone.similares.push({ codigo: original.cod_original, marca: marcaOriginal });
  }

  lista.push(clone);
  saveList('produtos', lista);
  alert(`Produto clonado automaticamente para a marca "${marcaSimilar}" (código ${codigoSimilar}), com estoque zerado. Ajuste os dados dele quando quiser, em Produtos.`);
}

function removerSimilarProduto(indice) {
  similaresProdutoTemp.splice(indice, 1);
  renderSimilaresProdutoTemp();
}

function renderSimilaresProdutoTemp() {
  const container = document.getElementById('similares-lista-produto');
  if (!container) return;
  if (!similaresProdutoTemp.length) {
    container.innerHTML = '<div class="vazio" style="padding:4px 0">Nenhum código similar adicionado.</div>';
    return;
  }
  container.innerHTML = similaresProdutoTemp.map((item, idx) => `
    <span class="tag-similar">
      ${escapeHtml(item.codigo)}${item.marca ? ' (' + escapeHtml(item.marca) + ')' : ''}
      <button type="button" onclick="removerSimilarProduto(${idx})" title="Remover">&times;</button>
    </span>
  `).join('');
}

/* Redimensiona a imagem no navegador (lado maior até maxLargura, convertendo para JPEG)
   antes de guardar em base64, para não deixar o cadastro de produtos pesado demais
   com fotos em resolução de câmera/celular. */
function redimensionarImagem(arquivo, maxLargura) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maxLargura / Math.max(img.width, img.height));
        const largura = Math.round(img.width * escala);
        const altura = Math.round(img.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = largura;
        canvas.height = altura;
        canvas.getContext('2d').drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = leitor.result;
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(arquivo);
  });
}

async function previewFotoProduto(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;
  try {
    const dataUrl = await redimensionarImagem(arquivo, 900);
    fotoProdutoTemp = dataUrl;
    const preview = document.getElementById('produto-foto-preview');
    const placeholder = document.getElementById('produto-foto-placeholder');
    const botaoRemover = document.getElementById('produto-foto-botao-remover');
    preview.src = dataUrl;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
    botaoRemover.style.display = '';
  } catch (erro) {
    alert('Não foi possível ler essa imagem. Tente outro arquivo.');
  }
}

function removerFotoProduto() {
  fotoProdutoTemp = null;
