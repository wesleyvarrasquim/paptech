function recalcularVendaForm() {
  const custoEl = document.getElementById('campo-valor_custo');
  const margemEl = document.getElementById('campo-margem_lucro');
  const freteEl = document.getElementById('campo-frete_compra');
  const despesasEl = document.getElementById('campo-outras_despesas');
  const previewEl = document.getElementById('valor-venda-preview');
  const custoRealEl = document.getElementById('custo-real-preview');
  if (!custoEl || !margemEl || !previewEl) return;

  const custo = numeroBr(custoEl.value);
  const margem = numeroBr(margemEl.value);
  const frete = freteEl ? numeroBr(freteEl.value) : 0;
  const despesas = despesasEl ? numeroBr(despesasEl.value) : 0;
  const custoReal = custo + frete + despesas;

  if (custoRealEl) custoRealEl.textContent = formatarMoeda(custoReal);
  previewEl.textContent = formatarMoeda(custoReal * (1 + margem / 100));
}

function salvarProduto(event, id) {
  event.preventDefault();
  if (!podeCadastrar('produtos')) {
    alert('Você não tem permissão para cadastrar/editar produtos.');
    return false;
  }
  const dados = {};

  [...CAMPOS_PRODUTO_GERAL, ...CAMPOS_PRODUTO_IMPOSTOS, ...CAMPOS_PRODUTO_ADICIONAIS].forEach(([chave]) => {
    dados[chave] = document.getElementById('campo-' + chave).value.trim();
  });

  dados.frete_compra = document.getElementById('campo-frete_compra').value.trim();
  dados.outras_despesas = document.getElementById('campo-outras_despesas').value.trim();
  dados.estoque_minimo = document.getElementById('campo-estoque_minimo').value.trim();
  dados.estoque_maximo = document.getElementById('campo-estoque_maximo').value.trim();
  dados.baixa_automatica = document.getElementById('campo-baixa_automatica').checked;
  dados.fornecedor_principal_id = document.getElementById('campo-fornecedor_principal_id').value;
  dados.codigo_no_fornecedor = document.getElementById('campo-codigo_no_fornecedor').value.trim();
  dados.custo_fornecedor = document.getElementById('campo-custo_fornecedor').value.trim();
  dados.desc_percentual_fornecedor = document.getElementById('campo-desc_percentual_fornecedor').value.trim();
  dados.ipi_percentual_fornecedor = document.getElementById('campo-ipi_percentual_fornecedor').value.trim();
  dados.perc_aumento_fornecedor = document.getElementById('campo-perc_aumento_fornecedor').value.trim();
  dados.comentarios = document.getElementById('campo-comentarios').value.trim();

  if (!dados.descricao) {
    alert('Informe a Descrição do produto.');
    return false;
  }

  [
    'peso', 'valor_custo', 'margem_lucro', 'aliquota_icms', 'aliquota_ipi', 'aliquota_pis', 'aliquota_cofins',
    'frete_compra', 'outras_despesas', 'estoque_minimo', 'estoque_maximo', 'comissao', 'desconto_maximo',
    'custo_fornecedor', 'desc_percentual_fornecedor', 'ipi_percentual_fornecedor', 'perc_aumento_fornecedor',
  ].forEach(campo => {
    dados[campo] = numeroBr(dados[campo]);
  });

  dados.fornecedor_principal_id = dados.fornecedor_principal_id ? Number(dados.fornecedor_principal_id) : null;

  const custoReal = dados.valor_custo + dados.frete_compra + dados.outras_despesas;
  dados.valor_venda = custoReal * (1 + dados.margem_lucro / 100);

  dados.similares = similaresProdutoTemp.slice();
  dados.foto_base64 = fotoProdutoTemp || '';

  const lista = loadList('produtos');
  if (id) {
    const idx = lista.findIndex(p => p.id === id);
    lista[idx] = { ...lista[idx], ...dados };
  } else {
    dados.id = nextId(lista);
    dados.estoque_atual = 0;
    lista.push(dados);
  }
  saveList('produtos', lista);
  fecharModal();
  atualizarTabelaProdutos();
  return false;
}

function excluirProduto(id) {
  if (!podeCadastrar('produtos')) {
    alert('Você não tem permissão para excluir produtos.');
    return;
  }
  if (!confirm('Deseja realmente excluir este produto?')) return;
  const lista = loadList('produtos').filter(p => p.id !== id);
  saveList('produtos', lista);
  atualizarTabelaProdutos();
}

function abrirMovimentoEstoque(produtoIdPreSelecionado) {

    return;

  produtoSelecionadoMovimento = produtoIdPreSelecionado
    ? loadList('produtos').find(p => p.id === produtoIdPreSelecionado) || null
    : null;

  abrirModal(`

      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);

  if (produtoSelecionadoMovimento) {

  }
}

function filtrarProdutosMovimento() {
  const campoBusca = document.getElementById('mov-busca-produto');
  const resultadosEl = document.getElementById('mov-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoMovimento && campoBusca.value !== produtoSelecionadoMovimento.descricao) {
    produtoSelecionadoMovimento = null;
    document.getElementById('mov-produto-info').style.display = 'none';
    document.getElementById('mov-historico').innerHTML = '';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoMovimento(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Estoque atual: ${Number(p.estoque_atual) || 0}</small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoMovimento(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  produtoSelecionadoMovimento = produto;

  document.getElementById('mov-busca-produto').value = produto.descricao;
  document.getElementById('mov-produto-resultados').innerHTML = '';
  document.getElementById('mov-produto-resultados').style.display = 'none';
  atualizarInfoProdutoMovimento();
}

function atualizarInfoProdutoMovimento() {
  const produto = produtoSelecionadoMovimento;
  const infoEl = document.getElementById('mov-produto-info');
  const historicoEl = document.getElementById('mov-historico');
  if (!produto || !infoEl) return;

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Produto:</strong> ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</div>
    <div><strong>Estoque Atual:</strong> ${Number(produto.estoque_atual) || 0} ${escapeHtml(produto.unidade_medida || '')}</div>
  `;

  const movimentos = loadList('movimentos_estoque')
    .filter(m => m.produto_id === produto.id)
    .slice(-5)
    .reverse();

  if (movimentos.length && historicoEl) {
    historicoEl.innerHTML = `
      <h3 style="margin-top:14px">Últimos movimentos deste produto</h3>
      <table class="data-table">
        <thead><tr><th>Data</th><th>Tipo</th><th>Qtd.</th><th>Motivo</th><th>Estoque Resultante</th></tr></thead>
        <tbody>
          ${movimentos.map(m => `
            <tr>
              <td>${formatarDataBr(m.data)}</td>
              <td>${m.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td>
              <td>${m.quantidade}</td>
              <td>${escapeHtml(m.motivo || '-')}</td>
              <td>${m.estoque_resultante}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else if (historicoEl) {
    historicoEl.innerHTML = '';
  }
}

function confirmarMovimentoEstoque() {
  if (!produtoSelecionadoMovimento) {
    alert('Busque e selecione um produto.');
    return;
  }
  const tipo = document.getElementById('mov-tipo').value;
  const quantidade = numeroBr(document.getElementById('mov-quantidade').value);
  const motivo = document.getElementById('mov-motivo').value.trim();

  if (!quantidade || quantidade <= 0) {
    alert('Informe uma quantidade válida.');
    return;
  }

  const produtos = loadList('produtos');
  const produto = produtos.find(p => p.id === produtoSelecionadoMovimento.id);
  if (!produto) return;

  const estoqueAtual = Number(produto.estoque_atual) || 0;
  if (tipo === 'saida' && quantidade > estoqueAtual) {
    if (!confirm(`A saída de ${quantidade} é maior que o estoque atual (${estoqueAtual}) e deixará o estoque negativo. Deseja continuar?`)) {
      return;
    }
  }

  produto.estoque_atual = tipo === 'entrada' ? estoqueAtual + quantidade : estoqueAtual - quantidade;
  saveList('produtos', produtos);

  const movimentos = loadList('movimentos_estoque');
  movimentos.push({
    id: nextId(movimentos),
    produto_id: produto.id,
    tipo: tipo,
    quantidade: quantidade,
    motivo: motivo,
    data: new Date().toISOString().slice(0, 10),
    estoque_resultante: produto.estoque_atual,
  });
  saveList('movimentos_estoque', movimentos);

  fecharModal();
  atualizarTabelaProdutos();
}

function excluirCompra(id) {
  const compras = loadList('compras');
  const compra = compras.find(c => c.id === id);
  const temEntrada = !!(compra && compra.entrada_dada);
  const mensagem = temEntrada
    ? 'Deseja realmente excluir esta compra? O estoque que entrou será retirado e as parcelas geradas em Contas a Pagar serão removidas.'
    : 'Deseja realmente excluir esta compra?';
  if (!confirm(mensagem)) return;
  if (temEntrada) {
    reverterEntradaEstoqueCompra(compra.itens || []);
    removerContasPagarDaCompra(id);
  }
  saveList('compras', compras.filter(c => c.id !== id));
  renderCompras();
}

/* Devolução da mercadoria desta compra ao fornecedor (nota de devolução). Guardada direto na
   compra (numero/valor/data) — simples o bastante para a maioria dos casos, já que uma
   devolução normalmente responde por um pedido de compra inteiro. */
function abrirDevolucaoCompra(id) {
  const compra = loadList('compras').find(c => c.id === id);
  if (!compra) return;
  const fornecedor = loadList('fornecedores').find(f => f.id === compra.fornecedor_id);

  abrirModal(`
    <h2>Devolução ao Fornecedor — Compra #${compra.id}</h2>
    <div class="aviso">Fornecedor: <strong>${escapeHtml(fornecedor ? fornecedor.razao_social : 'Não cadastrado')}</strong> &nbsp; (NF da compra: ${escapeHtml(compra.numero_nf || '-')})</div>
    <div class="campo">
      <label>Número da NF de Devolução</label>
      <input type="text" id="devolucao-numero-nf" value="${escapeHtml(compra.devolucao_numero_nf || '')}">
    </div>
    <div class="campo">
      <label>Data da Devolução</label>
      <input type="date" id="devolucao-data" value="${escapeHtml(compra.devolucao_data || new Date().toISOString().slice(0, 10))}">
    </div>
    <div class="campo">
      <label>Valor Devolvido</label>
      <input type="text" id="devolucao-valor" value="${(Number(compra.devolucao_valor) || 0).toFixed(2).replace('.', ',')}">
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarDevolucaoCompra(${compra.id})">Salvar</button>
      ${compra.devolucao_numero_nf ? `<button type="button" class="btn-perigo" onclick="removerDevolucaoCompra(${compra.id})">Remover Devolução</button>` : ''}
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function confirmarDevolucaoCompra(id) {
  const compras = loadList('compras');
  const idx = compras.findIndex(c => c.id === id);
  if (idx === -1) return;
  const numeroNf = document.getElementById('devolucao-numero-nf').value.trim();
  const data = document.getElementById('devolucao-data').value;
  const valor = numeroBr(document.getElementById('devolucao-valor').value);
  if (!numeroNf) {
    alert('Informe o número da NF de devolução.');
    return;
  }
  compras[idx] = { ...compras[idx], devolucao_numero_nf: numeroNf, devolucao_data: data, devolucao_valor: valor };
  saveList('compras', compras);
  fecharModal();
  renderCompras();
}

function removerDevolucaoCompra(id) {
  if (!confirm('Remover o registro de devolução desta compra?')) return;
  const compras = loadList('compras');
  const idx = compras.findIndex(c => c.id === id);
  if (idx === -1) return;
  compras[idx] = { ...compras[idx], devolucao_numero_nf: '', devolucao_data: '', devolucao_valor: 0 };
  saveList('compras', compras);
  fecharModal();
  renderCompras();
}

function atualizarInfoFornecedorCompra() {
  const select = document.getElementById('compra-fornecedor');
  const infoEl = document.getElementById('compra-info-fornecedor');
  if (!select || !infoEl) return;

  if (!select.value) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const fornecedor = loadList('fornecedores').find(f => f.id === Number(select.value));
  if (!fornecedor) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const comprasFornecedor = loadList('compras')
    .filter(c => c.fornecedor_id === fornecedor.id)
    .sort((a, b) => (a.data_compra || '').localeCompare(b.data_compra || ''));
  const ultimaCompra = comprasFornecedor.length
    ? `${formatarDataBr(comprasFornecedor[comprasFornecedor.length - 1].data_compra)} — ${formatarMoeda(comprasFornecedor[comprasFornecedor.length - 1].valor_total)}`
    : 'Nenhuma compra anterior';

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Endereço:</strong> ${escapeHtml(fornecedor.endereco || '-')}${fornecedor.numero ? ', ' + escapeHtml(fornecedor.numero) : ''}${fornecedor.bairro ? ' - ' + escapeHtml(fornecedor.bairro) : ''}</div>
    <div><strong>Cidade/UF:</strong> ${escapeHtml(fornecedor.cidade || '-')}${fornecedor.uf ? '/' + escapeHtml(fornecedor.uf) : ''} &nbsp; <strong>CEP:</strong> ${escapeHtml(fornecedor.cep || '-')}</div>
    <div><strong>Telefone:</strong> ${escapeHtml(fornecedor.telefone || '-')} &nbsp; <strong>I.E.:</strong> ${escapeHtml(fornecedor.inscricao_estadual || '-')}</div>
    <div><strong>Última Compra:</strong> ${ultimaCompra}</div>
  `;
}

function filtrarProdutosCompra() {
  const campoBusca = document.getElementById('compra-busca-produto');
  const resultadosEl = document.getElementById('compra-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoCompra && campoBusca.value !== produtoSelecionadoCompra.descricao) {
    produtoSelecionadoCompra = null;
    document.getElementById('compra-produto-selecionado').style.display = 'none';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoCompra(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>
        Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Cód. Original: ${escapeHtml(p.cod_original || '-')}
        ${textoSimilares(p) ? ` | Similares: ${escapeHtml(textoSimilares(p))}` : ''}
        | Custo: ${formatarMoeda(p.valor_custo)}
      </small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoCompra(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  produtoSelecionadoCompra = produto;

  document.getElementById('compra-busca-produto').value = produto.descricao;
  document.getElementById('compra-produto-resultados').innerHTML = '';
  document.getElementById('compra-produto-resultados').style.display = 'none';
  document.getElementById('item-valor-unit').value = (Number(produto.valor_custo) || 0).toFixed(2).replace('.', ',');
  document.getElementById('item-icms').value = (Number(produto.aliquota_icms) || 0).toFixed(2).replace('.', ',');
  document.getElementById('item-ipi').value = (Number(produto.aliquota_ipi) || 0).toFixed(2).replace('.', ',');

  const infoEl = document.getElementById('compra-produto-selecionado');
  infoEl.style.display = 'flex';
  infoEl.innerHTML = `
    <span>Selecionado: ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</span>
    <button type="button" onclick="limparProdutoSelecionadoCompra()" title="Remover seleção">&times;</button>
  `;
}

function limparProdutoSelecionadoCompra() {
  produtoSelecionadoCompra = null;
  document.getElementById('compra-busca-produto').value = '';
  document.getElementById('compra-produto-selecionado').style.display = 'none';
  document.getElementById('compra-produto-selecionado').innerHTML = '';
}

function adicionarItemCompra() {
  if (!produtoSelecionadoCompra) {
    alert('Busque e selecione um produto antes de adicionar.');
    return;
  }
  const quantidade = numeroBr(document.getElementById('item-quantidade').value);
  const valorUnit = numeroBr(document.getElementById('item-valor-unit').value);
  const icms = numeroBr(document.getElementById('item-icms').value);
  const ipi = numeroBr(document.getElementById('item-ipi').value);
  if (!quantidade || quantidade <= 0) {
    alert('Informe uma quantidade válida.');
    return;
  }
  itensCompraTemp.push({
    produto_id: produtoSelecionadoCompra.id,
    descricao: produtoSelecionadoCompra.descricao,
    quantidade: quantidade,
    icms_percentual: icms,
    ipi_percentual: ipi,
    valor_unitario: valorUnit,
    valor_total: quantidade * valorUnit,
  });
  atualizarTabelaItensTemp();
  limparProdutoSelecionadoCompra();
  document.getElementById('item-quantidade').value = '1';
  document.getElementById('item-icms').value = '0,00';
  document.getElementById('item-ipi').value = '0,00';
  document.getElementById('item-valor-unit').value = '0,00';
}

function removerItemCompra(indice) {
  itensCompraTemp.splice(indice, 1);
  atualizarTabelaItensTemp();
}

function atualizarTabelaItensTemp() {
  const tbody = document.getElementById('itens-compra-tbody');
  if (!tbody) return;
  tbody.innerHTML = itensCompraTemp.map((it, idx) => `
    <tr>
      <td>${escapeHtml(it.descricao)}</td>
      <td>${it.quantidade}</td>
      <td>${(Number(it.icms_percentual) || 0).toFixed(2)}%</td>
      <td>${(Number(it.ipi_percentual) || 0).toFixed(2)}%</td>
      <td>${formatarMoeda(it.valor_unitario)}</td>
      <td>${formatarMoeda(it.valor_total)}</td>
      <td class="acoes"><button type="button" onclick="removerItemCompra(${idx})" title="Remover">&#128465;</button></td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="vazio">Nenhum item adicionado.</td></tr>';
}

function salvarCompraManual(id) {
  const fornecedorId = document.getElementById('compra-fornecedor').value;
  if (!fornecedorId) {
    alert('Selecione o fornecedor.');
    return;
  }
  if (!itensCompraTemp.length) {
    alert('Adicione ao menos um item à compra.');
    return;
  }

  const tipoPedido = document.getElementById('compra-tipo-pedido').value;
  const dataCompra = document.getElementById('compra-data').value || new Date().toISOString().slice(0, 10);
  const comprador = document.getElementById('compra-comprador').value.trim();
  const numeroNf = document.getElementById('compra-numero-nf').value.trim();
  const transportadoraId = document.getElementById('compra-transportadora').value;
  const aosCuidados = document.getElementById('compra-aos-cuidados').value.trim();
  const observacoes = document.getElementById('compra-observacoes').value.trim();
  const prazosPagamento = parsePrazosPagamento(document.getElementById('compra-prazos-pagamento').value);
  const valorTotal = itensCompraTemp.reduce((soma, it) => soma + it.valor_total, 0);

  const compras = loadList('compras');
  let jaTinhaEntrada = false;

  if (id) {
    // Edicao: desfaz os efeitos da compra antiga (retira estoque e apaga parcelas antigas)
    // antes de gravar os novos dados, para nao duplicar nem deixar numeros errados. Como os
    // itens podem ter mudado, a entrada precisa ser dada de novo (botão "Dar Entrada").
    const compraAntiga = compras.find(c => c.id === id);
    if (compraAntiga) {
      jaTinhaEntrada = !!compraAntiga.entrada_dada;
      if (jaTinhaEntrada) {
        reverterEntradaEstoqueCompra(compraAntiga.itens || []);
      }
      removerContasPagarDaCompra(id);
    }
  }

  const compraSalva = {
    id: id || nextId(compras),
    fornecedor_id: Number(fornecedorId),
    tipo_pedido: tipoPedido,
    numero_nf: numeroNf,
    chave_nfe: (id && compras.find(c => c.id === id) && compras.find(c => c.id === id).chave_nfe) || '',
    data_compra: dataCompra,
    comprador: comprador,
    transportadora_id: transportadoraId ? Number(transportadoraId) : null,
    aos_cuidados: aosCuidados,
    observacoes: observacoes,
    prazos_pagamento: prazosPagamento,
    valor_total: valorTotal,
    itens: itensCompraTemp,
    entrada_dada: false,
  };

  if (id) {
    const idx = compras.findIndex(c => c.id === id);
    compras[idx] = compraSalva;
  } else {
    compras.push(compraSalva);
  }
  saveList('compras', compras);

  fecharModal();
  renderCompras();
  if (jaTinhaEntrada) {
    alert('Compra atualizada. Como esta compra já tinha entrada dada, o estoque e as parcelas antigas foram revertidos — clique em "Dar Entrada" para lançar os dados atualizados no estoque e em Contas a Pagar.');
  }
}

function reverterEntradaEstoqueCompra(itens) {
  const produtos = loadList('produtos');
  let alterou = false;
  itens.forEach(item => {
    if (!item.produto_id) return;
    const produto = produtos.find(p => p.id === item.produto_id);
    if (!produto) return;
    produto.estoque_atual = (Number(produto.estoque_atual) || 0) - (Number(item.quantidade) || 0);
    alterou = true;
  });
  if (alterou) saveList('produtos', produtos);
}

function removerContasPagarDaCompra(compraId) {
  const contas = loadList('contas_pagar').filter(c => c.compra_id !== compraId);
  saveList('contas_pagar', contas);
}

function gerarParcelasPagar(compra) {
  const prazos = Array.isArray(compra.prazos_pagamento) && compra.prazos_pagamento.length ? compra.prazos_pagamento : [0];
  const totalParcelas = prazos.length;
  const valorBase = Math.floor((compra.valor_total / totalParcelas) * 100) / 100;
  let somaParcial = 0;

  const contas = loadList('contas_pagar');
  prazos.forEach((dias, i) => {
    const ultimaParcela = i === totalParcelas - 1;
    const valorParcela = ultimaParcela ? Math.round((compra.valor_total - somaParcial) * 100) / 100 : valorBase;
    somaParcial += valorParcela;

    contas.push({
      id: nextId(contas),
      fornecedor_id: compra.fornecedor_id,
      compra_id: compra.id,
      descricao: totalParcelas > 1 ? `Compra #${compra.id} - Parcela ${i + 1}/${totalParcelas}` : `Compra #${compra.id}`,
      valor: valorParcela,
      data_vencimento: adicionarDias(compra.data_compra, dias),
      data_pagamento: null,
    });
  });
  saveList('contas_pagar', contas);
}

function gerarParcelasPagarPorDuplicatas(compra, duplicatas) {
  // Usado quando o XML da NF-e traz as duplicatas (cobr/dup): cada parcela usa exatamente
  // o vencimento e o valor informados na nota, em vez do rateio uniforme por prazos em dias.
  const contas = loadList('contas_pagar');
  const totalParcelas = duplicatas.length;
  duplicatas.forEach((dup, i) => {
    contas.push({
      id: nextId(contas),
      fornecedor_id: compra.fornecedor_id,
      compra_id: compra.id,
      descricao: totalParcelas > 1
        ? `Compra #${compra.id} - Duplicata ${dup.numero || (i + 1)}/${totalParcelas} (NF-e)`
        : `Compra #${compra.id} - Duplicata (NF-e)`,
      valor: dup.valor,
      data_vencimento: dup.vencimento,
      data_pagamento: null,
    });
  });
  saveList('contas_pagar', contas);
}

/* "Dar Entrada": ação única que lança os itens da compra no estoque e gera as
   parcelas em Contas a Pagar, tanto para compras lançadas manualmente quanto
   para compras importadas de XML de NF-e. Enquanto isso não for clicado, a
   compra existe só como um pedido/registro, sem efeito no estoque ou no financeiro. */
function darEntradaCompra(compraId) {
  const compras = loadList('compras');
  const compra = compras.find(c => c.id === compraId);
  if (!compra) return;

  if (compra.entrada_dada) {
    if (!confirm('Esta compra já teve entrada dada. Deseja refazer a entrada? O estoque e as parcelas lançados anteriormente serão substituídos pelos dados atuais da compra.')) {
      return;
    }
  }

  const temDuplicatasNfe = Array.isArray(compra.duplicatas_nfe) && compra.duplicatas_nfe.length > 0;

  abrirModal(`
    <h2>Dar Entrada — Compra #${compra.id}</h2>
    <div class="info-cliente-caixa">
      <div><strong>Valor Total da Compra:</strong> ${formatarMoeda(compra.valor_total)}</div>
      <div>Isso vai adicionar os itens ao estoque e lançar as parcelas em Contas a Pagar.</div>
    </div>
    ${temDuplicatasNfe ? `
      <div class="info-cliente-caixa">Serão usadas as ${compra.duplicatas_nfe.length} duplicata(s) da NF-e importada (vencimento e valor da própria nota).</div>
    ` : `
      <div class="campo">
        <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x). Deixe em branco para à vista.</label>
        <input type="text" id="dar-entrada-prazos" value="${escapeHtml(construirPrazosDisplay(compra))}" placeholder="30/45/60">
      </div>
    `}
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarDarEntradaCompra(${compra.id})">Confirmar Entrada</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function confirmarDarEntradaCompra(compraId) {
  const compras = loadList('compras');
  const idx = compras.findIndex(c => c.id === compraId);
  if (idx === -1) return;
  const compra = compras[idx];

  // Se já tinha entrada dada antes (refazendo), desfaz os efeitos antigos primeiro para não duplicar.
  if (compra.entrada_dada) {
    reverterEntradaEstoqueCompra(compra.itens || []);
    removerContasPagarDaCompra(compraId);
  }

  const temDuplicatasNfe = Array.isArray(compra.duplicatas_nfe) && compra.duplicatas_nfe.length > 0;
  const compraAtualizada = { ...compra, entrada_dada: true, data_entrada: new Date().toISOString().slice(0, 10) };

  if (!temDuplicatasNfe) {
    const campoPrazos = document.getElementById('dar-entrada-prazos');
    compraAtualizada.prazos_pagamento = parsePrazosPagamento(campoPrazos ? campoPrazos.value : '');
  }

  compras[idx] = compraAtualizada;
  saveList('compras', compras);
  aplicarEntradaEstoqueCompra(compraAtualizada.itens || []);
  if (temDuplicatasNfe) {
    gerarParcelasPagarPorDuplicatas(compraAtualizada, compraAtualizada.duplicatas_nfe);
  } else {
    gerarParcelasPagar(compraAtualizada);
  }

  fecharModal();
  renderCompras();
  alert('Entrada confirmada: o estoque foi atualizado e as parcelas foram lançadas em Contas a Pagar.');
}

/* "Estornar Entrada": desfaz a entrada dada (retira os itens do estoque e remove as parcelas
   de Contas a Pagar), sem relançar nada — a compra volta a precisar de "Dar Entrada". */
function estornarEntradaCompra(compraId) {
  const compras = loadList('compras');
  const idx = compras.findIndex(c => c.id === compraId);
  if (idx === -1) return;
  const compra = compras[idx];
  if (!compra.entrada_dada) return;

  if (!confirm(`Estornar a entrada da Compra #${compra.id}? Os itens serão retirados do estoque e as parcelas serão removidas de Contas a Pagar. A compra volta a precisar de "Dar Entrada".`)) {
    return;
  }

  reverterEntradaEstoqueCompra(compra.itens || []);
  removerContasPagarDaCompra(compraId);

  compras[idx] = { ...compra, entrada_dada: false };
  saveList('compras', compras);

  renderCompras();
  alert('Entrada estornada: o estoque e as parcelas em Contas a Pagar foram removidos.');
}

function abrirRelatorioCompras() {

function gerarRelatorioCompras() {
  const compradorFiltro = document.getElementById('rel-compras-comprador').value;
  const dataInicio = document.getElementById('rel-compras-data-inicio').value;
  const dataFim = document.getElementById('rel-compras-data-fim').value;

  const fornecedores = loadList('fornecedores');
  let compras = loadList('compras');

  if (compradorFiltro) {
    compras = compras.filter(c => (c.comprador || '').trim() === compradorFiltro);
  }
  if (dataInicio) {
    compras = compras.filter(c => (c.data_compra || '') >= dataInicio);
  }
  if (dataFim) {
    compras = compras.filter(c => (c.data_compra || '') <= dataFim);
  }

  // Agrupamento por comprador (no relatório geral mostra todos; filtrado por um comprador, mostra só ele).
  const porComprador = {};
  compras.forEach(c => {
    const nome = (c.comprador || '').trim() || '(Não informado)';
    if (!porComprador[nome]) porComprador[nome] = { qtd: 0, valor: 0 };
    porComprador[nome].qtd += 1;
    porComprador[nome].valor += Number(c.valor_total) || 0;
  });

  const valorTotalGeral = compras.reduce((soma, c) => soma + (Number(c.valor_total) || 0), 0);

  const linhasResumo = Object.keys(porComprador).sort().map(nome => `
    <tr>

/* Gerador de ZIP mínimo (sem compressão), para não depender de biblioteca externa. */
const TABELA_CRC32 = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABELA_CRC32[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* arquivos: [{ nome, conteudo (string ou Uint8Array) }] → Uint8Array do .zip */
function criarZip(arquivos) {
  const enc = new TextEncoder();
  const agora = new Date();
  const dosHora = (agora.getHours() << 11) | (agora.getMinutes() << 5) | (agora.getSeconds() >> 1);
  const dosData = ((agora.getFullYear() - 1980) << 9) | ((agora.getMonth() + 1) << 5) | agora.getDate();
  const partes = [];
  const central = [];
  let deslocamento = 0;
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  arquivos.forEach(a => {
    const nome = enc.encode(a.nome);
    const dados = typeof a.conteudo === 'string' ? enc.encode(a.conteudo) : a.conteudo;
    const crc = crc32(dados);
    const comum = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(dosHora), ...u16(dosData), ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nome.length), ...u16(0)];
    const local = new Uint8Array([0x50, 0x4B, 0x03, 0x04, ...comum, ...nome]);
    partes.push(local, dados);
    central.push(new Uint8Array([0x50, 0x4B, 0x01, 0x02, ...u16(20), ...comum, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(deslocamento), ...nome]));
    deslocamento += local.length + dados.length;
  });
  const tamanhoCentral = central.reduce((s, p) => s + p.length, 0);
  const fim = new Uint8Array([0x50, 0x4B, 0x05, 0x06, ...u16(0), ...u16(0), ...u16(arquivos.length), ...u16(arquivos.length), ...u32(tamanhoCentral), ...u32(deslocamento), ...u16(0)]);
  const todos = [...partes, ...central, fim];
  const total = todos.reduce((s, p) => s + p.length, 0);
  const saida = new Uint8Array(total);
  let pos = 0;
  todos.forEach(p => { saida.set(p, pos); pos += p.length; });
  return saida;
}

/* Baixa um XML/PDF já emitido pela Focus, passando pelo intermediário (evita bloqueio de CORS). */
async function baixarArquivoFocusTexto(caminho, ambiente) {
  const cfg = configNfe();
  const base = urlIntermediarioNfe(cfg);
  if (!base) throw new Error('O intermediário de NF-e não está configurado.');
  let rota = String(caminho || '');
  if (/^https?:\/\//i.test(rota)) rota = new URL(rota).pathname;
  const headers = {
    'X-Ambiente': ambiente === 'producao' ? 'producao' : 'homologacao',
    'X-Paptech-Chave': chaveIntermediarioNfe(),
  };
  if (cfg.conexao === 'supabase' && SUPABASE_ANON_KEY) {
    headers.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
    headers.apikey = SUPABASE_ANON_KEY;
  }
  const resposta = await fetch(base + rota, { method: 'GET', headers });
  if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
  return resposta.text();
}

async function exportarXmlNotas() {
  const de = document.getElementById('exp-xml-de').value;
  const ate = document.getElementById('exp-xml-ate').value;
  const comCanceladas = document.getElementById('exp-xml-canceladas').checked;
  const comHomolog = document.getElementById('exp-xml-homolog').checked;
  const status = document.getElementById('exp-xml-status');
  const botao = document.getElementById('exp-xml-botao');
  const mostrar = (txt, tipo) => { status.style.display = 'block'; status.className = 'nfe-status nfe-status-' + (tipo || 'info'); status.innerHTML = escapeHtml(txt).replace(/\n/g, '<br>'); };
  if (!de || !ate || de > ate) { mostrar('Informe um período válido.', 'erro'); return; }

  const clientes = loadList('clientes');
  const notas = loadList('vendas').filter(v =>
    (v.status_nf === 'Emitida' || (comCanceladas && v.status_nf === 'Cancelada')) &&
    v.data_emissao_nf && v.data_emissao_nf >= de && v.data_emissao_nf <= ate &&
    (comHomolog || v.nfe_ambiente !== 'homologacao')
  ).sort((a, b) => (a.data_emissao_nf || '').localeCompare(b.data_emissao_nf || ''));
  if (!notas.length) { mostrar('Nenhuma nota encontrada nesse período.', 'erro'); return; }

  botao.disabled = true;
  const arquivos = [];
  const linhasCsv = [['Número', 'Série', 'Data emissão', 'Cliente', 'Valor', 'Situação', 'Chave de acesso', 'Arquivo XML'].join(';')];
  const falhas = [];
  const cel = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';

  for (let i = 0; i < notas.length; i++) {
    const v = notas[i];
    const cliente = clientes.find(c => c.id === v.cliente_id);
    const rotulo = `${v.numero_nf || v.id}`;
    mostrar(`Baixando ${i + 1} de ${notas.length} (nota ${rotulo})...`);
    const chave = somenteDigitos(v.chave_nfe);
    const base = chave || `nota-${v.numero_nf || v.id}`;
    let arquivoXml = '';
    if (!v.nfe_caminho_xml) {
      falhas.push(`Nota ${rotulo}: sem XML (foi registrada manualmente ou emitida em outro sistema).`);
    } else {
      try {
        const xml = await baixarArquivoFocusTexto(v.nfe_caminho_xml, v.nfe_ambiente);
        arquivoXml = `XMLs/${base}-nfe.xml`;
        arquivos.push({ nome: arquivoXml, conteudo: xml });
        if (v.status_nf === 'Cancelada' && v.nfe_caminho_xml_cancelamento) {
          try {
            const xmlCanc = await baixarArquivoFocusTexto(v.nfe_caminho_xml_cancelamento, v.nfe_ambiente);
            arquivos.push({ nome: `Cancelamentos/${base}-cancelamento.xml`, conteudo: xmlCanc });
          } catch (e) { falhas.push(`Nota ${rotulo}: XML de cancelamento não baixou (${e.message}).`); }
        }
      } catch (e) {
        falhas.push(`Nota ${rotulo}: não foi possível baixar o XML (${e.message}).`);
      }
    }
    linhasCsv.push([v.numero_nf, v.serie_nf, formatarDataBr(v.data_emissao_nf), cliente ? cliente.razao_social : (v.origem === 'pdv' ? 'Consumidor Final' : ''),
      (Number(v.valor_total) || 0).toFixed(2).replace('.', ','), v.status_nf, chave, arquivoXml].map(cel).join(';'));
  }

  if (!arquivos.length) {
    mostrar('Nenhum XML pôde ser baixado.\n' + falhas.join('\n'), 'erro');
    botao.disabled = false;
    return;
  }
  arquivos.push({ nome: 'resumo.csv', conteudo: '\uFEFF' + linhasCsv.join('\r\n') + '\r\n' });
  const zip = criarZip(arquivos);
  const url = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `xml-notas-fiscais_${de}_a_${ate}.zip`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  mostrar(`Pronto: ${arquivos.length - 1} XML(s) no arquivo .zip.` + (falhas.length ? `\n\nAtenção:\n${falhas.join('\n')}` : ''), falhas.length ? 'info' : 'ok');
  botao.disabled = false;
}

  const temRecebimento = !!(venda && venda.recebimento_gerado);
  const mensagem = temRecebimento

/* =====================================================================
   NOTA FISCAL ELETRÔNICA (NF-e modelo 55) — emissão via Focus NFe
   ---------------------------------------------------------------------
   O PAPTECH monta o JSON da nota a partir da venda e envia para um
   "intermediário" (Edge Function do Supabase ou servidor.js na loja),
   que guarda o token da Focus NFe e repassa o pedido. A Focus assina com
   o certificado A1 da empresa, transmite para a SEFAZ e devolve DANFE/XML.
   ===================================================================== */

const NFE_FOCUS_BASES = {
  homologacao: 'https://homologacao.focusnfe.com.br',
  producao: 'https://api.focusnfe.com.br',
};
/* A chave do intermediário fica só neste computador (não vai para a nuvem
   junto com as outras configurações, para não ficar exposta). */
const CHAVE_LOCAL_NFE_INTERMEDIARIO = 'paptech_nfe_chave_intermediario';

const NFE_CONFIG_PADRAO = {
  ambiente: 'homologacao',
  conexao: 'supabase',
  url_intermediario: '',
  regime_tributario: '1',
  natureza_operacao: 'VENDA DE MERCADORIA',
  icms_cst_padrao: '102',
  origem_padrao: '0',
  cfop_padrao: '5102',
  pis_cst_padrao: '49',
  cofins_cst_padrao: '49',
  presenca_comprador: '1',
  forma_pagamento_vista: '01',
  forma_pagamento_prazo: '15',
  informacoes_complementares: '',
  // Reforma Tributária (IBS/CBS): 'auto' = envia só no Regime Normal; 'sempre' = envia também no Simples (facultativo até 2026); 'nunca' = não envia.
  ibs_cbs_modo: 'auto',
  ibs_cbs_cst_padrao: '000',
  ibs_cbs_classif_padrao: '000001',
  cbs_aliquota: '0.9',
  ibs_uf_aliquota: '0.1',
  ibs_mun_aliquota: '0',
};

const NFE_OPCOES_ORIGEM = [
  '0 - Nacional',
  '1 - Estrangeira (importação direta)',
  '2 - Estrangeira (adquirida no mercado interno)',
  '3 - Nacional, conteúdo de importação > 40% e <= 70%',
  '4 - Nacional, processos produtivos básicos',
  '5 - Nacional, conteúdo de importação <= 40%',
  '6 - Estrangeira (importação direta, sem similar nacional)',
  '7 - Estrangeira (mercado interno, sem similar nacional)',
  '8 - Nacional, conteúdo de importação > 70%',
];
const NFE_FORMAS_PAGAMENTO = [
  ['01', 'Dinheiro'], ['02', 'Cheque'], ['03', 'Cartão de Crédito'], ['04', 'Cartão de Débito'],
  ['05', 'Crédito Loja'], ['15', 'Boleto Bancário'], ['16', 'Depósito Bancário'], ['17', 'PIX'],
  ['18', 'Transferência bancária'], ['90', 'Sem pagamento'], ['99', 'Outros'],
];
const NFE_PRESENCA = [
  ['1', 'Operação presencial (balcão)'], ['2', 'Não presencial, internet'],
  ['3', 'Não presencial, teleatendimento'], ['4', 'Entrega em domicílio'], ['9', 'Não presencial, outros'],
];
const NFE_REGIMES = [
  ['1', 'Simples Nacional'], ['2', 'Simples Nacional — excesso de sublimite'], ['3', 'Regime Normal (Lucro Presumido/Real)'],
];

function configNfe() {
  return { ...NFE_CONFIG_PADRAO, ...(obterConfiguracoes().nfe || {}) };
}

function chaveIntermediarioNfe() {
  return localStorage.getItem(CHAVE_LOCAL_NFE_INTERMEDIARIO) || '';
}

function urlIntermediarioNfe(cfg) {
  cfg = cfg || configNfe();
  if (cfg.conexao === 'supabase') {
    return SUPABASE_URL ? SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/focus-nfe' : '';
  }
  return String(cfg.url_intermediario || '').trim().replace(/\/+$/, '');
}

function nfeConfigurada() {
  return !!(urlIntermediarioNfe() && chaveIntermediarioNfe());
}

function somenteDigitos(valor) {
  return String(valor ?? '').replace(/\D/g, '');
}

function arred2(valor) {
  return Math.round((Number(valor) || 0) * 100) / 100;
}

/* Data/hora local com fuso (ex: 2026-10-04T10:15:00-03:00), formato aceito pela SEFAZ. */
function dataHoraLocalComFuso(data) {
  const d = data || new Date();
  const p = n => String(Math.abs(Math.floor(n))).padStart(2, '0');
  const offset = -d.getTimezoneOffset();
  const sinal = offset >= 0 ? '+' : '-';
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
    + `${sinal}${p(offset / 60)}:${p(offset % 60)}`;
}

function dataHojeLocalIso() {
  return dataHoraLocalComFuso().slice(0, 10);
}

/* Chamada ao intermediário. Devolve { status, dados } — "dados" é o JSON
   retornado pela Focus NFe (ou pelo próprio intermediário em caso de erro). */
async function chamarFocusNfe(metodo, caminho, corpo) {
  const cfg = configNfe();
  const base = urlIntermediarioNfe(cfg);
  if (!base) throw new Error('O intermediário de NF-e não está configurado (Configurações → Nota Fiscal Eletrônica).');
  const headers = {
    'Content-Type': 'application/json',
    'X-Ambiente': cfg.ambiente === 'producao' ? 'producao' : 'homologacao',
    'X-Paptech-Chave': chaveIntermediarioNfe(),
  };
  if (cfg.conexao === 'supabase' && SUPABASE_ANON_KEY) {
    headers.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
    headers.apikey = SUPABASE_ANON_KEY;
  }
  let resposta;
  try {
    resposta = await fetch(base + caminho, {
      method: metodo,
      headers,
      body: corpo !== undefined ? JSON.stringify(corpo) : undefined,
    });
  } catch (erro) {
    throw new Error('Não foi possível conectar ao intermediário de NF-e (' + base + '). Verifique a internet, se o intermediário está publicado/ligado e a URL nas Configurações.');
  }
  const texto = await resposta.text();
  let dados;
  try { dados = texto ? JSON.parse(texto) : {}; } catch (e) { dados = { mensagem: texto }; }
  return { status: resposta.status, dados };
}

/* Junta as mensagens de erro que a Focus/SEFAZ devolvem num texto legível. */
function mensagemErroFocus(dados, statusHttp) {
  if (!dados) return 'Erro desconhecido (HTTP ' + statusHttp + ').';
  const partes = [];
  if (dados.mensagem_sefaz) partes.push((dados.status_sefaz ? dados.status_sefaz + ' - ' : '') + dados.mensagem_sefaz);
  if (dados.mensagem) partes.push(dados.mensagem);
  if (Array.isArray(dados.erros)) {
    dados.erros.forEach(e => partes.push((e.campo ? e.campo + ': ' : '') + (e.mensagem || e.codigo || '')));
  }
  if (!partes.length && dados.codigo) partes.push(dados.codigo);
  return partes.join('\n') || ('Erro HTTP ' + statusHttp + '.');
}

function urlArquivoFocus(venda, caminho) {
  if (!caminho) return '';
  if (/^https?:\/\//i.test(caminho)) return caminho;
  return (NFE_FOCUS_BASES[venda.nfe_ambiente] || NFE_FOCUS_BASES.homologacao) + caminho;
}

function abrirArquivoNfe(vendaId, tipo) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  const mapa = { danfe: venda.nfe_caminho_danfe, xml: venda.nfe_caminho_xml, cancelamento: venda.nfe_caminho_xml_cancelamento };
  const url = urlArquivoFocus(venda, mapa[tipo]);
  if (!url) {
    alert('Arquivo ainda não disponível. Clique em "Consultar na SEFAZ" para atualizar.');
    return;
  }
  window.open(url, '_blank', 'noopener');
}

/* ---------- montagem do JSON da NF-e a partir da venda ---------- */

/* Separa origem e CST/CSOSN quando o código foi cadastrado junto (ex: "0102" ou "060"). */
function decomporCstProduto(codigoBruto, regime) {
  const codigo = somenteDigitos(codigoBruto);
  const simples = regime === '1' || regime === '2';
  if (simples) {
    if (codigo.length === 4) return { origem: codigo[0], cst: codigo.slice(1) };
    return { origem: null, cst: codigo };
  }
  if (codigo.length === 3) return { origem: codigo[0], cst: codigo.slice(1) };
  return { origem: null, cst: codigo.padStart(2, '0') };
}

function ajustarCfopDestino(cfop, interestadual) {
  const c = somenteDigitos(cfop);
  if (c.length !== 4) return c;
  if (interestadual && c[0] === '5') return '6' + c.slice(1);
  if (!interestadual && c[0] === '6') return '5' + c.slice(1);
  return c;
}

/* ---------- Reforma Tributária: IBS / CBS ---------- */

function ibsCbsAtivo(cfg) {
  if (cfg.ibs_cbs_modo === 'sempre') return true;
  if (cfg.ibs_cbs_modo === 'nunca') return false;
  return cfg.regime_tributario === '3';
}

/* Preenche os campos de IBS/CBS de um item (modelo Focus NFe, NT 2025.002). A alíquota vem das
   Configurações (em 2026: CBS 0,9% e IBS 0,1%, apenas destaque — sem recolhimento). */
function aplicarIbsCbsItem(item, produto, cfg, base, avisos, rotulo) {
  if (!ibsCbsAtivo(cfg)) return;
  const cst = somenteDigitos(produto.ibs_cbs_cst || cfg.ibs_cbs_cst_padrao).padStart(3, '0');
  const classif = somenteDigitos(produto.ibs_cbs_classificacao || cfg.ibs_cbs_classif_padrao).padStart(6, '0');
  item.ibs_cbs_situacao_tributaria = cst;
  item.ibs_cbs_classificacao_tributaria = classif;
  if (cst !== '000') {
    avisos.push(`${rotulo}: CST IBS/CBS ${cst} — o PAPTECH só calcula valores para a tributação normal (000); confira o item com seu contador.`);
    return;
  }
  const num = v => Number(String(v == null ? '' : v).replace(',', '.')) || 0;
  const aCbs = num(cfg.cbs_aliquota), aUf = num(cfg.ibs_uf_aliquota), aMun = num(cfg.ibs_mun_aliquota);
  item.ibs_cbs_base_calculo = arred2(base);
  item.cbs_aliquota = aCbs;
  item.cbs_valor = arred2(base * aCbs / 100);
  item.ibs_uf_aliquota = aUf;
  item.ibs_uf_valor = arred2(base * aUf / 100);
  item.ibs_mun_aliquota = aMun;
  item.ibs_mun_valor = arred2(base * aMun / 100);
}

function aplicarIbsCbsTotais(payload, items) {
  const com = items.filter(i => i.ibs_cbs_base_calculo !== undefined);
  if (!com.length) return;
  const soma = campo => arred2(com.reduce((t, i) => t + (Number(i[campo]) || 0), 0));
  payload.ibs_cbs_base_calculo = soma('ibs_cbs_base_calculo');
  payload.cbs_valor_total = soma('cbs_valor');
  payload.ibs_uf_valor_total = soma('ibs_uf_valor');
  payload.ibs_mun_valor_total = soma('ibs_mun_valor');
  payload.ibs_valor_total = arred2(payload.ibs_uf_valor_total + payload.ibs_mun_valor_total);
  payload.ibs_cbs_is_valor_total = arred2(payload.cbs_valor_total + payload.ibs_valor_total);
}

/* opcoes: { natureza, consumidor_final (bool|null), prazos (array dias), incluir_frete (bool),
             volumes (número), informacoes (texto) }
   Retorna { payload, erros[], avisos[], resumo } */
function montarNfeVenda(venda, opcoes) {
  opcoes = opcoes || {};
  const cfg = configNfe();
  const empresa = dadosEmpresaAtuais();
  const cliente = loadList('clientes').find(c => c.id === venda.cliente_id);
  const produtos = loadList('produtos');
  const transportadora = venda.transportadora_id ? loadList('transportadoras').find(t => t.id === venda.transportadora_id) : null;
  const erros = [];
  const avisos = [];
  const regime = cfg.regime_tributario;
  const simples = regime === '1' || regime === '2';

  // Emitente
  const cnpjEmitente = somenteDigitos(empresa.cnpj);
  const ufEmitente = String(empresa.uf || '').trim().toUpperCase();
  if (cnpjEmitente.length !== 14) erros.push('CNPJ da empresa inválido ou não preenchido (Configurações → Dados da Empresa).');
  if (ufEmitente.length !== 2) erros.push('UF da empresa não preenchida (Configurações → Dados da Empresa).');
  if (!somenteDigitos(empresa.inscricao_estadual)) erros.push('Inscrição Estadual da empresa não preenchida (Configurações → Dados da Empresa).');

  // Destinatário
  if (!cliente) erros.push('Cliente da venda não encontrado.');
  const c = cliente || {};
  const docDest = somenteDigitos(c.cnpj);
  const ufDest = String(c.uf || '').trim().toUpperCase();
  if (cliente) {
    if (docDest.length !== 14 && docDest.length !== 11) erros.push(`Cliente "${c.razao_social}": CNPJ/CPF inválido (precisa ter 14 ou 11 dígitos).`);
    if (!String(c.endereco || '').trim()) erros.push(`Cliente "${c.razao_social}": endereço não preenchido.`);
    if (!String(c.numero || '').trim()) avisos.push(`Cliente "${c.razao_social}": número do endereço vazio — será enviado "S/N".`);
    if (!String(c.bairro || '').trim()) erros.push(`Cliente "${c.razao_social}": bairro não preenchido.`);
    if (!String(c.cidade || '').trim()) erros.push(`Cliente "${c.razao_social}": cidade não preenchida.`);
    if (ufDest.length !== 2) erros.push(`Cliente "${c.razao_social}": UF não preenchida.`);
    if (somenteDigitos(c.cep).length !== 8) erros.push(`Cliente "${c.razao_social}": CEP inválido.`);
  }
  const ieDestBruta = String(c.inscricao_estadual || '').trim();
  let indicadorIe = 9;
  if (/isent/i.test(ieDestBruta)) indicadorIe = 2;
  else if (somenteDigitos(ieDestBruta)) indicadorIe = 1;
  const interestadual = ufEmitente && ufDest && ufEmitente !== ufDest;
  const consumidorFinal = opcoes.consumidor_final == null ? indicadorIe === 9 : !!opcoes.consumidor_final;
  if (interestadual && consumidorFinal && indicadorIe === 9) {
    avisos.push('Venda interestadual para consumidor final não contribuinte: pode haver DIFAL a recolher — confirme com seu contador.');
  }

  // Itens
  const itensVenda = venda.itens || [];
  if (!itensVenda.length) erros.push('A venda não tem itens.');
  const valorProdutos = arred2(itensVenda.reduce((s, it) => s + arred2(it.valor_total), 0));
  const valorFrete = opcoes.incluir_frete ? arred2(venda.valor_frete) : 0;
  let freteDistribuido = 0;

  const items = itensVenda.map((it, i) => {
    const produto = produtos.find(p => p.id === it.produto_id) || {};
    const rotulo = `Item ${i + 1} (${it.descricao})`;
    const ncm = somenteDigitos(produto.ncm);
    if (ncm.length !== 8) erros.push(`${rotulo}: NCM não cadastrado ou inválido (precisa de 8 dígitos) — ajuste no cadastro do produto, aba Impostos.`);
    const cstInfo = decomporCstProduto(produto.cst_csosn || cfg.icms_cst_padrao, regime);
    const origemProduto = somenteDigitos(String(produto.origem || '').slice(0, 1));
    const origem = origemProduto || cstInfo.origem || somenteDigitos(cfg.origem_padrao) || '0';
    const cst = cstInfo.cst;
    if (simples && cst.length !== 3) erros.push(`${rotulo}: no Simples Nacional o código deve ser um CSOSN de 3 dígitos (ex: 102, 500). Cadastrado: "${produto.cst_csosn || cfg.icms_cst_padrao}".`);
    if (!simples && cst.length !== 2) erros.push(`${rotulo}: no Regime Normal o código deve ser um CST de 2 dígitos (ex: 00, 60). Cadastrado: "${produto.cst_csosn || cfg.icms_cst_padrao}".`);
    const cfop = ajustarCfopDestino(produto.cfop || cfg.cfop_padrao, interestadual);
    if (cfop.length !== 4) erros.push(`${rotulo}: CFOP inválido.`);

    const quantidade = Number(it.quantidade) || 0;
    const valorBruto = arred2(it.valor_total);
    const valorUnit = quantidade ? Number(it.valor_unitario) || valorBruto / quantidade : 0;
    let freteItem = 0;
    if (valorFrete > 0) {
      freteItem = i === itensVenda.length - 1
        ? arred2(valorFrete - freteDistribuido)
        : arred2(valorProdutos ? valorFrete * valorBruto / valorProdutos : 0);
      freteDistribuido = arred2(freteDistribuido + freteItem);
    }
    const unidade = (String(produto.unidade_medida || 'UN').trim().toUpperCase() || 'UN').slice(0, 6);
    const gtin = somenteDigitos(produto.gtin_venda);
    const gtinValido = [8, 12, 13, 14].includes(gtin.length) ? gtin : 'SEM GTIN';

    const item = {
      numero_item: i + 1,
      codigo_produto: String(produto.cod_interno || it.produto_id || i + 1),
      descricao: String(it.descricao || produto.descricao || '').slice(0, 120),
      codigo_ncm: ncm,
      cfop: cfop,
      unidade_comercial: unidade,
      quantidade_comercial: quantidade,
      valor_unitario_comercial: Number(valorUnit.toFixed(10)),
      unidade_tributavel: unidade,
      quantidade_tributavel: quantidade,
      valor_unitario_tributavel: Number(valorUnit.toFixed(10)),
      valor_bruto: valorBruto,
      codigo_barras_comercial: gtinValido,
      codigo_barras_tributavel: gtinValido,
      ...(String(it.numero_pedido || '').trim() ? { numero_pedido_compra: String(it.numero_pedido).trim().slice(0, 15) } : {}),
      ...(String(it.numero_pedido || '').trim() && /^\d{1,6}$/.test(String(it.item_pedido || '')) ? { numero_item_pedido_compra: Number(it.item_pedido) } : {}),
      inclui_no_total: 1,
      icms_origem: Number(origem),
      icms_situacao_tributaria: cst,
    };
    if (freteItem > 0) item.valor_frete = freteItem;

    // ICMS próprio destacado no Regime Normal (CST 00)
    if (!simples && cst === '00') {
      const aliq = Number(produto.aliquota_icms) || 0;
      if (!aliq) erros.push(`${rotulo}: CST 00 exige alíquota de ICMS no cadastro do produto.`);
      const base = arred2(valorBruto + freteItem);
      item.icms_modalidade_base_calculo = 3;
      item.icms_base_calculo = base;
      item.icms_aliquota = aliq;
      item.icms_valor = arred2(base * aliq / 100);
    } else if (!simples && !['40', '41', '50', '60'].includes(cst)) {
      avisos.push(`${rotulo}: CST ${cst} pode exigir campos que o PAPTECH ainda não envia (redução de base/ST). Se a SEFAZ rejeitar, confira com o contador.`);
    }
    if (simples && ['101', '201', '202', '203', '900'].includes(cst)) {
      avisos.push(`${rotulo}: CSOSN ${cst} exige campos extras (crédito/ST). O mais comum para revenda é 102 (sem ST) ou 500 (ST já recolhida).`);
    }

    // PIS / COFINS
    [['pis', cfg.pis_cst_padrao, produto.aliquota_pis], ['cofins', cfg.cofins_cst_padrao, produto.aliquota_cofins]].forEach(([tributo, cstPadrao, aliquotaProduto]) => {
      const cstTrib = somenteDigitos(cstPadrao).padStart(2, '0');
      item[`${tributo}_situacao_tributaria`] = cstTrib;
      const aliq = Number(aliquotaProduto) || 0;
      if (['01', '02'].includes(cstTrib) || Number(cstTrib) >= 49) {
        const base = ['01', '02'].includes(cstTrib) || aliq ? valorBruto : 0;
        item[`${tributo}_base_calculo`] = base;
        item[`${tributo}_aliquota_porcentual`] = aliq;
        item[`${tributo}_valor`] = arred2(base * aliq / 100);
      }
    });
    aplicarIbsCbsItem(item, produto, cfg, arred2(valorBruto + freteItem), avisos, rotulo);
    return item;
  });

  const valorTotal = arred2(valorProdutos + valorFrete);

  // Pagamento / duplicatas
  const prazos = Array.isArray(opcoes.prazos) && opcoes.prazos.length ? opcoes.prazos : [0];
  const aPrazo = prazos.some(d => d > 0);
  const formasPagamento = [{
    indicador_pagamento: aPrazo ? 1 : 0,
    forma_pagamento: aPrazo ? cfg.forma_pagamento_prazo : cfg.forma_pagamento_vista,
    valor_pagamento: cfg.forma_pagamento_vista === '90' && !aPrazo ? 0 : valorTotal,
  }];
  let duplicatas = null;
  if (aPrazo) {
    const dataBase = venda.data_venda || dataHojeLocalIso();
    const valorBase = Math.floor((valorTotal / prazos.length) * 100) / 100;
    let soma = 0;
    duplicatas = prazos.map((dias, i) => {
      const ultima = i === prazos.length - 1;
      const valor = ultima ? arred2(valorTotal - soma) : valorBase;
      soma = arred2(soma + valor);
      return { numero: String(i + 1).padStart(3, '0'), data_vencimento: adicionarDias(dataBase, dias), valor };
    });
  }

  // Frete
  const modalidadePorTexto = { Remetente: 0, 'Destinatário': 1, 'Sem Frete': 9 };
  let modalidadeFrete = modalidadePorTexto[venda.frete_por_conta];
  if (modalidadeFrete === undefined) modalidadeFrete = transportadora ? 1 : 9;

  const payload = {
    natureza_operacao: String(opcoes.natureza || cfg.natureza_operacao || 'VENDA DE MERCADORIA').slice(0, 60),
    data_emissao: dataHoraLocalComFuso(),
    data_entrada_saida: dataHoraLocalComFuso(),
    tipo_documento: 1,
    finalidade_emissao: 1,
    local_destino: interestadual ? 2 : 1,
    consumidor_final: consumidorFinal ? 1 : 0,
    presenca_comprador: Number(cfg.presenca_comprador) || 9,

    cnpj_emitente: cnpjEmitente,
    nome_emitente: empresa.razao_social || '',
    nome_fantasia_emitente: empresa.nome_fantasia || '',
    logradouro_emitente: empresa.endereco || '',
    numero_emitente: empresa.numero || 'S/N',
    bairro_emitente: empresa.bairro || '',
    municipio_emitente: empresa.cidade || '',
    uf_emitente: ufEmitente,
    cep_emitente: somenteDigitos(empresa.cep),
    telefone_emitente: somenteDigitos(empresa.telefone),
    inscricao_estadual_emitente: somenteDigitos(empresa.inscricao_estadual),
    regime_tributario_emitente: Number(regime),

    nome_destinatario: String(c.razao_social || '').slice(0, 60),
    logradouro_destinatario: c.endereco || '',
    numero_destinatario: String(c.numero || '').trim() || 'S/N',
    bairro_destinatario: c.bairro || '',
    municipio_destinatario: c.cidade || '',
    uf_destinatario: ufDest,
    cep_destinatario: somenteDigitos(c.cep),
    pais_destinatario: 'Brasil',
    indicador_inscricao_estadual_destinatario: indicadorIe,

    modalidade_frete: modalidadeFrete,
    valor_produtos: valorProdutos,
    valor_frete: valorFrete,
    valor_seguro: 0,
    valor_desconto: 0,
    valor_outras_despesas: 0,
    valor_total: valorTotal,
    formas_pagamento: formasPagamento,
    items,
  };
  if (docDest.length === 11) payload.cpf_destinatario = docDest; else payload.cnpj_destinatario = docDest;
  if (indicadorIe === 1) payload.inscricao_estadual_destinatario = somenteDigitos(ieDestBruta);
  if (somenteDigitos(c.telefone)) payload.telefone_destinatario = somenteDigitos(c.telefone);
  const emailNfeCliente = String(c.email_xml_nfe || c.email || '').trim();
  if (emailNfeCliente.includes('@')) payload.email_destinatario = emailNfeCliente;

  aplicarIbsCbsTotais(payload, items);

  if (duplicatas) {
    payload.numero_fatura = String(venda.numero || venda.id);
    payload.valor_original_fatura = valorTotal;
    payload.valor_desconto_fatura = 0;
    payload.valor_liquido_fatura = valorTotal;
    payload.duplicatas = duplicatas;
  }

  if (transportadora) {
    const docTransp = somenteDigitos(transportadora.cnpj);
    if (docTransp.length === 11) payload.cpf_transportador = docTransp;
    else if (docTransp.length === 14) payload.cnpj_transportador = docTransp;
    payload.nome_transportador = String(transportadora.razao_social || '').slice(0, 60);
    if (somenteDigitos(transportadora.inscricao_estadual)) payload.inscricao_estadual_transportador = somenteDigitos(transportadora.inscricao_estadual);
    if (transportadora.endereco) payload.endereco_transportador = [transportadora.endereco, transportadora.numero].filter(Boolean).join(', ').slice(0, 60);
    if (transportadora.cidade) payload.municipio_transportador = transportadora.cidade;
    if (transportadora.uf) payload.uf_transportador = String(transportadora.uf).toUpperCase();
  }

  const pesoTotal = Number(venda.peso_total) || 0;
  const qtdVolumes = Math.max(0, Math.round(Number(opcoes.volumes) || 0));
  if (qtdVolumes || venda.especie || pesoTotal) {
    const volume = {};
    if (qtdVolumes) volume.quantidade = qtdVolumes;
    if (venda.especie) volume.especie = String(venda.especie).slice(0, 60);
    if (pesoTotal) { volume.peso_bruto = Number(pesoTotal.toFixed(3)); volume.peso_liquido = Number(pesoTotal.toFixed(3)); }
    payload.volumes = [volume];
  }

  const informacoes = String(opcoes.informacoes ?? cfg.informacoes_complementares ?? '').trim();
  if (informacoes) payload.informacoes_adicionais_contribuinte = informacoes.slice(0, 2000);

  return {
    payload, erros, avisos,
    resumo: { valorProdutos, valorFrete, valorTotal, interestadual, consumidorFinal, indicadorIe, prazos, duplicatas },
  };
}

/* ---------- tela "Emitir NFe" ---------- */

function textoStatusApiNfe(status) {
  return ({
    processando_autorizacao: 'Processando na SEFAZ',
    autorizado: 'Autorizada',
    cancelado: 'Cancelada',
    erro_autorizacao: 'Rejeitada pela SEFAZ',
    denegado: 'Denegada',
  })[status] || status || '';
}

function ambienteNfeHtml(ambiente) {
  return ambiente === 'producao'
    ? '<span class="nfe-ambiente nfe-ambiente-producao">PRODUÇÃO — nota com valor fiscal</span>'
    : '<span class="nfe-ambiente nfe-ambiente-homologacao">HOMOLOGAÇÃO — teste, sem valor fiscal</span>';
}

function opcoesNfeDoFormulario(venda) {
  const campo = id => document.getElementById(id);
  const prazosInput = campo('nfe-emitir-prazos');
  return {
    natureza: campo('nfe-emitir-natureza') ? campo('nfe-emitir-natureza').value.trim() : '',
    consumidor_final: campo('nfe-emitir-consumidor') ? campo('nfe-emitir-consumidor').checked : null,
    prazos: prazosInput ? parsePrazosPagamento(prazosInput.value) : (venda.prazos_pagamento || [0]),
    incluir_frete: campo('nfe-emitir-frete') ? campo('nfe-emitir-frete').checked : false,
    volumes: campo('nfe-emitir-volumes') ? campo('nfe-emitir-volumes').value : 0,
    informacoes: campo('nfe-emitir-informacoes') ? campo('nfe-emitir-informacoes').value : '',
  };
}

function abrirEmitirNfeVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;

  // Já tem NF-e transmitida por aqui: abre o gerenciamento (DANFE, cancelar, CC-e...)
  if (venda.nfe_ref && ['autorizado', 'cancelado', 'processando_autorizacao'].includes(venda.nfe_status_api)) {
    abrirGerenciarNfeVenda(vendaId);
    return;
  }

  if (!podeEmitirNf()) {
    alert('Você não tem permissão para emitir Nota Fiscal.');
    return;
  }

  const cfg = configNfe();
  const configurada = nfeConfigurada();
  const indicadorIeInicial = montarNfeVenda(venda, { prazos: venda.prazos_pagamento }).resumo.indicadorIe;
  const opcoesIniciais = {
    natureza: cfg.natureza_operacao,
    consumidor_final: indicadorIeInicial === 9,
    prazos: venda.recebimento_gerado ? venda.prazos_pagamento : parsePrazosPagamento(construirPrazosDisplay(venda)),
    incluir_frete: false,
    volumes: 1,
    informacoes: cfg.informacoes_complementares,
  };
  const { erros, avisos, resumo, payload } = montarNfeVenda(venda, opcoesIniciais);

  const linhasItens = payload.items.map(it => `
    <tr>
      <td>${escapeHtml(it.descricao)}</td>
      <td>${escapeHtml(it.codigo_ncm || '—')}</td>
      <td>${escapeHtml(it.cfop)}</td>
      <td>${escapeHtml(it.icms_situacao_tributaria)}</td>
      <td style="text-align:right">${String(it.quantidade_comercial).replace('.', ',')}</td>
      <td style="text-align:right">${formatarMoeda(it.valor_bruto)}</td>
    </tr>
  `).join('');

  const ultimaRejeicao = venda.nfe_status_api === 'erro_autorizacao' || venda.nfe_status_api === 'denegado'
    ? `<div class="nfe-erros"><strong>Última tentativa ${escapeHtml(textoStatusApiNfe(venda.nfe_status_api).toLowerCase())}:</strong><br>${escapeHtml(venda.nfe_mensagem || '').replace(/\n/g, '<br>')}<br><em>Corrija o problema e transmita de novo.</em></div>`
    : '';

  abrirModal(`
    <h2>Emitir NF-e — Venda #${venda.id}</h2>
    ${configurada ? `<div style="margin-bottom:12px">${ambienteNfeHtml(cfg.ambiente)}</div>` : `
      <div class="aviso">A emissão automática ainda não está configurada neste computador. Configure em
      <a href="#" onclick="fecharModal(); irParaSecao('configuracoes'); return false;">Configurações → Nota Fiscal Eletrônica</a>,
      ou registre abaixo uma nota emitida em outro sistema.</div>`}
    ${ultimaRejeicao}
    ${erros.length ? `<div class="nfe-erros"><strong>Corrija antes de transmitir:</strong><ul>${erros.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul></div>` : ''}
    ${avisos.length ? `<div class="aviso"><ul style="margin:0;padding-left:18px">${avisos.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul></div>` : ''}

    <table class="data-table">
      <thead><tr><th>Produto</th><th>NCM</th><th>CFOP</th><th>${cfg.regime_tributario === '3' ? 'CST' : 'CSOSN'}</th><th>Qtd.</th><th>Valor</th></tr></thead>
      <tbody>${linhasItens || '<tr><td colspan="6" class="vazio">Sem itens.</td></tr>'}</tbody>
    </table>
    <div class="nfe-totais">
      Produtos: <strong>${formatarMoeda(resumo.valorProdutos)}</strong>
      &nbsp;·&nbsp; ${resumo.interestadual ? 'Operação interestadual' : 'Operação dentro do estado'}
    </div>

    <div class="campos-empresa-grid">
      <div class="campo campo-span-2">
        <label>Natureza da Operação</label>
        <input type="text" id="nfe-emitir-natureza" value="${escapeHtml(opcoesIniciais.natureza)}" maxlength="60">
      </div>
      ${venda.recebimento_gerado ? `
        <div class="campo campo-span-2"><label>Condição de Pagamento</label>
          <div>${escapeHtml(formatarCondicaoPagamento(venda))} <em>(recebimento já gerado — vai para a nota como está)</em></div></div>
      ` : `
        <div class="campo">
          <label>Prazos em dias (ex: 30/60/90 — em branco = à vista)</label>
          <input type="text" id="nfe-emitir-prazos" value="${escapeHtml(construirPrazosDisplay(venda))}" placeholder="30/60/90">
        </div>
      `}
      <div class="campo">
        <label>Quantidade de volumes</label>
        <input type="text" id="nfe-emitir-volumes" value="1">
      </div>
      <div class="campo campo-checkbox campo-span-2">
        <label><input type="checkbox" id="nfe-emitir-consumidor" ${opcoesIniciais.consumidor_final ? 'checked' : ''}> Cliente é consumidor final (usa a mercadoria, não revende)</label>
      </div>
      ${Number(venda.valor_frete) > 0 ? `
        <div class="campo campo-checkbox campo-span-2">
          <label><input type="checkbox" id="nfe-emitir-frete"> Cobrar o frete (${formatarMoeda(venda.valor_frete)}) dentro da nota — soma no total e nas parcelas</label>
        </div>` : ''}
      <div class="campo campo-span-2">
        <label>Informações complementares (saem no rodapé do DANFE)</label>
        <textarea id="nfe-emitir-informacoes" rows="3">${escapeHtml(opcoesIniciais.informacoes || '')}</textarea>
      </div>
    </div>
    <div id="nfe-emitir-status" class="nfe-status" style="display:none"></div>

    <div class="modal-botoes">
      ${configurada ? `<button type="button" class="btn-primary" id="nfe-emitir-botao" onclick="transmitirNfeVenda(${venda.id})" ${erros.length ? 'disabled title="Corrija os erros acima"' : ''}>📤 Transmitir para a SEFAZ</button>` : ''}
      <button type="button" class="btn-secondary" onclick="abrirPreviaNfeVenda(${venda.id})" title="Mostra como a nota será montada, sem enviar nada à SEFAZ">👁️ Ver montagem da NF-e (sem transmitir)</button>
      <button type="button" class="btn-secondary" onclick="abrirRegistroManualNfeVenda(${venda.id})">Registrar nota emitida em outro sistema</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
  `);
}

/* Mostra como a NF-e fica montada (espelho + JSON), sem transmitir nada — não precisa de certificado. */
function abrirPreviaNfeVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  const { payload, erros, avisos, resumo } = montarNfeVenda(venda, opcoesNfeDoFormulario(venda));
  const v = x => escapeHtml(x == null || x === '' ? '—' : x);
  const itens = payload.items.map(it => `
    <tr>
      <td>${it.numero_item}</td>
      <td>${v(it.codigo_produto)}</td>
      <td>${v(it.descricao)}</td>
      <td>${v(it.codigo_ncm)}</td>
      <td>${v(it.cfop)}</td>
      <td>${v(it.icms_origem)}/${v(it.icms_situacao_tributaria)}</td>
      <td style="text-align:right">${String(it.quantidade_comercial).replace('.', ',')} ${v(it.unidade_comercial)}</td>
      <td style="text-align:right">${formatarMoeda(it.valor_unitario_comercial)}</td>
      <td style="text-align:right">${formatarMoeda(it.valor_bruto)}</td>
      <td>${it.ibs_cbs_situacao_tributaria ? `${v(it.ibs_cbs_situacao_tributaria)} / ${v(it.ibs_cbs_classificacao_tributaria)}<br><small>CBS ${formatarMoeda(it.cbs_valor)} · IBS ${formatarMoeda((it.ibs_uf_valor || 0) + (it.ibs_mun_valor || 0))}</small>` : '—'}</td>
    </tr>`).join('');
  const pagamentos = (payload.formas_pagamento || []).map(f => `${v(f.forma_pagamento)} — ${formatarMoeda(f.valor_pagamento)}`).join('<br>');
  abrirModal(`
    <h2>Montagem da NF-e — Venda #${venda.id}</h2>
    <div class="aviso">Pré-visualização apenas: nada foi enviado à SEFAZ nem à Focus NFe, e não usa certificado digital.</div>
    ${erros.length ? `<div class="nfe-erros"><strong>Pendências para transmitir:</strong><ul>${erros.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul></div>` : '<div class="info-cliente-caixa">Nenhuma pendência: a nota está pronta para transmitir.</div>'}
    ${avisos.length ? `<div class="aviso"><ul style="margin:0;padding-left:18px">${avisos.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul></div>` : ''}
    <div class="campos-empresa-grid">
      <div class="campo campo-span-2"><label>Natureza / tipo</label><div>${v(payload.natureza_operacao)} · ${resumo.interestadual ? 'interestadual' : 'dentro do estado'} · consumidor final: ${payload.consumidor_final ? 'sim' : 'não'}</div></div>
      <div class="campo"><label>Emitente</label><div>${v(payload.nome_emitente)}<br>CNPJ ${v(payload.cnpj_emitente)} · IE ${v(payload.inscricao_estadual_emitente)}<br>${v(payload.logradouro_emitente)}, ${v(payload.numero_emitente)} — ${v(payload.municipio_emitente)}/${v(payload.uf_emitente)}</div></div>
      <div class="campo"><label>Destinatário</label><div>${v(payload.nome_destinatario)}<br>${v(payload.cnpj_destinatario || payload.cpf_destinatario)} · IE ${v(payload.inscricao_estadual_destinatario)}<br>${v(payload.logradouro_destinatario)}, ${v(payload.numero_destinatario)} — ${v(payload.municipio_destinatario)}/${v(payload.uf_destinatario)}</div></div>
    </div>
    <div style="overflow:auto">
    <table class="data-table">
      <thead><tr><th>#</th><th>Cód.</th><th>Descrição</th><th>NCM</th><th>CFOP</th><th>Orig/CST</th><th>Qtd.</th><th>Unit.</th><th>Valor</th><th>IBS/CBS</th></tr></thead>
      <tbody>${itens || '<tr><td colspan="10" class="vazio">Sem itens.</td></tr>'}</tbody>
    </table>
    </div>
    <div class="nfe-totais">
      Produtos: <strong>${formatarMoeda(payload.valor_produtos)}</strong> · Frete: ${formatarMoeda(payload.valor_frete)} · <strong>Total: ${formatarMoeda(payload.valor_total)}</strong>
      ${payload.ibs_cbs_is_valor_total !== undefined ? `<br>IBS/CBS (destaque): CBS ${formatarMoeda(payload.cbs_valor_total)} · IBS ${formatarMoeda(payload.ibs_valor_total)}` : ''}

function mostrarStatusNfe(texto, tipo) {
  const el = document.getElementById('nfe-emitir-status');
  if (!el) return;
  el.style.display = 'block';
  el.className = 'nfe-status' + (tipo ? ' nfe-status-' + tipo : '');
  el.innerHTML = escapeHtml(texto).replace(/\n/g, '<br>');
}

function atualizarVendaNfe(vendaId, alteracoes) {
  const vendas = loadList('vendas');
  const idx = vendas.findIndex(v => v.id === vendaId);
  if (idx === -1) return null;
  vendas[idx] = { ...vendas[idx], ...alteracoes };
  saveList('vendas', vendas);
  return vendas[idx];
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function transmitirNfeVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  const cfg = configNfe();
  const opcoes = opcoesNfeDoFormulario(venda);
  const { payload, erros, resumo } = montarNfeVenda(venda, opcoes);
  if (erros.length) {
    alert('Corrija antes de transmitir:\n\n- ' + erros.join('\n- '));
    return;
  }
  if (cfg.ambiente === 'producao' && !confirm(
    `Transmitir a NF-e da Venda #${venda.id} em PRODUÇÃO?\n\nValor total: ${formatarMoeda(resumo.valorTotal)}\nCliente: ${payload.nome_destinatario}\n\nDepois de autorizada, a nota tem validade fiscal e só pode ser cancelada em até 24 horas.`
  )) return;

  // Reaproveita a mesma referência quando a tentativa anterior foi rejeitada
  // (a Focus permite reenviar e mantém a numeração).
  const ref = venda.nfe_ref && venda.nfe_status_api === 'erro_autorizacao' && venda.nfe_ambiente === cfg.ambiente
    ? venda.nfe_ref
    : `paptech-v${venda.id}-${Date.now().toString(36)}`;

  const botao = document.getElementById('nfe-emitir-botao');
  if (botao) { botao.disabled = true; botao.textContent = 'Transmitindo...'; }
  mostrarStatusNfe('Enviando a nota para a Focus NFe...', 'info');

  try {
    const { status, dados } = await chamarFocusNfe('POST', `/v2/nfe?ref=${encodeURIComponent(ref)}`, payload);
    if (status >= 400 && !dados.status) {
      mostrarStatusNfe('A nota não foi aceita:\n' + mensagemErroFocus(dados, status), 'erro');
      if (botao) { botao.disabled = false; botao.textContent = '📤 Transmitir para a SEFAZ'; }
      return;
    }
    atualizarVendaNfe(vendaId, {
      nfe_ref: ref,
      nfe_ambiente: cfg.ambiente,
      nfe_status_api: dados.status || 'processando_autorizacao',
      nfe_mensagem: '',
      nfe_envio: { prazos: resumo.prazos, valor_total: resumo.valorTotal, incluir_frete: !!opcoes.incluir_frete },
    });

    let retorno = dados;
    for (let tentativa = 0; tentativa < 20 && (!retorno.status || retorno.status === 'processando_autorizacao'); tentativa++) {
      mostrarStatusNfe(`Aguardando a SEFAZ autorizar... (${tentativa + 1})`, 'info');
      await esperar(3000);
      const consulta = await chamarFocusNfe('GET', `/v2/nfe/${encodeURIComponent(ref)}`);
      retorno = consulta.dados || {};
    }
    const resultado = processarRetornoNfe(vendaId, retorno);
    renderSecaoAtualAposNfe();
    if (resultado === 'autorizado') {
      fecharModal();
      abrirGerenciarNfeVenda(vendaId, 'NF-e autorizada! O estoque foi baixado e as parcelas foram lançadas em Contas a Receber (se ainda não tinham sido).');
    } else if (resultado === 'processando_autorizacao') {
      mostrarStatusNfe('A SEFAZ ainda está processando. Feche esta janela e use "Consultar na SEFAZ" daqui a alguns minutos.', 'info');
    } else {
      mostrarStatusNfe(`${textoStatusApiNfe(retorno.status)}:\n${mensagemErroFocus(retorno, 200)}\n\nCorrija o problema e transmita de novo.`, 'erro');
      if (botao) { botao.disabled = false; botao.textContent = '📤 Transmitir novamente'; }
    }
  } catch (erro) {
    mostrarStatusNfe(erro.message, 'erro');
    if (botao) { botao.disabled = false; botao.textContent = '📤 Transmitir para a SEFAZ'; }
  }
}

/* Aplica o retorno da Focus na venda. Retorna o status da API. */
function processarRetornoNfe(vendaId, dados) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda || !dados) return null;
  const status = dados.status || venda.nfe_status_api;
  const base = {
    nfe_status_api: status,
    nfe_mensagem: dados.mensagem_sefaz ? `${dados.status_sefaz ? dados.status_sefaz + ' - ' : ''}${dados.mensagem_sefaz}` : (venda.nfe_mensagem || ''),
  };

  if (status === 'autorizado') {
    const jaEmitida = venda.status_nf === 'Emitida';
    const alteracoes = {
      ...base,
      status_nf: 'Emitida',
      numero_nf: String(dados.numero || venda.numero_nf || ''),
      serie_nf: String(dados.serie || venda.serie_nf || ''),
      chave_nfe: somenteDigitos(dados.chave_nfe) || venda.chave_nfe || '',
      data_emissao_nf: venda.data_emissao_nf && jaEmitida ? venda.data_emissao_nf : dataHojeLocalIso(),
      nfe_protocolo: dados.protocolo || venda.nfe_protocolo || '',
      nfe_caminho_danfe: dados.caminho_danfe || venda.nfe_caminho_danfe || '',
      nfe_caminho_xml: dados.caminho_xml_nota_fiscal || venda.nfe_caminho_xml || '',
    };
    // Primeira vez que fica autorizada: baixa estoque e lança Contas a Receber
    // (mesmo efeito do antigo "marcar como Emitida"), se ainda não foi gerado.
    if (!jaEmitida && !venda.recebimento_gerado) {
      const envio = venda.nfe_envio || {};
      alteracoes.prazos_pagamento = Array.isArray(envio.prazos) && envio.prazos.length ? envio.prazos : (venda.prazos_pagamento || [0]);
      alteracoes.recebimento_gerado = true;
      const vendaAtualizada = atualizarVendaNfe(vendaId, alteracoes);
      aplicarBaixaEstoqueVenda(vendaAtualizada.itens || []);
      gerarParcelasReceber({ ...vendaAtualizada, valor_total: Number(envio.valor_total) || vendaAtualizada.valor_total });
    } else {
      atualizarVendaNfe(vendaId, alteracoes);
    }
    return status;
  }

  if (status === 'cancelado') {
    atualizarVendaNfe(vendaId, {
      ...base,
      status_nf: 'Cancelada',
      nfe_caminho_xml_cancelamento: dados.caminho_xml_cancelamento || venda.nfe_caminho_xml_cancelamento || '',
    });
    return status;
  }

  atualizarVendaNfe(vendaId, base);
  return status;
}

function renderSecaoAtualAposNfe() {

  if (vendasVisivel && vendasVisivel.innerHTML) renderVendas();
  if (nfVisivel && nfVisivel.innerHTML) renderNotasFiscais();
