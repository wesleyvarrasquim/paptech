let relatorioVendasTemp = null;

function abrirRelatorioVendas() {
  const vendas = loadList('vendas');
  const vendedoresNasVendas = [...new Set(vendas.map(v => (v.vendedor || '').trim()).filter(Boolean))].sort();

  abrirModal(`
    <h2>Relatório de Vendas</h2>
    <div class="campo">
      <label>Vendedor</label>
      <select id="rel-vendas-vendedor">
        <option value="">Todos (Geral)</option>
        ${vendedoresNasVendas.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')}
      </select>
    </div>
    <div class="item-linha">
      <div class="campo">
        <label>Data Início</label>
        <input type="date" id="rel-vendas-data-inicio">
      </div>
      <div class="campo">
        <label>Data Fim</label>
        <input type="date" id="rel-vendas-data-fim">
      </div>
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="gerarRelatorioVendas()">Gerar Relatório</button>
      <button type="button" class="btn-secondary" onclick="imprimirRelatorioVendas()">Imprimir</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
    <div id="rel-vendas-resultado" style="margin-top:16px"></div>
  `);

  gerarRelatorioVendas();
}

function gerarRelatorioVendas() {
  const vendedorFiltro = document.getElementById('rel-vendas-vendedor').value;
  const dataInicio = document.getElementById('rel-vendas-data-inicio').value;
  const dataFim = document.getElementById('rel-vendas-data-fim').value;

  const clientes = loadList('clientes');
  let vendas = loadList('vendas');

  if (vendedorFiltro) {
    vendas = vendas.filter(v => (v.vendedor || '').trim() === vendedorFiltro);
  }
  if (dataInicio) {
    vendas = vendas.filter(v => (v.data_venda || '') >= dataInicio);
  }
  if (dataFim) {
    vendas = vendas.filter(v => (v.data_venda || '') <= dataFim);
  }

  // Agrupamento por vendedor (no relatório geral mostra todos; filtrado por um vendedor, mostra só ele).
  const porVendedor = {};
  vendas.forEach(v => {
    const nome = (v.vendedor || '').trim() || '(Não informado)';
    if (!porVendedor[nome]) porVendedor[nome] = { qtd: 0, valor: 0 };
    porVendedor[nome].qtd += 1;
    porVendedor[nome].valor += Number(v.valor_total) || 0;
  });

  const valorTotalGeral = vendas.reduce((soma, v) => soma + (Number(v.valor_total) || 0), 0);

  const linhasResumo = Object.keys(porVendedor).sort().map(nome => `
    <tr>
      <td>${escapeHtml(nome)}</td>
      <td>${porVendedor[nome].qtd}</td>
      <td>${formatarMoeda(porVendedor[nome].valor)}</td>
    </tr>
  `).join('');

  const linhasDetalhe = vendas.slice().sort((a, b) => (a.data_venda || '').localeCompare(b.data_venda || '')).map(v => {
    const cliente = clientes.find(c => c.id === v.cliente_id);
    return `
      <tr>
        <td>${formatarDataBr(v.data_venda)}</td>
        <td>${escapeHtml(v.vendedor || '(Não informado)')}</td>
        <td>${escapeHtml(cliente ? cliente.razao_social : '-')}</td>
        <td>${escapeHtml(v.numero || '-')}</td>
        <td>${escapeHtml(v.numero_nf || '-')} ${v.status_nf ? '(' + escapeHtml(v.status_nf) + ')' : ''}</td>
        <td>${formatarMoeda(v.valor_total)}</td>
      </tr>
    `;
  }).join('');

  const html = `
    <h3>Resumo por Vendedor</h3>
    <table class="data-table">
      <thead><tr><th>Vendedor</th><th>Qtd. Vendas</th><th>Valor Total</th></tr></thead>
      <tbody>${linhasResumo || '<tr><td colspan="3" class="vazio">Nenhuma venda encontrada para esse filtro.</td></tr>'}</tbody>
    </table>
    <h3 style="margin-top:16px">Detalhamento</h3>
    <table class="data-table">
      <thead><tr><th>Data</th><th>Vendedor</th><th>Cliente</th><th>Número</th><th>Nota Fiscal</th><th>Valor</th></tr></thead>
      <tbody>${linhasDetalhe || '<tr><td colspan="6" class="vazio">Nenhuma venda encontrada para esse filtro.</td></tr>'}</tbody>
    </table>
    <div class="totais-relatorio"><strong>Total Geral:</strong> ${formatarMoeda(valorTotalGeral)} &nbsp; (${vendas.length} venda(s))</div>
  `;

  document.getElementById('rel-vendas-resultado').innerHTML = html;

  relatorioVendasTemp = {
    vendedorFiltro, dataInicio, dataFim, linhasResumo, linhasDetalhe,
    valorTotalGeral, totalVendas: vendas.length,
  };
}

function imprimirRelatorioVendas() {
  if (!relatorioVendasTemp) {
    alert('Gere o relatório antes de imprimir.');
    return;
  }
  const { vendedorFiltro, dataInicio, dataFim, linhasResumo, linhasDetalhe, valorTotalGeral, totalVendas } = relatorioVendasTemp;

  const filtrosTexto = [
    vendedorFiltro ? `Vendedor: ${vendedorFiltro}` : 'Vendedor: Todos (Geral)',
    dataInicio ? `De: ${formatarDataBr(dataInicio)}` : '',
    dataFim ? `Até: ${formatarDataBr(dataFim)}` : '',
  ].filter(Boolean).join(' &nbsp;|&nbsp; ');

  const htmlImpressao = `
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
      <meta charset="UTF-8">
      <title>Relatório de Vendas</title>
      <style>
        body { font-family: Arial, Helvetica, sans-serif; color: #111; padding: 28px; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        h3 { font-size: 14px; margin: 18px 0 6px; }
        .sub { color: #555; font-size: 12px; margin-bottom: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 6px; }
        th, td { border: 1px solid #999; padding: 6px 8px; font-size: 12px; }
        th { background: #eee; text-align: left; }
        .totais { margin-top: 14px; text-align: right; font-size: 14px; font-weight: bold; }
        @media print { body { padding: 10px; } }
      </style>
    </head>
    <body>
      <h1>PAPTECH - Relatório de Vendas</h1>
      <div class="sub">${filtrosTexto} &nbsp;|&nbsp; Gerado em: ${formatarDataBr(new Date().toISOString().slice(0, 10))}</div>

      <h3>Resumo por Vendedor</h3>
      <table>
        <thead><tr><th>Vendedor</th><th>Qtd. Vendas</th><th>Valor Total</th></tr></thead>
        <tbody>${linhasResumo || '<tr><td colspan="3">Nenhuma venda encontrada.</td></tr>'}</tbody>
      </table>

      <h3>Detalhamento</h3>
      <table>
        <thead><tr><th>Data</th><th>Vendedor</th><th>Cliente</th><th>Número</th><th>Nota Fiscal</th><th>Valor</th></tr></thead>
        <tbody>${linhasDetalhe || '<tr><td colspan="6">Nenhuma venda encontrada.</td></tr>'}</tbody>
      </table>

      <div class="totais">Total Geral: ${formatarMoeda(valorTotalGeral)} (${totalVendas} venda(s))</div>
    </body>
    </html>
  `;

  const janela = window.open('', '_blank');
  if (!janela) {
    alert('Não foi possível abrir a janela de impressão. Verifique se o navegador está bloqueando pop-ups.');
    return;
  }
  janela.document.write(htmlImpressao);
  janela.document.close();
  janela.focus();
  janela.print();
}

/* ---------- CONTAS A RECEBER / CONTAS A PAGAR ---------- */

const CONFIG_CONTAS = {
  receber: {
    storageKey: 'contas_receber',
    titulo: 'Contas a Receber',
    entidadeLista: 'clientes',
    campoEntidadeId: 'cliente_id',
    origemLista: 'vendas',
    campoOrigemId: 'venda_id',
    labelEntidade: 'Cliente',
    labelOrigem: 'Venda',
    labelPago: 'Recebido',
    campoDataPagamento: 'data_recebimento',
  },
  pagar: {
    storageKey: 'contas_pagar',
    titulo: 'Contas a Pagar',
    entidadeLista: 'fornecedores',
    campoEntidadeId: 'fornecedor_id',
    origemLista: 'compras',
    campoOrigemId: 'compra_id',
    labelEntidade: 'Fornecedor',
    labelOrigem: 'Compra',
    labelPago: 'Pago',
    campoDataPagamento: 'data_pagamento',
  },
};

function renderContas(tipo) {
  const cfg = CONFIG_CONTAS[tipo];
  const todasContas = loadList(cfg.storageKey);
  const entidades = loadList(cfg.entidadeLista);
  const container = document.getElementById('sec-contas-' + tipo);
  const hoje = new Date().toISOString().slice(0, 10);
  const filtro = filtroContasTemp[tipo];

  const contas = todasContas.filter(c => {
    if (!filtro.inicio && !filtro.fim) return true;
    if (!c.data_vencimento) return false;
    if (filtro.inicio && c.data_vencimento < filtro.inicio) return false;
    if (filtro.fim && c.data_vencimento > filtro.fim) return false;
    return true;
  });

  const linhas = contas
    .slice()
    .sort((a, b) => (a.data_vencimento || '').localeCompare(b.data_vencimento || ''))
    .map(c => {
      const entidade = entidades.find(e => e.id === c[cfg.campoEntidadeId]);
      const pago = !!c[cfg.campoDataPagamento];
      let statusLabel = 'Pendente';
      let statusClasse = 'status-pendente';
      if (pago) {
        statusLabel = cfg.labelPago;
        statusClasse = 'status-pago';
      } else if (c.data_vencimento && c.data_vencimento < hoje) {
        statusLabel = 'Vencido';
        statusClasse = 'status-vencido';
      }

      return `
        <tr>
          <td>${escapeHtml(entidade ? entidade.razao_social : `${cfg.labelEntidade} não cadastrado`)}</td>
          <td>${escapeHtml(c.descricao)}</td>
          <td>${formatarMoeda(c.valor)}</td>
          <td>${formatarDataBr(c.data_vencimento)}</td>
          <td><span class="status-badge ${statusClasse}">${statusLabel}</span></td>
          <td class="acoes-conta">
            ${!pago ? `<button class="btn-baixa" onclick="marcarContaComoPaga('${tipo}', ${c.id})" title="Marcar como ${cfg.labelPago.toLowerCase()}">&#10003; ${cfg.labelPago === 'Recebido' ? 'Receber' : 'Pagar'}</button>` : ''}
            <button class="btn-excluir" onclick="excluirConta('${tipo}', ${c.id})" title="Excluir lançamento">&#128465; Excluir</button>
          </td>
        </tr>
      `;
    }).join('');

  const totalPendente = contas
    .filter(c => !c[cfg.campoDataPagamento])
    .reduce((soma, c) => soma + (Number(c.valor) || 0), 0);

  container.innerHTML = `
    <div class="section-header">
      <h1>${cfg.titulo}</h1>
      <div class="header-botoes">
        <button class="btn-secondary" onclick="abrirRelatorioContas('${tipo}')">&#128202; Relatório por Período</button>
        <button class="btn-primary" onclick="abrirFormConta('${tipo}')">+ Nova Conta</button>
      </div>
    </div>
    <div class="filtro-periodo-caixa">
      <div class="campo">
        <label>Vencimento de</label>
        <input type="date" id="filtro-${tipo}-inicio" value="${filtro.inicio}" onchange="aplicarFiltroContas('${tipo}')">
      </div>
      <div class="campo">
        <label>até</label>
        <input type="date" id="filtro-${tipo}-fim" value="${filtro.fim}" onchange="aplicarFiltroContas('${tipo}')">
      </div>
      <button type="button" class="btn-secondary" onclick="limparFiltroContas('${tipo}')">Limpar período</button>
    </div>
    <div class="resumo-total">Total pendente${filtro.inicio || filtro.fim ? ' (no período filtrado)' : ''}: <strong>${formatarMoeda(totalPendente)}</strong></div>
    <table class="data-table">
      <thead>
        <tr><th>${cfg.labelEntidade}</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>${linhas || `<tr><td colspan="6" class="vazio">Nenhuma conta encontrada${filtro.inicio || filtro.fim ? ' nesse período' : ''}.</td></tr>`}</tbody>
    </table>
  `;
}

function aplicarFiltroContas(tipo) {
  filtroContasTemp[tipo] = {
    inicio: document.getElementById(`filtro-${tipo}-inicio`).value,
    fim: document.getElementById(`filtro-${tipo}-fim`).value,
  };
  renderContas(tipo);
}

function limparFiltroContas(tipo) {
  filtroContasTemp[tipo] = { inicio: '', fim: '' };
  renderContas(tipo);
}

function abrirFormConta(tipo) {
  const cfg = CONFIG_CONTAS[tipo];
  const entidades = loadList(cfg.entidadeLista);
  const origens = loadList(cfg.origemLista);

  abrirModal(`
    <h2>Nova Conta a ${tipo === 'receber' ? 'Receber' : 'Pagar'}</h2>
    ${entidades.length === 0 ? `<div class="aviso">Nenhum ${cfg.labelEntidade.toLowerCase()} cadastrado ainda.</div>` : ''}
    <div class="campo">
      <label>${cfg.labelOrigem} de referência (opcional)</label>
      <select id="conta-origem" onchange="preencherContaAPartirDaOrigem('${tipo}')">
        <option value="">Nenhuma (lançamento avulso)</option>
        ${origens.slice().reverse().map(o => `<option value="${o.id}">#${o.id} - ${formatarMoeda(o.valor_total)} - ${formatarDataBr(o.data_venda || o.data_compra)}</option>`).join('')}
      </select>
    </div>
    <div class="campo">
      <label>${cfg.labelEntidade} *</label>
      <select id="conta-entidade">
        <option value="">Selecione...</option>
        ${entidades.map(e => `<option value="${e.id}">${escapeHtml(e.razao_social)}</option>`).join('')}
      </select>
    </div>
    <div class="campo">
      <label>Descrição</label>
      <input type="text" id="conta-descricao" placeholder="Ex: ${cfg.labelOrigem} #12">
    </div>
    <div class="campo">
      <label>Valor (R$) *</label>
      <input type="text" id="conta-valor" placeholder="0,00">
    </div>
    <div class="campo">
      <label>Data de Vencimento *</label>
      <input type="date" id="conta-vencimento">
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="salvarConta('${tipo}')">Salvar</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function preencherContaAPartirDaOrigem(tipo) {
  const cfg = CONFIG_CONTAS[tipo];
  const origemId = document.getElementById('conta-origem').value;
  if (!origemId) return;
  const origem = loadList(cfg.origemLista).find(o => o.id === Number(origemId));
  if (!origem) return;

  document.getElementById('conta-entidade').value = origem[cfg.campoEntidadeId] || '';
  document.getElementById('conta-valor').value = (Number(origem.valor_total) || 0).toFixed(2).replace('.', ',');
  document.getElementById('conta-descricao').value = `${cfg.labelOrigem} #${origem.id}`;
  const dataOrigem = origem.data_venda || origem.data_compra || '';
  if (dataOrigem) document.getElementById('conta-vencimento').value = dataOrigem;
}

function salvarConta(tipo) {
  const cfg = CONFIG_CONTAS[tipo];
  const entidadeId = document.getElementById('conta-entidade').value;
  const valor = numeroBr(document.getElementById('conta-valor').value);
  const vencimento = document.getElementById('conta-vencimento').value;
  const descricaoDigitada = document.getElementById('conta-descricao').value.trim();
  const origemId = document.getElementById('conta-origem').value;

  if (!entidadeId) {
    alert(`Selecione o ${cfg.labelEntidade.toLowerCase()}.`);
    return;
  }
  if (!valor || valor <= 0) {
    alert('Informe um valor válido.');
    return;
  }
  if (!vencimento) {
    alert('Informe a data de vencimento.');
    return;
  }

  const contas = loadList(cfg.storageKey);
  const novaConta = {
    id: nextId(contas),
    [cfg.campoEntidadeId]: Number(entidadeId),
    [cfg.campoOrigemId]: origemId ? Number(origemId) : null,
    descricao: descricaoDigitada || `${cfg.labelOrigem} #${origemId || '-'}`,
    valor: valor,
    data_vencimento: vencimento,
    [cfg.campoDataPagamento]: null,
  };
  contas.push(novaConta);
  saveList(cfg.storageKey, contas);
  fecharModal();
  renderContas(tipo);
}

function marcarContaComoPaga(tipo, id) {
  const cfg = CONFIG_CONTAS[tipo];
  const contas = loadList(cfg.storageKey);
  const idx = contas.findIndex(c => c.id === id);
  if (idx === -1) return;
  contas[idx][cfg.campoDataPagamento] = new Date().toISOString().slice(0, 10);
  saveList(cfg.storageKey, contas);
  renderContas(tipo);
}

function excluirConta(tipo, id) {
  if (!confirm('Deseja realmente excluir esta conta?')) return;
  const cfg = CONFIG_CONTAS[tipo];
  const contas = loadList(cfg.storageKey).filter(c => c.id !== id);
  saveList(cfg.storageKey, contas);
  renderContas(tipo);
}

/* Relatório por período de Contas a Receber/Pagar: resumo (total no período, total já
   pago/recebido, pendente e vencido) + detalhamento, com opção de imprimir. Usa o mesmo

function abrirRelatorioContas(tipo) {

    <div class="campo">
      <label>Situação</label>
      <select id="rel-contas-status">
        <option value="">Todas</option>

function gerarRelatorioContas(tipo) {
  const cfg = CONFIG_CONTAS[tipo];
  const statusFiltro = document.getElementById('rel-contas-status').value;
  const dataInicio = document.getElementById('rel-contas-data-inicio').value;
  const dataFim = document.getElementById('rel-contas-data-fim').value;
  const entidades = loadList(cfg.entidadeLista);
  const hoje = new Date().toISOString().slice(0, 10);

  let contas = loadList(cfg.storageKey);
  if (dataInicio) contas = contas.filter(c => (c.data_vencimento || '') >= dataInicio);
  if (dataFim) contas = contas.filter(c => (c.data_vencimento || '') <= dataFim);
  if (statusFiltro === 'pendente') contas = contas.filter(c => !c[cfg.campoDataPagamento]);
  if (statusFiltro === 'pago') contas = contas.filter(c => !!c[cfg.campoDataPagamento]);
  if (statusFiltro === 'vencido') contas = contas.filter(c => !c[cfg.campoDataPagamento] && c.data_vencimento && c.data_vencimento < hoje);

  const totalGeral = contas.reduce((soma, c) => soma + (Number(c.valor) || 0), 0);
  const totalPago = contas.filter(c => !!c[cfg.campoDataPagamento]).reduce((soma, c) => soma + (Number(c.valor) || 0), 0);
  const totalPendente = contas.filter(c => !c[cfg.campoDataPagamento]).reduce((soma, c) => soma + (Number(c.valor) || 0), 0);
  const totalVencido = contas
    .filter(c => !c[cfg.campoDataPagamento] && c.data_vencimento && c.data_vencimento < hoje)
    .reduce((soma, c) => soma + (Number(c.valor) || 0), 0);

  const linhasDetalhe = contas
    .slice()
    .sort((a, b) => (a.data_vencimento || '').localeCompare(b.data_vencimento || ''))
    .map(c => {
      const entidade = entidades.find(e => e.id === c[cfg.campoEntidadeId]);
      const pago = !!c[cfg.campoDataPagamento];
      let statusLabel = 'Pendente';
      if (pago) statusLabel = cfg.labelPago;
      else if (c.data_vencimento && c.data_vencimento < hoje) statusLabel = 'Vencido';
      return `
        <tr>
          <td>${formatarDataBr(c.data_vencimento)}</td>
          <td>${escapeHtml(entidade ? entidade.razao_social : `${cfg.labelEntidade} não cadastrado`)}</td>
          <td>${escapeHtml(c.descricao || '-')}</td>
          <td>${formatarMoeda(c.valor)}</td>
          <td>${escapeHtml(statusLabel)}</td>
          <td>${pago ? formatarDataBr(c[cfg.campoDataPagamento]) : '-'}</td>
        </tr>
      `;
    }).join('');

  const html = `
    <h3>Resumo</h3>
    <table class="data-table">
      <thead><tr><th>Total no Período</th><th>Total ${escapeHtml(cfg.labelPago)}</th><th>Total Pendente</th><th>Total Vencido</th></tr></thead>
      <tbody>
        <tr>
          <td>${formatarMoeda(totalGeral)}</td>

/* ---------- CALCULADORA ---------- */

let calculadoraVisor = '0';
let calculadoraValorAnterior = null;
let calculadoraOperador = null;
let calculadoraAguardandoNovoNumero = false;

function renderCalculadora() {
  const container = document.getElementById('sec-calculadora');
  calculadoraVisor = '0';
  calculadoraValorAnterior = null;
  calculadoraOperador = null;
  calculadoraAguardandoNovoNumero = false;

  const teclas = [
    ['C', 'calculadoraLimpar()'], ['÷', "calculadoraOperar('/')"], ['×', "calculadoraOperar('*')"], ['⌫', 'calculadoraApagar()'],
    ['7', "calculadoraDigitar('7')"], ['8', "calculadoraDigitar('8')"], ['9', "calculadoraDigitar('9')"], ['-', "calculadoraOperar('-')"],
    ['4', "calculadoraDigitar('4')"], ['5', "calculadoraDigitar('5')"], ['6', "calculadoraDigitar('6')"], ['+', "calculadoraOperar('+')"],
    ['1', "calculadoraDigitar('1')"], ['2', "calculadoraDigitar('2')"], ['3', "calculadoraDigitar('3')"], ['=', 'calculadoraIgual()'],
    ['0', "calculadoraDigitar('0')"], [',', "calculadoraDigitar(',')"],
  ];

  const botoesHtml = teclas.map(([rotulo, acao]) => `<button type="button" class="tecla-calc" onclick="${acao}">${rotulo}</button>`).join('');

  container.innerHTML = `
    <div class="section-header">
      <h1>Calculadora</h1>
    </div>
    <div class="calculadora-caixa">
      <div id="calculadora-visor" class="calculadora-visor">0</div>
      <div class="calculadora-teclado">${botoesHtml}</div>
    </div>
  `;
}

function calculadoraAtualizarVisor() {
  document.getElementById('calculadora-visor').textContent = calculadoraVisor;
}

function calculadoraDigitar(caractere) {
  if (calculadoraAguardandoNovoNumero) {
    calculadoraVisor = caractere === ',' ? '0,' : caractere;
    calculadoraAguardandoNovoNumero = false;
  } else if (calculadoraVisor === '0' && caractere !== ',') {
    calculadoraVisor = caractere;
  } else if (caractere === ',' && calculadoraVisor.includes(',')) {
    // ja tem virgula, ignora
  } else {
    calculadoraVisor += caractere;
  }
  calculadoraAtualizarVisor();
}

function calculadoraApagar() {
  calculadoraVisor = calculadoraVisor.length > 1 ? calculadoraVisor.slice(0, -1) : '0';
  calculadoraAtualizarVisor();
}

function calculadoraLimpar() {
  calculadoraVisor = '0';
  calculadoraValorAnterior = null;
  calculadoraOperador = null;
  calculadoraAguardandoNovoNumero = false;
  calculadoraAtualizarVisor();
}

function calculadoraOperar(novoOperador) {
  const atual = numeroBr(calculadoraVisor);
  if (calculadoraOperador && !calculadoraAguardandoNovoNumero) {
    calculadoraValorAnterior = calculadoraCalcular(calculadoraValorAnterior, atual, calculadoraOperador);
    calculadoraVisor = String(calculadoraValorAnterior).replace('.', ',');
  } else {
    calculadoraValorAnterior = atual;
  }
  calculadoraOperador = novoOperador;
  calculadoraAguardandoNovoNumero = true;
  calculadoraAtualizarVisor();
}

function calculadoraCalcular(a, b, operador) {
  if (operador === '+') return a + b;
  if (operador === '-') return a - b;
  if (operador === '*') return a * b;
  if (operador === '/') return b === 0 ? 0 : a / b;
  return b;
}

function calculadoraIgual() {
  if (calculadoraOperador === null || calculadoraValorAnterior === null) return;
  const atual = numeroBr(calculadoraVisor);
  const resultado = calculadoraCalcular(calculadoraValorAnterior, atual, calculadoraOperador);
  calculadoraVisor = String(Math.round(resultado * 10000) / 10000).replace('.', ',');
  calculadoraOperador = null;
  calculadoraValorAnterior = null;
  calculadoraAguardandoNovoNumero = true;
  calculadoraAtualizarVisor();
}

function renderBackup() {
  const container = document.getElementById('sec-backup');
  container.innerHTML = `
    <div class="section-header">
      <h1>Backup / Restauração</h1>
    </div>
    <div class="aviso">
      Todos os dados do sistema ficam salvos apenas neste navegador (localStorage). Se você limpar os dados do
      navegador, trocar de computador ou de navegador, essas informações não acompanham. Baixe um backup
      periodicamente para não correr o risco de perder tudo.
    </div>
    <div class="backup-caixa">
      <h2>Baixar backup</h2>
      <p>Gera um arquivo .json com todos os Clientes, Fornecedores, Transportadoras, Produtos, Compras, Vendas e Contas cadastrados.</p>
      <button class="btn-primary" onclick="baixarBackup()">Baixar backup (.json)</button>
    </div>
    <div class="backup-caixa">
      <h2>Restaurar backup</h2>
      <p>Selecione um arquivo .json gerado pelo botão acima. <strong>Isso substitui todos os dados atuais deste navegador.</strong></p>
      <input type="file" accept=".json" id="input-restaurar-backup" onchange="restaurarBackup(event)">
    </div>
  `;
}

function baixarBackup() {
  const dadosCompletos = {};
  Object.keys(STORAGE_KEYS).forEach(chave => {
    dadosCompletos[chave] = loadList(chave);
  });
  dadosCompletos._geradoEm = new Date().toISOString();
  dadosCompletos._sistema = 'PAPTECH';

  const blob = new Blob([JSON.stringify(dadosCompletos, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `paptech-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

async function restaurarBackup(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;

  if (!confirm('Isso vai substituir TODOS os dados atuais deste navegador pelos dados do arquivo. Deseja continuar?')) {
    event.target.value = '';
    return;
  }

  try {
    const texto = await arquivo.text();
    const dados = JSON.parse(texto);
    Object.keys(STORAGE_KEYS).forEach(chave => {
      if (Array.isArray(dados[chave])) {
        saveList(chave, dados[chave]);
      }
    });
    alert('Backup restaurado com sucesso! A página vai recarregar agora.');
    window.location.reload();
  } catch (erro) {
    alert('Não foi possível ler esse arquivo de backup: ' + erro.message);
  } finally {
    event.target.value = '';
  }
}

async function salvarUsuario(event, id) {
  event.preventDefault();
  const nome = document.getElementById('usuario-nome').value.trim();
  const login = document.getElementById('usuario-login').value.trim();
  const senha = document.getElementById('usuario-senha').value;
  const nivel = document.getElementById('usuario-nivel').value;
  const status = document.getElementById('usuario-status').value;

  if (!nome || !login) {
    alert('Informe nome e login do usuário.');
    return false;
  }

  const lista = loadList('usuarios');
  const loginDuplicado = lista.some(u => u.id !== id && u.login.toLowerCase() === login.toLowerCase());
  if (loginDuplicado) {
    alert('Já existe um usuário com esse login. Escolha outro.');
    return false;
  }

  if (!id && !senha) {
    alert('Informe uma senha para o novo usuário.');
    return false;
  }
  if (senha) {
    const problemaSenha = validarSenhaNova(senha, login);
    if (problemaSenha) {
      alert(problemaSenha);
      return false;
    }
  }

  // Garante que sempre sobre pelo menos um Administrador ativo no sistema.
  const ficariaSemAdminAtivo = quantidadeAdministradoresAtivos(lista, id) === 0 && (nivel !== 'Administrador' || status === 'Inativo');
  if (ficariaSemAdminAtivo) {
    alert('Não é possível salvar: precisa existir ao menos um usuário Administrador ativo no sistema.');
    return false;
  }

  const permissoes = nivel === 'Administrador' ? permissoesTotais() : permissoesVazias();
  if (nivel !== 'Administrador') {
    document.querySelectorAll('.checkbox-permissao-usuario').forEach(chk => {
      permissoes[chk.value] = chk.checked;
    });
    document.querySelectorAll('.select-permissao-usuario').forEach(sel => {
      permissoes[sel.dataset.secao] = sel.value;
    });
  }

  const dados = { nome, login, nivel, status, permissoes };

  if (id) {
    const idx = lista.findIndex(u => u.id === id);
    lista[idx] = { ...lista[idx], ...dados };
    if (senha) {
      try { await aplicarSenhaComHash(lista[idx], senha); } catch (e) { alert(e.message); return false; }
    }
  } else {
    dados.id = nextId(lista);
    try { await aplicarSenhaComHash(dados, senha); } catch (e) { alert(e.message); return false; }
    lista.push(dados);
  }
  saveList('usuarios', lista);
  fecharModal();
  renderConfiguracoes();

  // Se o usuário editado for o que está logado agora, atualiza o menu lateral na hora
  // (ex.: caso ele tenha perdido acesso a alguma área).
  const logado = usuarioLogado();
  if (logado && logado.id === id) aplicarPermissoesNaTela();
  return false;
}

function excluirUsuario(id) {
  const logado = usuarioLogado();
  if (logado && logado.id === id) {
    alert('Você não pode excluir o usuário com o qual está logado agora. Entre com outro Administrador para excluí-lo.');
    return;
  }
  const lista = loadList('usuarios');
  const alvo = lista.find(u => u.id === id);
  if (alvo && alvo.nivel === 'Administrador' && quantidadeAdministradoresAtivos(lista, id) === 0) {
    alert('Não é possível excluir: precisa existir ao menos um usuário Administrador ativo no sistema.');

  }
  if (!confirm('Deseja realmente excluir este usuário?')) return;
  saveList('usuarios', lista.filter(u => u.id !== id));
  renderConfiguracoes();
}

/* ---------- importacao de XML de NF-e ---------- */

function elLocal(escopo, nome) {
  if (!escopo) return null;
  const todos = escopo.getElementsByTagName('*');
  for (const el of todos) if (el.localName === nome) return el;
  return null;
}

function textLocal(escopo, nome) {
  const el = elLocal(escopo, nome);
  return el ? (el.textContent || '').trim() : '';
}

function allLocal(escopo, nome) {
  if (!escopo) return [];
  const todos = escopo.getElementsByTagName('*');
  const resultado = [];
  for (const el of todos) if (el.localName === nome) resultado.push(el);
  return resultado;
}

let importacaoXmlTemp = null;

async function parseXmlNfeArquivo(arquivo) {
  const texto = await arquivo.text();
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.querySelector('parsererror')) {
    throw new Error('arquivo XML inválido');
  }

  const infNFe = elLocal(doc, 'infNFe');
  if (!infNFe) {
    throw new Error('tag infNFe não encontrada - o arquivo não parece ser uma NF-e válida');
  }

  const emit = elLocal(infNFe, 'emit');
  const ender = elLocal(emit, 'enderEmit');
  const fornecedorDados = {
    razao_social: textLocal(emit, 'xNome'),
    cnpj: textLocal(emit, 'CNPJ'),
    inscricao_estadual: textLocal(emit, 'IE'),
    endereco: textLocal(ender, 'xLgr'),
    numero: textLocal(ender, 'nro'),
    bairro: textLocal(ender, 'xBairro'),
    cidade: textLocal(ender, 'xMun'),
    uf: textLocal(ender, 'UF'),
    cep: textLocal(ender, 'CEP'),
  };

  const ide = elLocal(infNFe, 'ide');
  const numeroNf = textLocal(ide, 'nNF');
  const dhEmi = textLocal(ide, 'dhEmi') || textLocal(ide, 'dEmi');
  const dataEmissao = dhEmi ? dhEmi.slice(0, 10) : new Date().toISOString().slice(0, 10);

  let chave = infNFe.getAttribute('Id') || '';
  if (chave.startsWith('NFe')) chave = chave.slice(3);

  // Duplicatas (cobr/dup): é onde a NF-e costuma trazer o prazo real de pagamento (vencimento e valor de cada parcela).
  const cobr = elLocal(infNFe, 'cobr');
  const duplicatas = allLocal(cobr, 'dup').map(dup => ({
    numero: textLocal(dup, 'nDup'),
    vencimento: textLocal(dup, 'dVenc'),
    valor: parseFloat(textLocal(dup, 'vDup') || '0'),
  })).filter(d => d.vencimento);

  const itens = allLocal(infNFe, 'det').map(det => {
    const prod = elLocal(det, 'prod');
    return {
      cod_original: textLocal(prod, 'cProd'),
      descricao: textLocal(prod, 'xProd'),
      unidade_medida: textLocal(prod, 'uCom') || 'UN',
      quantidade: parseFloat(textLocal(prod, 'qCom') || '0'),
      valor_unitario: parseFloat(textLocal(prod, 'vUnCom') || '0'),
      valor_total: parseFloat(textLocal(prod, 'vProd') || '0'),
    };
  });

  if (!itens.length) {
    throw new Error('nenhum item (tag det/prod) encontrado no XML');
  }

  const produtos = loadList('produtos');
  const itensRevisao = itens.map(it => {
    const produtoMatch = it.cod_original
      ? produtos.find(p =>
          (p.cod_original && p.cod_original === it.cod_original) ||
          codigosSimilares(p).includes(it.cod_original)
        )
      : null;
    return { ...it, produto_id: produtoMatch ? produtoMatch.id : null, margem_lucro: 30 };
  });

  return { fornecedorDados, numeroNf, chave, dataEmissao, duplicatas, itens: itensRevisao };
}

async function importarXmlNfe(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;

  try {
    const dadosXml = await parseXmlNfeArquivo(arquivo);
    importacaoXmlTemp = { ...dadosXml, compraIdExistente: null };
    abrirRevisaoImportacaoXml();
  } catch (erro) {
    alert('Não foi possível importar o XML: ' + erro.message);
  } finally {
    event.target.value = '';
  }
}

  } catch (erro) {
    alert('Não foi possível importar o XML: ' + erro.message);

}

function rotuloProdutoXml(p) {
  return `${p.descricao || ''} (Cód: ${p.cod_interno || p.cod_original || '-'}) #${p.id}`;
}

/* Guarda o que já foi digitado na revisão do XML (para reabrir a tela depois de escolher um produto). */
function capturarRevisaoXml() {
  const t = importacaoXmlTemp;
  if (!t) return;
  const val = id => { const e = document.getElementById(id); return e ? e.value : null; };
  const r = { qtd: [], margem: [], vinc: [], dupVenc: [], dupValor: [], prazos: val('imp-xml-prazos-manual') || '' };
  t.itens.forEach((_, i) => { r.qtd[i] = val('imp-xml-qtd-' + i); r.margem[i] = val('imp-xml-margem-' + i); r.vinc[i] = val('imp-xml-vinc-' + i); });
  t.duplicatas.forEach((_, i) => { r.dupVenc[i] = val('imp-xml-dup-venc-' + i); r.dupValor[i] = val('imp-xml-dup-valor-' + i); });
  t.rascunho = r;
}

/* Tela de busca de produtos (por código, código de barras ou descrição) para um item do XML. */
function abrirSeletorProdutoXml(idx) {
  if (!importacaoXmlTemp) return;
  capturarRevisaoXml();
  const it = importacaoXmlTemp.itens[idx];
  abrirModal(`
    <h2>Escolher produto — item ${idx + 1}</h2>
    <div class="info-cliente-caixa">
      <div><strong>Na nota:</strong> ${escapeHtml(it.descricao)} <small>(Cód. na NF: ${escapeHtml(it.cod_original || '-')})</small></div>
    </div>
    <div class="campo">
      <label>Buscar por código ou descrição</label>
      <input type="text" id="imp-xml-busca" autocomplete="off" oninput="filtrarSeletorProdutoXml(${idx})">
    </div>
    <div id="imp-xml-busca-resultados" style="max-height:340px;overflow:auto"></div>
    <div class="modal-botoes">
      <button type="button" class="btn-secondary" onclick="escolherProdutoXml(${idx}, null)">Cadastrar como produto novo</button>
      <button type="button" class="btn-secondary" onclick="abrirRevisaoImportacaoXml()">Voltar</button>
    </div>
  `);
  const campo = document.getElementById('imp-xml-busca');
  campo.value = it.cod_original || '';
  campo.focus();
  filtrarSeletorProdutoXml(idx);
}

function filtrarSeletorProdutoXml(idx) {
  const termo = document.getElementById('imp-xml-busca').value.trim();
  const alvo = document.getElementById('imp-xml-busca-resultados');
  const todos = loadList('produtos');
  const lista = (termo ? filtrarProdutosPorTermo(todos, termo) : todos).slice(0, 50);
  alvo.innerHTML = lista.length ? `
    <table class="data-table">
      <thead><tr><th>Código</th><th>Descrição</th><th>Estoque</th><th></th></tr></thead>
      <tbody>${lista.map(p => `
        <tr>
          <td>${escapeHtml(p.cod_interno || p.cod_original || '-')}</td>
          <td>${escapeHtml(p.descricao)}</td>
          <td>${Number(p.estoque_atual) || 0}</td>
          <td><button type="button" class="btn-primary" onclick="escolherProdutoXml(${idx}, ${p.id})">Selecionar</button></td>
        </tr>`).join('')}
      </tbody>
    </table>${todos.length > lista.length && !termo ? '<small>Mostrando os 50 primeiros — digite para filtrar.</small>' : ''}` : '<p class="vazio">Nenhum produto encontrado.</p>';
}

function escolherProdutoXml(idx, produtoId) {
  const t = importacaoXmlTemp;
  if (!t) return;
  const produto = produtoId ? loadList('produtos').find(p => p.id === produtoId) : null;
  if (!t.rascunho) capturarRevisaoXml();
  t.rascunho.vinc[idx] = produto ? rotuloProdutoXml(produto) : '';
  abrirRevisaoImportacaoXml();
}

/* Interpreta o texto do campo "Dar entrada em" da revisão do XML.
   Devolve o produto, null (vazio = cadastrar como novo) ou undefined (não achou). */
function resolverProdutoRevisaoXml(texto, produtos) {
  const t = String(texto || '').trim();
  if (!t) return null;
  const m = t.match(/#(\d+)\s*$/);
  if (m) return produtos.find(p => p.id === Number(m[1])) || undefined;
  const exatos = produtos.filter(p => [p.cod_interno, p.cod_original].some(c => c && String(c).trim().toLowerCase() === t.toLowerCase()));
  return exatos.length === 1 ? exatos[0] : undefined;
}

function atualizarEstoqueRevisaoXml(idx) {
  const campo = document.getElementById('imp-xml-vinc-' + idx);
  const alvo = document.getElementById('imp-xml-estoque-' + idx);
  if (!campo || !alvo) return;
  const produto = resolverProdutoRevisaoXml(campo.value, loadList('produtos'));
  alvo.textContent = produto ? `Estoque atual: ${Number(produto.estoque_atual) || 0}` : (String(campo.value).trim() ? '' : 'Será cadastrado como produto novo');
}

function abrirRevisaoImportacaoXml() {
  if (!importacaoXmlTemp) return;
  const { fornecedorDados, numeroNf, duplicatas, itens, compraIdExistente } = importacaoXmlTemp;
  const produtos = loadList('produtos');
  const tituloRevisao = compraIdExistente
    ? `Atualizar Compra #${compraIdExistente} com XML — NF ${escapeHtml(numeroNf || '(sem número)')}`
    : `Revisar Importação de XML — NF ${escapeHtml(numeroNf || '(sem número)')}`;
  const textoBotaoConfirmar = 'Confirmar Importação';

  const rotuloProduto = rotuloProdutoXml;
  const rasc = importacaoXmlTemp.rascunho || null;
  const rd = (lista, i, padrao) => (rasc && lista && lista[i] != null ? lista[i] : padrao);
  const opcoesProdutos = produtos.map(p => `<option value="${escapeHtml(rotuloProduto(p))}"></option>`).join('');

  const linhasItens = itens.map((it, idx) => {
    const produto = it.produto_id ? produtos.find(p => p.id === it.produto_id) : null;
    return `
      <tr>
        <td>${escapeHtml(it.cod_original || '-')}</td>
        <td>${escapeHtml(it.descricao)}<br><small>${escapeHtml(it.unidade_medida)} · custo ${formatarMoeda(it.valor_unitario)}</small></td>
        <td>
          <input type="text" id="imp-xml-vinc-${idx}" list="imp-xml-lista-produtos" value="${escapeHtml(rd(rasc && rasc.vinc, idx, produto ? rotuloProduto(produto) : ''))}" placeholder="Vazio = cadastrar como produto novo" style="width:calc(100% - 38px);min-width:200px" oninput="atualizarEstoqueRevisaoXml(${idx})">
          <button type="button" class="btn-secondary" style="padding:4px 8px" title="Buscar produto por código ou descrição" onclick="abrirSeletorProdutoXml(${idx})">🔍</button>
          <br><small id="imp-xml-estoque-${idx}"></small>
        </td>
        <td><input type="text" id="imp-xml-qtd-${idx}" value="${escapeHtml(rd(rasc && rasc.qtd, idx, String(it.quantidade).replace('.', ',')))}" style="width:70px"></td>
        <td><input type="text" id="imp-xml-margem-${idx}" value="${escapeHtml(rd(rasc && rasc.margem, idx, '30'))}" style="width:55px">%</td>
      </tr>
    `;
  }).join('');

  abrirModal(`
    <h2>${tituloRevisao}</h2>
    <div class="info-cliente-caixa">
      <div><strong>Fornecedor:</strong> ${escapeHtml(fornecedorDados.razao_social || '-')} &nbsp; <strong>CNPJ:</strong> ${escapeHtml(fornecedorDados.cnpj || '-')}</div>
      <div>${fornecedorDados.cnpj ? 'Se já existir fornecedor com este CNPJ, ele será reaproveitado; caso contrário, será cadastrado automaticamente.' : 'Fornecedor sem CNPJ identificado — será cadastrado mesmo assim.'}</div>
    </div>

    <h3 style="margin-top:16px">Itens da nota — escolha em qual produto dar entrada</h3>
    <div class="aviso">A coluna "Dar entrada em" já vem preenchida quando o sistema reconheceu o produto pelo código. Você pode trocá-la digitando o código ou o nome de outro produto já cadastrado (o código do fornecedor fica memorizado como similar para as próximas importações). Deixando em branco, o item é cadastrado como produto novo (usa a margem).</div>
    <datalist id="imp-xml-lista-produtos">${opcoesProdutos}</datalist>
    <table class="data-table">
      <thead><tr><th>Cód. na NF</th><th>Descrição na NF</th><th>Dar entrada em (produto cadastrado)</th><th>Qtd.</th><th>Margem (só novos)</th></tr></thead>
      <tbody>${linhasItens}</tbody>
    </table>

    <h3 style="margin-top:16px">Condição de Pagamento</h3>
    ${duplicatas.length ? `
      <div class="info-cliente-caixa">Encontradas ${duplicatas.length} duplicata(s) no XML da NF-e. Esses vencimentos e valores serão usados quando você clicar em "Dar Entrada" para lançar as parcelas em Contas a Pagar.</div>
      <table class="data-table">
        <thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr></thead>
        <tbody>
          ${duplicatas.map((d, idx) => `
            <tr>
              <td>${escapeHtml(d.numero || String(idx + 1))}</td>
              <td><input type="date" id="imp-xml-dup-venc-${idx}" value="${escapeHtml(rd(rasc && rasc.dupVenc, idx, d.vencimento))}"></td>
              <td><input type="text" id="imp-xml-dup-valor-${idx}" value="${escapeHtml(rd(rasc && rasc.dupValor, idx, d.valor.toFixed(2).replace('.', ',')))}" style="width:100px"></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : `
      <div class="campo">
        <label>O XML não trouxe duplicatas (cobr/dup). Informe os prazos — dias separados por / (ex: 30/45/60, máximo 10x). Deixe em branco para à vista. Isso só é usado quando você clicar em "Dar Entrada".</label>
        <input type="text" id="imp-xml-prazos-manual" placeholder="30/45/60" value="${escapeHtml((rasc && rasc.prazos) || '')}">
      </div>
    `}

    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarImportacaoXmlNfe()">${textoBotaoConfirmar}</button>
      <button type="button" class="btn-secondary" onclick="importacaoXmlTemp = null; fecharModal();">Cancelar</button>
    </div>
  `);
  itens.forEach((_, idx) => atualizarEstoqueRevisaoXml(idx));
}

function confirmarImportacaoXmlNfe() {
  if (!importacaoXmlTemp) return;
  const { fornecedorDados, numeroNf, chave, dataEmissao, duplicatas, itens, compraIdExistente } = importacaoXmlTemp;

  // Lê, para cada item, o produto escolhido na tela (vazio = cadastrar como produto novo).
  const produtos = loadList('produtos');
  const escolhas = [];
  for (let idx = 0; idx < itens.length; idx++) {
    const campo = document.getElementById('imp-xml-vinc-' + idx);
    const resolvido = resolverProdutoRevisaoXml(campo ? campo.value : '', produtos);
    if (resolvido === undefined) {
      alert(`Item ${idx + 1} (${itens[idx].descricao}): produto não encontrado em "Dar entrada em". Escolha um da lista ou apague o campo para cadastrar como produto novo.`);
      return;
    }
    escolhas.push(resolvido);
  }

  const fornecedores = loadList('fornecedores');
  let fornecedor = fornecedorDados.cnpj
    ? fornecedores.find(f => f.cnpj === fornecedorDados.cnpj)
    : null;
  if (!fornecedor) {
    fornecedor = { ...fornecedorDados, id: nextId(fornecedores) };
    fornecedores.push(fornecedor);
    saveList('fornecedores', fornecedores);
  }

  let totalCadastrados = 0;
  itens.forEach((it, idx) => {
    const quantidade = numeroBr(document.getElementById('imp-xml-qtd-' + idx).value) || it.quantidade;
    const escolhido = escolhas[idx];
    if (escolhido) {
      // Produto já cadastrado: se o usuário trocou o produto (ou o sistema não tinha reconhecido),
      // memoriza o código do fornecedor como similar para reconhecer sozinho nas próximas notas.
      if (escolhido.id !== it.produto_id && it.cod_original) {
        const jaConhecido = [escolhido.cod_original, escolhido.cod_interno, ...codigosSimilares(escolhido)].includes(it.cod_original);
        if (!jaConhecido) {
          escolhido.similares = Array.isArray(escolhido.similares) ? escolhido.similares : [];
          escolhido.similares.push(it.cod_original);
        }
      }
      it.produto_id = escolhido.id;
    } else {
      const margem = numeroBr(document.getElementById('imp-xml-margem-' + idx).value) || 0;
      const custoReal = it.valor_unitario;
      const novoProduto = {
        id: nextId(produtos),
        cod_interno: it.cod_original || '',
        cod_original: it.cod_original || '',
        similares: [],
        gtin_venda: '', gtin_compra: '', fabricante: '', marca: '',
        descricao: it.descricao,
        aplicacao: '',
        unidade_medida: it.unidade_medida || 'UN',
        peso: 0,
        grupo: '', localizacao: '',
        status: 'Ativo',
        tipo_produto: 'Revenda',
        observacao: 'Cadastrado automaticamente a partir de importação de XML de NF-e.',
        informacao_adicional: '',
        valor_custo: custoReal,
        margem_lucro: margem,
        valor_venda: custoReal * (1 + margem / 100),
        estoque_atual: 0,
      };
      produtos.push(novoProduto);
      it.produto_id = novoProduto.id;
      totalCadastrados++;
    }
    it.quantidade = quantidade;
    it.valor_total = quantidade * it.valor_unitario;
  });

  saveList('produtos', produtos);

  const itensCompra = itens.map(it => ({
    produto_id: it.produto_id,
    descricao: it.descricao,
    quantidade: it.quantidade,
    valor_unitario: it.valor_unitario,
    valor_total: it.valor_total,
  }));
  const valorTotalCompra = itensCompra.reduce((soma, it) => soma + it.valor_total, 0);

  // Condicao de pagamento: usa as duplicatas do XML (editadas na tela) quando existirem;
  // senao, cai no campo manual de prazos (formato 30/45/60), e na falta dos dois vira a vista.
  let duplicatasFinais = [];
  let prazosPagamento = [0];
  if (duplicatas.length) {
    duplicatasFinais = duplicatas.map((d, idx) => ({
      numero: d.numero,
      vencimento: document.getElementById('imp-xml-dup-venc-' + idx).value || d.vencimento,
      valor: numeroBr(document.getElementById('imp-xml-dup-valor-' + idx).value) || d.valor,
    }));
  } else {
    const campoManual = document.getElementById('imp-xml-prazos-manual');
    prazosPagamento = parsePrazosPagamento(campoManual ? campoManual.value : '');
  }

  const compras = loadList('compras');

  if (compraIdExistente) {
    // Importar XML num pedido ja existente: atualiza o mesmo registro em vez de criar outro.
    // Se o pedido ja tinha dado entrada antes, desfaz o estoque/parcelas antigos primeiro
    // (os itens podem ter mudado) — a entrada precisa ser dada de novo, pelo botão "Dar Entrada".
    const idx = compras.findIndex(c => c.id === compraIdExistente);
    if (idx === -1) {
      alert('Compra não encontrada (pode ter sido excluída). A importação foi cancelada.');
      importacaoXmlTemp = null;
      fecharModal();
      return;
    }
    const compraAntiga = compras[idx];
    const jaTinhaEntrada = !!compraAntiga.entrada_dada;
    if (jaTinhaEntrada) {
      reverterEntradaEstoqueCompra(compraAntiga.itens || []);
    }
    removerContasPagarDaCompra(compraIdExistente);

    const compraAtualizada = {
      ...compraAntiga,
      fornecedor_id: fornecedor.id,
      tipo_pedido: 'Nota Fiscal',
      numero_nf: numeroNf || compraAntiga.numero_nf,
      chave_nfe: chave || compraAntiga.chave_nfe,
      data_compra: dataEmissao || compraAntiga.data_compra,
      prazos_pagamento: prazosPagamento,
      duplicatas_nfe: duplicatasFinais,
      valor_total: valorTotalCompra,
      itens: itensCompra,
      entrada_dada: false,
    };
    compras[idx] = compraAtualizada;
    saveList('compras', compras);

    importacaoXmlTemp = null;
    fecharModal();
    renderCompras();
    alert(`Compra #${compraIdExistente} atualizada com o XML da NF-e ${numeroNf || '(sem número)'}.` +
      (totalCadastrados ? ` ${totalCadastrados} produto(s) novo(s) cadastrado(s) automaticamente.` : '') +
      ' Clique em "Dar Entrada" para lançar no estoque e em Contas a Pagar.');
    return;
  }

  const compraImportada = {
    id: nextId(compras),
    fornecedor_id: fornecedor.id,
    tipo_pedido: 'Nota Fiscal',
    numero_nf: numeroNf,
    chave_nfe: chave,
    data_compra: dataEmissao || new Date().toISOString().slice(0, 10),
    comprador: '',
    transportadora_id: null,
    aos_cuidados: '',
    observacoes: 'Importado automaticamente do XML da NF-e.',
    prazos_pagamento: prazosPagamento,
    duplicatas_nfe: duplicatasFinais,
    valor_total: valorTotalCompra,
    itens: itensCompra,
    entrada_dada: false,
  };
  compras.push(compraImportada);
  saveList('compras', compras);

  importacaoXmlTemp = null;
  fecharModal();
  renderCompras();
  alert(`NF-e ${numeroNf || '(sem número)'} importada com ${itens.length} item(ns).` +
    (totalCadastrados ? ` ${totalCadastrados} produto(s) novo(s) cadastrado(s) automaticamente.` : '') +
    ' Clique em "Dar Entrada" na lista de Compras para lançar no estoque e em Contas a Pagar.');
}

/* ---------- dashboard ---------- */

function renderDashboard() {
  const config = obterConfiguracoes();
  const logoDashboardHtml = config.logo_base64
    ? `<img src="${config.logo_base64}" alt="Logo da empresa" class="dashboard-logo-img">`
    : `<div class="dashboard-logo-vazio">
         <span class="dashboard-logo-icone">🏢</span>
         <span>Nenhum logo cadastrado.<br>Cadastre em Configurações → Logo da Empresa.</span>
       </div>`;

  const container = document.getElementById('sec-dashboard');
  container.innerHTML = `
    <div class="dashboard-logo-painel dashboard-logo-painel-cheio">${logoDashboardHtml}</div>
  `;
}

/* ---------- inicializacao ---------- */

window.addEventListener('DOMContentLoaded', async () => {
  // Sem código de ativação salvo neste navegador: pede antes de mostrar qualquer outra tela.
  if (!licencaAtual) {
    document.getElementById('tela-carregando').style.display = 'none';
    mostrarTelaAtivacao();
    return;
  }

  // Já tem um código salvo: confirma que ele ainda está liberado antes de seguir.
  // "sem_conexao" não bloqueia (segue com os dados locais) — só "bloqueada" bloqueia de fato.
  const situacaoLicenca = await consultarSituacaoLicenca(licencaAtual);
  if (situacaoLicenca === 'bloqueada') {
    document.getElementById('tela-carregando').style.display = 'none';
    mostrarTelaAtivacao('Este código de ativação está bloqueado ou não existe mais. Fale com o fornecedor do sistema.');
    return;
  }

  await sincronizarComNuvem();
  document.getElementById('tela-carregando').style.display = 'none';

  inicializarUsuariosPadrao();
  aplicarMarcaDaguaNaTela();
  if (usuarioLogado()) {
    ocultarTelaLogin();
    iniciarAppLogado();
  } else {
    mostrarTelaLogin();
  }
});
</script>
