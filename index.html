async function consultarNfeVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda || !venda.nfe_ref) return;
  mostrarStatusNfe('Consultando...', 'info');
  try {
    const { status, dados } = await chamarFocusNfe('GET', `/v2/nfe/${encodeURIComponent(venda.nfe_ref)}`);
    if (status >= 400 && !dados.status) {
      mostrarStatusNfe(mensagemErroFocus(dados, status), 'erro');
      return;
    }
    const resultado = processarRetornoNfe(vendaId, dados);
    renderSecaoAtualAposNfe();
    if (resultado === 'erro_autorizacao' || resultado === 'denegado') {
      fecharModal();
      abrirEmitirNfeVenda(vendaId);
      return;
    }
    abrirGerenciarNfeVenda(vendaId, 'Situação atualizada: ' + textoStatusApiNfe(resultado) + '.');
  } catch (erro) {
    mostrarStatusNfe(erro.message, 'erro');
  }
}

function abrirCancelarNfe(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  if (!podeEmitirNf()) {
    alert('Você não tem permissão para emitir/cancelar Nota Fiscal.');
    return;
  }
  abrirModal(`
    <h2>Cancelar NF-e nº ${escapeHtml(venda.numero_nf || '')} — Venda #${venda.id}</h2>
    <div class="aviso">O cancelamento é enviado para a SEFAZ e não pode ser desfeito. Na maioria dos estados o prazo é de até 24 horas após a autorização.</div>
    <div class="campo">
      <label>Justificativa (mínimo 15 caracteres)</label>
      <textarea id="nfe-cancelar-justificativa" rows="3" maxlength="255" placeholder="Ex: Erro na digitação da quantidade do produto"></textarea>
    </div>
    ${venda.recebimento_gerado ? `
      <div class="campo campo-checkbox">
        <label><input type="checkbox" id="nfe-cancelar-estornar" checked> Devolver os itens ao estoque e remover as parcelas de Contas a Receber</label>
      </div>` : ''}
    <div id="nfe-emitir-status" class="nfe-status" style="display:none"></div>
    <div class="modal-botoes">
      <button type="button" class="btn-perigo" id="nfe-cancelar-botao" onclick="confirmarCancelarNfe(${venda.id})">Confirmar cancelamento</button>
      <button type="button" class="btn-secondary" onclick="abrirGerenciarNfeVenda(${venda.id})">Voltar</button>
    </div>
  `);
}

async function confirmarCancelarNfe(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  if (!podeEmitirNf()) {
    alert('Você não tem permissão para emitir/cancelar Nota Fiscal.');
    return;
  }
  const justificativa = document.getElementById('nfe-cancelar-justificativa').value.trim();
  if (justificativa.length < 15) {
    alert('A justificativa precisa ter pelo menos 15 caracteres.');
    return;
  }
  const campoEstornar = document.getElementById('nfe-cancelar-estornar');
  const estornar = !!(campoEstornar && campoEstornar.checked);
  const botao = document.getElementById('nfe-cancelar-botao');
  if (botao) { botao.disabled = true; botao.textContent = 'Cancelando...'; }
  mostrarStatusNfe('Enviando o cancelamento para a SEFAZ...', 'info');
  try {
    const { status, dados } = await chamarFocusNfe('DELETE', `/v2/nfe/${encodeURIComponent(venda.nfe_ref)}`, { justificativa });
    if (dados.status !== 'cancelado') {
      mostrarStatusNfe('Cancelamento não realizado:\n' + mensagemErroFocus(dados, status), 'erro');
      if (botao) { botao.disabled = false; botao.textContent = 'Confirmar cancelamento'; }
      return;
    }
    processarRetornoNfe(vendaId, dados);
    atualizarVendaNfe(vendaId, { nfe_justificativa_cancelamento: justificativa });
    if (estornar && venda.recebimento_gerado) {
      reverterEstoqueVenda(venda.itens || []);
      removerContasReceberDaVenda(vendaId);
      atualizarVendaNfe(vendaId, { recebimento_gerado: false });
    }
    renderSecaoAtualAposNfe();
    abrirGerenciarNfeVenda(vendaId, 'NF-e cancelada na SEFAZ.' + (estornar ? ' Estoque devolvido e parcelas removidas.' : ''));
  } catch (erro) {
    mostrarStatusNfe(erro.message, 'erro');
    if (botao) { botao.disabled = false; botao.textContent = 'Confirmar cancelamento'; }
  }
}

function abrirCartaCorrecaoNfe(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);

async function confirmarCartaCorrecaoNfe(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  const correcao = document.getElementById('nfe-cce-texto').value.trim();
  if (correcao.length < 15) {
    alert('A correção precisa ter pelo menos 15 caracteres.');
    return;
  }
  const botao = document.getElementById('nfe-cce-botao');
  if (botao) { botao.disabled = true; botao.textContent = 'Enviando...'; }
  mostrarStatusNfe('Enviando a carta de correção...', 'info');
  try {
    const { status, dados } = await chamarFocusNfe('POST', `/v2/nfe/${encodeURIComponent(venda.nfe_ref)}/carta_correcao`, { correcao });
    if (dados.status !== 'autorizado') {
      mostrarStatusNfe('Carta de correção não registrada:\n' + mensagemErroFocus(dados, status), 'erro');
      if (botao) { botao.disabled = false; botao.textContent = 'Enviar Carta de Correção'; }
      return;

    const cartas = Array.isArray(venda.nfe_cartas_correcao) ? venda.nfe_cartas_correcao.slice() : [];
    cartas.push({ data: dataHojeLocalIso(), correcao, caminho_pdf: dados.caminho_pdf_carta_correcao || '', caminho_xml: dados.caminho_xml_carta_correcao || '' });
    atualizarVendaNfe(vendaId, { nfe_cartas_correcao: cartas });
    abrirGerenciarNfeVenda(vendaId, 'Carta de correção registrada na SEFAZ.');
  } catch (erro) {
    mostrarStatusNfe(erro.message, 'erro');
    if (botao) { botao.disabled = false; botao.textContent = 'Enviar Carta de Correção'; }
  }
}

/* Envia o certificado A1 direto para a Focus NFe (cadastro da empresa). O arquivo e a senha só
   passam pela memória desta tela: nada é gravado no PAPTECH, no navegador nem na nuvem. */
async function enviarCertificadoFocus() {
  const status = document.getElementById('nfe-cert-status');
  const botao = document.getElementById('nfe-cert-botao');
  const mostrar = (texto, ok) => { if (status) status.innerHTML = `<span style="color:${ok ? '#2e7d32' : '#c62828'}">${escapeHtml(texto).replace(/\n/g, '<br>')}</span>`; };
  const arquivo = document.getElementById('nfe-cert-arquivo').files[0];
  const senha = document.getElementById('nfe-cert-senha').value;
  const cnpj = somenteDigitos(dadosEmpresaAtuais().cnpj);
  if (cnpj.length !== 14) { mostrar('Preencha o CNPJ em Configurações → Dados da Empresa antes de enviar o certificado.'); return; }
  if (!arquivo) { mostrar('Escolha o arquivo do certificado (.pfx ou .p12).'); return; }
  if (!senha) { mostrar('Informe a senha do certificado.'); return; }
  salvarConfiguracaoNfe(true);
  const cfg = configNfe();
  if (cfg.ambiente === 'producao' && !confirm('Enviar o certificado para a Focus NFe em PRODUÇÃO?')) return;
  botao.disabled = true;
  mostrar('Enviando...', true);
  try {
    const base64 = await new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => resolve(String(leitor.result).split(',')[1] || '');
      leitor.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
      leitor.readAsDataURL(arquivo);
    });
    // Descobre o identificador da empresa na Focus (por CNPJ); se não achar, tenta o próprio CNPJ.
    let idEmpresa = cnpj;
    try {
      const lista = await chamarFocusNfe('GET', `/v2/empresas?cnpj=${cnpj}`);
      const item = Array.isArray(lista.dados) ? lista.dados[0] : null;
      if (item && item.id) idEmpresa = item.id;
    } catch (e) { /* segue com o CNPJ */ }
    const { status: http, dados } = await chamarFocusNfe('PUT', `/v2/empresas/${encodeURIComponent(idEmpresa)}`, {
      arquivo_certificado_base64: base64,
      senha_certificado: senha,
    });
    if (http >= 200 && http < 300) {
      mostrar('Certificado enviado com sucesso para a Focus NFe (' + (cfg.ambiente === 'producao' ? 'produção' : 'homologação') + ').', true);
    } else {
      mostrar('A Focus não aceitou o certificado (HTTP ' + http + '):\n' + mensagemErroFocus(dados, http) +
        (http === 401 || http === 403 ? '\n\nO cadastro de empresas costuma exigir o "token principal" da conta: configure FOCUS_TOKEN_PRINCIPAL_* no intermediário.' : ''), false);
    }
  } catch (erro) {
    mostrar(erro.message, false);
  } finally {
    document.getElementById('nfe-cert-senha').value = '';
    document.getElementById('nfe-cert-arquivo').value = '';
    botao.disabled = false;
  }
}

function salvarConfiguracaoNfe(silencioso) {
  const nova = lerConfiguracaoNfeDaTela();
  const anterior = configNfe();
  if (nova.ambiente === 'producao' && anterior.ambiente !== 'producao' && !silencioso &&
      !confirm('Mudar para PRODUÇÃO? A partir daqui as notas transmitidas terão validade fiscal. Só faça isso depois de testar em Homologação.')) {
    return false;
  }
  localStorage.setItem(CHAVE_LOCAL_NFE_INTERMEDIARIO, document.getElementById('nfe-cfg-chave').value.trim());
  salvarConfiguracoes({ nfe: nova });
  if (!silencioso) alert('Configuração da NF-e salva.');
  return true;
}

async function testarConexaoNfe() {
  if (!salvarConfiguracaoNfe(true)) return;
  const caixa = document.getElementById('nfe-cfg-teste');
  const mostrar = (texto, tipo) => {
    caixa.style.display = 'block';
    caixa.className = 'nfe-status nfe-status-' + tipo;
    caixa.textContent = texto;
  };
  mostrar('Testando...', 'info');
  try {
    const { status, dados } = await chamarFocusNfe('GET', '/v2/nfe/paptech-teste-conexao');
    if (status === 404) {
      mostrar(`Conexão OK com a Focus NFe (${configNfe().ambiente === 'producao' ? 'produção' : 'homologação'}). Intermediário e token funcionando.`, 'ok');
    } else if (dados && dados.erro === 'chave_intermediario_invalida') {
      mostrar('O intermediário respondeu, mas recusou a chave. Confira se a chave digitada é igual a PAPTECH_CHAVE_NFE.', 'erro');
    } else if (status === 401 || status === 403) {
      mostrar('O intermediário funciona, mas a Focus NFe recusou o token. Confira o token de ' + (configNfe().ambiente === 'producao' ? 'produção' : 'homologação') + ' no intermediário.', 'erro');
    } else {
      mostrar(`Resposta inesperada (HTTP ${status}): ${mensagemErroFocus(dados, status)}`, 'erro');
    }
  } catch (erro) {
    mostrar(erro.message, 'erro');
  }
}

/* "Registrar nota emitida em outro sistema": grava os dados da Nota Fiscal (status, número,
   série, data, chave de acesso) e, ao marcar como Emitida, dá saída no estoque e lança as
   parcelas em Contas a Receber — mesmo efeito de "Gerar Recebimento". */
function abrirRegistroManualNfeVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  if (!podeEmitirNf()) {
    alert('Você não tem permissão para emitir/cancelar Nota Fiscal.');
    return;
  }

  abrirModal(`
    <h2>Emitir Nota Fiscal — Venda #${venda.id}</h2>
    <div class="aviso">Use esta opção só para notas emitidas fora do PAPTECH (no emissor do contador, por exemplo). Aqui o sistema só guarda o registro. Marcar como "Emitida" dá saída no estoque e lança as parcelas em Contas a Receber.</div>
    <div class="campo">
      <label>Status da Nota Fiscal</label>
      <select id="nfe-venda-status">
        <option value="Pendente" ${venda.status_nf !== 'Emitida' && venda.status_nf !== 'Cancelada' ? 'selected' : ''}>Pendente de emissão</option>
        <option value="Emitida" ${venda.status_nf === 'Emitida' ? 'selected' : ''}>Emitida</option>
        <option value="Cancelada" ${venda.status_nf === 'Cancelada' ? 'selected' : ''}>Cancelada</option>
      </select>
    </div>
    <div class="campo">
      <label>Número da NF-e</label>
      <input type="text" id="nfe-venda-numero" value="${escapeHtml(venda.numero_nf || '')}" placeholder="Ex: 000123">
    </div>
    <div class="campo">
      <label>Série</label>
      <input type="text" id="nfe-venda-serie" value="${escapeHtml(venda.serie_nf || '1')}" placeholder="Ex: 1">
    </div>
    <div class="campo">
      <label>Data de Emissão</label>
      <input type="date" id="nfe-venda-data-emissao" value="${escapeHtml(venda.data_emissao_nf || new Date().toISOString().slice(0, 10))}">
    </div>
    <div class="campo">
      <label>Chave de Acesso (44 dígitos)</label>
      <input type="text" id="nfe-venda-chave" value="${escapeHtml(venda.chave_nfe || '')}" placeholder="Somente números, 44 dígitos" maxlength="44">
    </div>
    ${!venda.recebimento_gerado ? `
      <div class="campo">
        <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x). Deixe em branco para à vista.</label>
        <input type="text" id="nfe-venda-prazos" value="${escapeHtml(construirPrazosDisplay(venda))}" placeholder="30/45/60">
      </div>
    ` : '<div class="aviso">Esta venda já tem recebimento gerado. Alterar a Nota Fiscal agora não vai refazer o estoque/Contas a Receber — use "Gerar Recebimento" para isso.</div>'}
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarEmitirNfeVenda(${venda.id})">Salvar</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function confirmarEmitirNfeVenda(vendaId) {
  if (!podeEmitirNf()) {
    alert('Você não tem permissão para emitir/cancelar Nota Fiscal.');
    return;
  }
  const vendas = loadList('vendas');
  const idx = vendas.findIndex(v => v.id === vendaId);
  if (idx === -1) return;
  const venda = vendas[idx];

  const status = document.getElementById('nfe-venda-status').value;
  const numeroNf = document.getElementById('nfe-venda-numero').value.trim();
  const serieNf = document.getElementById('nfe-venda-serie').value.trim();
  const dataEmissaoNf = document.getElementById('nfe-venda-data-emissao').value;
  const chaveNfe = document.getElementById('nfe-venda-chave').value.replace(/\D/g, '');
  if (chaveNfe && chaveNfe.length !== 44) {
    alert('A Chave de Acesso da NF-e deve ter 44 dígitos (somente números). Deixe em branco se ainda não tiver.');
    return;
  }

  const vendaAtualizada = {
    ...venda,
    status_nf: status,
    numero_nf: numeroNf,
    serie_nf: serieNf,
    data_emissao_nf: dataEmissaoNf,
    chave_nfe: chaveNfe,
  };

  // Marcar como Emitida dá saída no estoque e lança Contas a Receber, se ainda não gerado
  // (o mesmo efeito de "Gerar Recebimento", feito junto com o registro da nota).
  if (status === 'Emitida' && !venda.recebimento_gerado) {
    const campoPrazos = document.getElementById('nfe-venda-prazos');
    vendaAtualizada.prazos_pagamento = parsePrazosPagamento(campoPrazos ? campoPrazos.value : '');
    vendaAtualizada.recebimento_gerado = true;
    vendas[idx] = vendaAtualizada;
    saveList('vendas', vendas);
    aplicarBaixaEstoqueVenda(vendaAtualizada.itens || []);
    gerarParcelasReceber(vendaAtualizada);
    fecharModal();
    renderVendas();
    alert('Nota Fiscal emitida: o estoque foi atualizado e as parcelas foram lançadas em Contas a Receber.');
    return;
  }

  vendas[idx] = vendaAtualizada;
  saveList('vendas', vendas);
  fecharModal();
  renderVendas();
}

/* "Gerar Recebimento": dá saída no estoque e lança as parcelas em Contas a Receber
   independentemente da Nota Fiscal — para quando a venda é finalizada sem (ainda) emitir a NF-e. */
function abrirGerarRecebimentoVenda(vendaId) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;

  if (venda.recebimento_gerado) {
    if (!confirm('Esta venda já teve recebimento gerado. Deseja refazer? O estoque e as parcelas lançados anteriormente serão substituídos pelos dados atuais da venda.')) {
      return;
    }
  }

  abrirModal(`
    <h2>Gerar Recebimento — Venda #${venda.id}</h2>
    <div class="info-cliente-caixa">
      <div><strong>Valor Total da Venda:</strong> ${formatarMoeda(venda.valor_total)}</div>
      <div>Isso vai dar saída nos itens do estoque e lançar as parcelas em Contas a Receber.</div>
    </div>
    <div class="campo">
      <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x). Deixe em branco para à vista.</label>
      <input type="text" id="recebimento-venda-prazos" value="${escapeHtml(construirPrazosDisplay(venda))}" placeholder="30/45/60">
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarGerarRecebimentoVenda(${venda.id})">Confirmar Recebimento</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function confirmarGerarRecebimentoVenda(vendaId) {
  const vendas = loadList('vendas');
  const idx = vendas.findIndex(v => v.id === vendaId);
  if (idx === -1) return;
  const venda = vendas[idx];

  if (venda.recebimento_gerado) {
    reverterEstoqueVenda(venda.itens || []);
    removerContasReceberDaVenda(vendaId);
  }

  const campoPrazos = document.getElementById('recebimento-venda-prazos');
  const vendaAtualizada = {
    ...venda,
    prazos_pagamento: parsePrazosPagamento(campoPrazos ? campoPrazos.value : ''),
    recebimento_gerado: true,
  };
  vendas[idx] = vendaAtualizada;
  saveList('vendas', vendas);
  aplicarBaixaEstoqueVenda(vendaAtualizada.itens || []);
  gerarParcelasReceber(vendaAtualizada);

  fecharModal();
  renderVendas();
  alert('Recebimento confirmado: o estoque foi atualizado e as parcelas foram lançadas em Contas a Receber.');
}

/* "Estornar Recebimento": desfaz o recebimento gerado (remove as parcelas de Contas a Receber
   e devolve os itens ao estoque), sem relançar nada — a venda volta a precisar de um novo
   "Emitir NFe" ou "Gerar Recebimento". */
function estornarRecebimentoVenda(vendaId) {
  const vendas = loadList('vendas');
  const idx = vendas.findIndex(v => v.id === vendaId);
  if (idx === -1) return;
  const venda = vendas[idx];
  if (!venda.recebimento_gerado) return;

  if (!confirm(`Estornar o recebimento da Venda #${venda.id}? As parcelas serão removidas de Contas a Receber e os itens voltam ao estoque.`)) {
    return;
  }

  reverterEstoqueVenda(venda.itens || []);
  removerContasReceberDaVenda(vendaId);

  vendas[idx] = { ...venda, recebimento_gerado: false };
  saveList('vendas', vendas);

  renderVendas();
  alert('Recebimento estornado: as parcelas foram removidas de Contas a Receber e o estoque foi devolvido.');
}

        <input type="text" id="venda-numero" value="${escapeHtml(registro ? (registro.numero || '') : '')}">
      </div>
    </div>

    <div id="aba-venda-transporte" class="tab-content" style="display:none">
      <div class="campo">
        <label>Transportadora</label>
        <select id="venda-transportadora">
          <option value="">Nenhuma / Retirada pelo cliente</option>
          ${transportadoras.map(t => `<option value="${t.id}" ${registro && Number(registro.transportadora_id) === t.id ? 'selected' : ''}>${escapeHtml(t.razao_social)}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label>Frete por Conta</label>
        <select id="venda-frete-por-conta">
          <option value="Destinatário" ${!registro || registro.frete_por_conta === 'Destinatário' ? 'selected' : ''}>Destinatário (FOB)</option>
          <option value="Remetente" ${registro && registro.frete_por_conta === 'Remetente' ? 'selected' : ''}>Remetente (CIF)</option>
          <option value="Sem Frete" ${registro && registro.frete_por_conta === 'Sem Frete' ? 'selected' : ''}>Sem Frete</option>
        </select>
      </div>
      <div class="campo">
        <label>Valor do Frete (R$)</label>
        <input type="text" id="venda-valor-frete" value="${registro ? (Number(registro.valor_frete) || 0).toFixed(2).replace('.', ',') : '0,00'}">
      </div>
      <div class="campo">
        <label>Espécie do Volume</label>
        <input type="text" id="venda-especie" value="${escapeHtml(registro ? (registro.especie || 'Volumes') : 'Volumes')}">
      </div>
      <div class="campo">
        <label>Peso Total (kg) — calculado pelos itens; pode editar</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" id="venda-peso-total" inputmode="decimal" value="${registro ? (Number(registro.peso_total) || 0).toFixed(3).replace('.', ',') : '0,000'}" oninput="pesoManualVenda = true">
          <button type="button" class="btn-secondary" onclick="pesoManualVenda = false; atualizarPesoTotalVenda()" title="Voltar a calcular pelo peso dos produtos">Recalcular</button>
        </div>
      </div>
      <div class="campo">
        <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x)</label>
        <input type="text" id="venda-prazos-pagamento" value="${escapeHtml(construirPrazosDisplay(registro))}" placeholder="30/45/60">
      </div>
    </div>

    <div id="aba-venda-itens" class="tab-content" style="display:none">
      <fieldset class="item-fieldset">
        <legend>Adicionar item</legend>
        <div class="campo autocomplete-wrap">
          <label>Buscar Produto (código interno, código original ou descrição)</label>
          <input type="text" id="venda-busca-produto" placeholder="Digite para buscar..." oninput="filtrarProdutosVenda()" autocomplete="off">
          <div id="venda-produto-resultados" class="autocomplete-lista" style="display:none"></div>
        </div>
        <div id="venda-produto-selecionado" class="produto-selecionado-info" style="display:none"></div>
        <div class="item-linha">
          <input type="text" id="venda-item-quantidade" placeholder="Qtd." value="1">
          <input type="text" id="venda-item-valor-unit" placeholder="Vlr. Unit." value="0,00">
          <input type="text" id="venda-item-pedido" placeholder="Nº do pedido" maxlength="15" title="Número do pedido de compra do cliente (xPed na NF-e)">
          <input type="text" id="venda-item-pedido-item" placeholder="Item nº" maxlength="6" inputmode="numeric" title="Número do item no pedido do cliente (nItemPed, até 6 dígitos)">
          <button type="button" class="btn-secondary" onclick="adicionarItemVenda()">Adicionar</button>
        </div>
      </fieldset>
      <table class="data-table">
        <thead><tr><th>Descrição</th><th>Nº pedido</th><th>Qtd.</th><th>Vlr. Unit.</th><th>Vlr. Total</th><th></th></tr></thead>
        <tbody id="itens-venda-tbody"><tr><td colspan="6" class="vazio">Nenhum item adicionado.</td></tr></tbody>
      </table>
    </div>

    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="salvarVendaManual(${id || 'null'})">Salvar Venda</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);

  atualizarInfoClienteVenda();
  atualizarTabelaItensVendaTemp();
}

function atualizarInfoClienteVenda() {
  const select = document.getElementById('venda-cliente');
  const infoEl = document.getElementById('venda-info-cliente');
  if (!select || !infoEl) return;

  if (!select.value) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const cliente = loadList('clientes').find(c => c.id === Number(select.value));
  if (!cliente) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const vendasCliente = loadList('vendas')
    .filter(v => v.cliente_id === cliente.id)
    .sort((a, b) => (a.data_venda || '').localeCompare(b.data_venda || ''));
  const ultimaCompra = vendasCliente.length
    ? `${formatarDataBr(vendasCliente[vendasCliente.length - 1].data_venda)} — ${formatarMoeda(vendasCliente[vendasCliente.length - 1].valor_total)}`
    : 'Nenhuma compra anterior';

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Endereço:</strong> ${escapeHtml(cliente.endereco || '-')}${cliente.numero ? ', ' + escapeHtml(cliente.numero) : ''}${cliente.bairro ? ' - ' + escapeHtml(cliente.bairro) : ''}</div>
    <div><strong>Cidade/UF:</strong> ${escapeHtml(cliente.cidade || '-')}${cliente.uf ? '/' + escapeHtml(cliente.uf) : ''} &nbsp; <strong>CEP:</strong> ${escapeHtml(cliente.cep || '-')}</div>
    <div><strong>Telefone:</strong> ${escapeHtml(cliente.telefone || '-')} &nbsp; <strong>I.E.:</strong> ${escapeHtml(cliente.inscricao_estadual || '-')}</div>
    <div><strong>Última Compra:</strong> ${ultimaCompra}</div>
  `;
}

function filtrarProdutosVenda() {
  const campoBusca = document.getElementById('venda-busca-produto');
  const resultadosEl = document.getElementById('venda-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoVenda && campoBusca.value !== produtoSelecionadoVenda.descricao) {
    // o usuario alterou o texto depois de ja ter selecionado um produto
    produtoSelecionadoVenda = null;
    document.getElementById('venda-produto-selecionado').style.display = 'none';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoVenda(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>
        Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Cód. Original: ${escapeHtml(p.cod_original || '-')}
        ${textoSimilares(p) ? ` | Similares: ${escapeHtml(textoSimilares(p))}` : ''}
        | Venda: ${formatarMoeda(p.valor_venda)}
      </small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoVenda(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  produtoSelecionadoVenda = produto;

  document.getElementById('venda-busca-produto').value = produto.descricao;
  document.getElementById('venda-produto-resultados').innerHTML = '';
  document.getElementById('venda-produto-resultados').style.display = 'none';
  document.getElementById('venda-item-valor-unit').value = (Number(produto.valor_venda) || 0).toFixed(2).replace('.', ',');

  const infoEl = document.getElementById('venda-produto-selecionado');
  infoEl.style.display = 'flex';
  infoEl.innerHTML = `
    <span>Selecionado: ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</span>
    <button type="button" onclick="limparProdutoSelecionadoVenda()" title="Remover seleção">&times;</button>
  `;
}

function limparProdutoSelecionadoVenda() {
  produtoSelecionadoVenda = null;
  document.getElementById('venda-busca-produto').value = '';
  document.getElementById('venda-produto-selecionado').style.display = 'none';
  document.getElementById('venda-produto-selecionado').innerHTML = '';
}

function adicionarItemVenda() {
  if (!produtoSelecionadoVenda) {
    alert('Busque e selecione um produto antes de adicionar.');
    return;
  }
  const quantidade = numeroBr(document.getElementById('venda-item-quantidade').value);
  const valorUnit = numeroBr(document.getElementById('venda-item-valor-unit').value);
  if (!quantidade || quantidade <= 0) {
    alert('Informe uma quantidade válida.');
    return;
  }

  itensVendaTemp.push({
    produto_id: produtoSelecionadoVenda.id,
    descricao: produtoSelecionadoVenda.descricao,
    quantidade: quantidade,
    valor_unitario: valorUnit,
    valor_total: quantidade * valorUnit,
    numero_pedido: (document.getElementById('venda-item-pedido').value || '').trim(),
    item_pedido: (document.getElementById('venda-item-pedido-item').value || '').replace(/\D/g, '').slice(0, 6),
  });
  atualizarTabelaItensVendaTemp();
  limparProdutoSelecionadoVenda();
  document.getElementById('venda-item-quantidade').value = '1';
  document.getElementById('venda-item-valor-unit').value = '0,00';
  // mantém o nº do pedido preenchido: normalmente vários itens vêm do mesmo pedido
  const itemPed = document.getElementById('venda-item-pedido-item');
  if (itemPed) itemPed.value = '';
}

function removerItemVenda(indice) {
  const it = itensVendaTemp[indice];
  if (it && !confirm(`Excluir o item "${it.descricao}" do pedido?`)) return;
  itensVendaTemp.splice(indice, 1);
  itemVendaEditando = -1;
  atualizarTabelaItensVendaTemp();
}

function editarItemVenda(indice) {
  itemVendaEditando = indice;
  atualizarTabelaItensVendaTemp();
}

function cancelarEdicaoItemVenda() {
  itemVendaEditando = -1;
  atualizarTabelaItensVendaTemp();
}

function salvarEdicaoItemVenda(indice) {
  const it = itensVendaTemp[indice];
  if (!it) return;
  const quantidade = numeroBr(document.getElementById('venda-edit-qtd').value);
  const valorUnit = numeroBr(document.getElementById('venda-edit-valor').value);
  if (!quantidade || quantidade <= 0) { alert('Informe uma quantidade válida.'); return; }
  if (valorUnit < 0 || isNaN(valorUnit)) { alert('Informe um valor unitário válido.'); return; }
  it.quantidade = quantidade;
  it.valor_unitario = valorUnit;
  it.valor_total = Math.round(quantidade * valorUnit * 100) / 100;
  itemVendaEditando = -1;
  atualizarTabelaItensVendaTemp();
}

function atualizarTabelaItensVendaTemp() {
  const tbody = document.getElementById('itens-venda-tbody');
  tbody.innerHTML = itensVendaTemp.map((it, idx) => idx === itemVendaEditando ? `
    <tr class="item-em-edicao">
      <td>${escapeHtml(it.descricao)}</td>
      <td>${it.numero_pedido ? escapeHtml(it.numero_pedido) + (it.item_pedido ? ' / ' + escapeHtml(it.item_pedido) : '') : '-'}</td>
      <td><input type="text" id="venda-edit-qtd" value="${String(it.quantidade).replace('.', ',')}" style="width:58px" inputmode="decimal"></td>
      <td><input type="text" id="venda-edit-valor" value="${(Number(it.valor_unitario) || 0).toFixed(2).replace('.', ',')}" style="width:74px" inputmode="decimal"></td>
      <td>—</td>
      <td class="acoes">
        <button type="button" onclick="salvarEdicaoItemVenda(${idx})" title="Salvar alteração do item">&#10003;</button>
        <button type="button" onclick="cancelarEdicaoItemVenda()" title="Cancelar">&#10005;</button>
      </td>
    </tr>` : `
    <tr>
      <td>${escapeHtml(it.descricao)}</td>
      <td>${it.numero_pedido ? escapeHtml(it.numero_pedido) + (it.item_pedido ? ' / ' + escapeHtml(it.item_pedido) : '') : '-'}</td>
      <td>${it.quantidade}</td>
      <td>${formatarMoeda(it.valor_unitario)}</td>
      <td>${formatarMoeda(it.valor_total)}</td>
      <td class="acoes">
        <button type="button" onclick="editarItemVenda(${idx})" title="Editar valor e quantidade do item">&#9998;</button>
        <button type="button" onclick="removerItemVenda(${idx})" title="Excluir item do pedido">&#128465;</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="6" class="vazio">Nenhum item adicionado.</td></tr>';
  atualizarPesoTotalVenda();
}

function atualizarPesoTotalVenda() {
  const pesoEl = document.getElementById('venda-peso-total');
  if (!pesoEl || pesoManualVenda) return;
  const produtos = loadList('produtos');
  const pesoTotal = itensVendaTemp.reduce((soma, item) => {
    const produto = produtos.find(p => p.id === item.produto_id);
    const pesoUnitario = produto ? (Number(produto.peso) || 0) : 0;
    return soma + pesoUnitario * (Number(item.quantidade) || 0);
  }, 0);
  pesoEl.value = pesoTotal.toFixed(3).replace('.', ',');
}

function adicionarDias(dataIso, dias) {
  const data = new Date(dataIso + 'T00:00:00');
  data.setDate(data.getDate() + dias);
  return data.toISOString().slice(0, 10);
}

function parsePrazosPagamento(texto) {
  const partes = String(texto || '')
    .split('/')
    .map(p => p.trim())
    .filter(p => p !== '')
    .map(p => Math.max(0, Math.round(numeroBr(p))))
    .slice(0, 10);
  return partes.length ? partes : [0];
}

function construirPrazosDisplay(registro) {
  if (registro && Array.isArray(registro.prazos_pagamento) && registro.prazos_pagamento.length) {
    return registro.prazos_pagamento.join('/');
  }
  // compatibilidade com vendas antigas, salvas antes deste campo existir
  if (registro && registro.parcelas) {
    const totalParcelas = Math.max(1, Math.round(Number(registro.parcelas) || 1));
    const intervalo = Math.max(0, Number(registro.intervalo_dias) || 0);
    const prazos = [];
    for (let i = 0; i < totalParcelas; i++) prazos.push(intervalo * (i + 1));
    return prazos.join('/');
  }
  return '30';
}

function formatarCondicaoPagamento(venda) {
  // Compras importadas de XML de NF-e que trazem duplicatas (cobr/dup) guardam as datas exatas do boleto.
  if (Array.isArray(venda.duplicatas_nfe) && venda.duplicatas_nfe.length) {
    if (venda.duplicatas_nfe.length === 1) {
      return `1x (NF-e) — vencimento ${formatarDataBr(venda.duplicatas_nfe[0].vencimento)}`;
    }
    return `${venda.duplicatas_nfe.length}x (NF-e): ${venda.duplicatas_nfe.map(d => formatarDataBr(d.vencimento)).join(', ')}`;
  }
  if (Array.isArray(venda.prazos_pagamento) && venda.prazos_pagamento.length) {
    const prazos = venda.prazos_pagamento;
    if (prazos.length === 1) {
      return prazos[0] === 0 ? 'À vista' : `1x (${prazos[0]} dias)`;
    }
    return `${prazos.length}x (${prazos.join('/')} dias)`;
  }
  // compatibilidade com vendas antigas
  if (venda.parcelas) {
    return `${venda.parcelas}x ${venda.intervalo_dias ? `(a cada ${venda.intervalo_dias} dias)` : ''}`;
  }
  return '-';
}

function gerarParcelasReceber(venda) {
  const prazos = Array.isArray(venda.prazos_pagamento) && venda.prazos_pagamento.length ? venda.prazos_pagamento : [0];
  const totalParcelas = prazos.length;
  const valorBase = Math.floor((venda.valor_total / totalParcelas) * 100) / 100;
  let somaParcial = 0;

  const contas = loadList('contas_receber');
  prazos.forEach((dias, i) => {
    const ultimaParcela = i === totalParcelas - 1;
    const valorParcela = ultimaParcela ? Math.round((venda.valor_total - somaParcial) * 100) / 100 : valorBase;
    somaParcial += valorParcela;

    contas.push({
      id: nextId(contas),
      cliente_id: venda.cliente_id,
      venda_id: venda.id,
      descricao: totalParcelas > 1 ? `Venda #${venda.id} - Parcela ${i + 1}/${totalParcelas}` : `Venda #${venda.id}`,
      valor: valorParcela,
      data_vencimento: adicionarDias(venda.data_venda, dias),
      data_recebimento: null,
    });
  });
  saveList('contas_receber', contas);
}

function salvarVendaManual(id) {
  const clienteId = document.getElementById('venda-cliente').value;
  if (!clienteId) {
    alert('Selecione o cliente.');
    return;
  }
  if (!itensVendaTemp.length) {
    alert('Adicione ao menos um item à venda.');
    return;
  }

  const dataVenda = document.getElementById('venda-data').value || new Date().toISOString().slice(0, 10);
  const numeroDoc = document.getElementById('venda-numero').value.trim();
  const vendedor = document.getElementById('venda-vendedor').value.trim();
  const transportadoraId = document.getElementById('venda-transportadora').value;
  const fretePorConta = document.getElementById('venda-frete-por-conta').value;
  const valorFrete = numeroBr(document.getElementById('venda-valor-frete').value);
  const especie = document.getElementById('venda-especie').value.trim();
  const prazosPagamento = parsePrazosPagamento(document.getElementById('venda-prazos-pagamento').value);

  const valorTotal = itensVendaTemp.reduce((soma, it) => soma + it.valor_total, 0);
  const produtos = loadList('produtos');
  const pesoCalculado = itensVendaTemp.reduce((soma, item) => {
    const produto = produtos.find(p => p.id === item.produto_id);
    return soma + ((produto ? Number(produto.peso) || 0 : 0) * (Number(item.quantidade) || 0));
  }, 0);
  const pesoDigitado = Math.max(0, numeroBr(document.getElementById('venda-peso-total').value) || 0);
  const pesoTotal = pesoManualVenda ? Math.round(pesoDigitado * 1000) / 1000 : pesoCalculado;

  const vendas = loadList('vendas');
  const vendaAntiga = id ? vendas.find(v => v.id === id) : null;
  let jaTinhaRecebimento = false;

  if (id && vendaAntiga) {
    // Edicao: desfaz os efeitos da venda antiga (devolve estoque e apaga parcelas antigas)
    // antes de gravar os novos dados, para nao duplicar nem deixar numeros errados. Como os
    // itens podem ter mudado, o recebimento precisa ser gerado de novo (botão "Gerar Recebimento"
    // ou "Emitir NFe").
    jaTinhaRecebimento = !!vendaAntiga.recebimento_gerado;
    if (jaTinhaRecebimento) {
      reverterEstoqueVenda(vendaAntiga.itens || []);
      removerContasReceberDaVenda(id);
    }
  }

  const vendaSalva = {
    id: id || nextId(vendas),
    cliente_id: Number(clienteId),
    numero: numeroDoc,
    data_venda: dataVenda,
    valor_total: valorTotal,
    itens: itensVendaTemp,
    vendedor: vendedor,
    transportadora_id: transportadoraId ? Number(transportadoraId) : null,
    frete_por_conta: fretePorConta,
    valor_frete: valorFrete,
    especie: especie,
    peso_total: pesoTotal,
    peso_manual: pesoManualVenda,
    prazos_pagamento: prazosPagamento,
    status_nf: vendaAntiga ? (vendaAntiga.status_nf || 'Pendente') : 'Pendente',
    numero_nf: vendaAntiga ? (vendaAntiga.numero_nf || '') : '',
    serie_nf: vendaAntiga ? (vendaAntiga.serie_nf || '1') : '1',
    data_emissao_nf: vendaAntiga ? (vendaAntiga.data_emissao_nf || '') : '',
    chave_nfe: vendaAntiga ? (vendaAntiga.chave_nfe || '') : '',
    recebimento_gerado: false,
  };

  if (id) {
    const idx = vendas.findIndex(v => v.id === id);
    vendas[idx] = vendaSalva;
  } else {
    vendas.push(vendaSalva);
  }
  saveList('vendas', vendas);
  fecharModal();
  renderVendas();
  if (jaTinhaRecebimento) {
    alert('Venda atualizada. Como esta venda já tinha recebimento gerado, o estoque e as parcelas antigas foram revertidos — use "Emitir NFe" ou "Gerar Recebimento" para lançar os dados atualizados.');
  }
}

/* =========================================================
   FRENTE DE CAIXA (PDV) — venda a consumidor final
   Caixa com abertura/fechamento, sangria/suprimento, pagamentos
   mistos com troco e emissão de NFC-e pela Focus NFe.
   ========================================================= */

const PDV_FORMAS = [
  { chave: 'dinheiro', rotulo: 'Dinheiro', codigo: '01' },
  { chave: 'pix', rotulo: 'PIX', codigo: '17' },
  { chave: 'debito', rotulo: 'Cartão de Débito', codigo: '04' },
  { chave: 'credito', rotulo: 'Cartão de Crédito', codigo: '03' },
];
let pdvCarrinho = [];
let pdvDescontoTexto = '';
let pdvCpf = '';
let pdvEmitirNfce = true;
let pdvResultados = [];
let pdvPedidoOrigemId = null;

function pdvCaixaAberto() {
  return loadList('caixas').find(c => c.status === 'aberto') || null;
}

function pdvSubtotal() {
  return arred2(pdvCarrinho.reduce((s, i) => s + (Number(i.quantidade) || 0) * (Number(i.valor_unitario) || 0), 0));
}

/* Aceita "10" / "10,50" (reais) ou "5%" (percentual). Nunca passa do subtotal. */
function pdvParseDesconto(texto, subtotal) {
  const t = String(texto || '').trim();
  if (!t) return 0;
  let valor;
  if (t.endsWith('%')) valor = subtotal * (parseFloat(t.slice(0, -1).replace(',', '.')) || 0) / 100;
  else valor = parseFloat(t.replace(/\./g, '').replace(',', '.')) || 0;
  return Math.min(Math.max(arred2(valor), 0), subtotal);
}

function pdvDesconto() { return pdvParseDesconto(pdvDescontoTexto, pdvSubtotal()); }
function pdvTotal() { return Math.max(0, arred2(pdvSubtotal() - pdvDesconto())); }

/* pagamentos: { dinheiro, pix, debito, credito } (dinheiro = valor entregue pelo cliente). */
function pdvCalcularPagamento(total, pagamentos) {
  const v = k => Math.max(0, arred2(pagamentos[k]));
  const dinheiro = v('dinheiro');
  const outros = arred2(v('pix') + v('debito') + v('credito'));
  const pago = arred2(dinheiro + outros);
  const restante = Math.max(0, arred2(total - pago));
  const troco = Math.max(0, arred2(pago - total));
  const valido = total > 0 && pago >= total && outros <= total && troco <= dinheiro;
  return { pago, restante, troco, valido };
}

/* Rateia o desconto entre os itens (o último leva a sobra), devolvendo itens de venda. */
function pdvItensComDesconto(carrinho, desconto) {
  const subtotal = arred2(carrinho.reduce((s, i) => s + i.quantidade * i.valor_unitario, 0));
  let acumulado = 0;
  return carrinho.map((i, idx) => {
    const bruto = arred2(i.quantidade * i.valor_unitario);
    const ultimo = idx === carrinho.length - 1;
    const parte = ultimo ? arred2(desconto - acumulado) : arred2(subtotal ? desconto * bruto / subtotal : 0);
    acumulado = arred2(acumulado + parte);
    const liquido = arred2(bruto - parte);
    return {
      produto_id: i.produto_id,
      descricao: i.descricao,
      quantidade: i.quantidade,
      valor_unitario: i.quantidade ? Number((liquido / i.quantidade).toFixed(4)) : 0,
      valor_total: liquido,
    };
  });
}

function pdvResumoCaixa(caixa, vendas) {
  const vs = vendas.filter(v => v.origem === 'pdv' && v.caixa_id === caixa.id && !v.cancelada_pdv);
  const porForma = { dinheiro: 0, pix: 0, debito: 0, credito: 0 };
  vs.forEach(v => (v.pagamentos || []).forEach(p => { if (p.forma in porForma) porForma[p.forma] = arred2(porForma[p.forma] + p.valor); }));
  const movs = caixa.movimentos || [];
  const soma = tipo => arred2(movs.filter(m => m.tipo === tipo).reduce((s, m) => s + (Number(m.valor) || 0), 0));
  const suprimentos = soma('suprimento');
  const sangrias = soma('sangria');
  const totalVendas = arred2(vs.reduce((s, v) => s + (Number(v.valor_total) || 0), 0));
  const esperadoDinheiro = arred2((Number(caixa.troco_inicial) || 0) + porForma.dinheiro + suprimentos - sangrias);
  return { quantidade: vs.length, totalVendas, porForma, suprimentos, sangrias, esperadoDinheiro };
}

function pdvAgora() { return dataHoraLocalComFuso(); }
function pdvFormatarDataHora(iso) {
  if (!iso) return '-';
  return formatarDataBr(String(iso).slice(0, 10)) + ' ' + String(iso).slice(11, 16);
}

function pdvAbrirCaixa() {
  const troco = numeroBr(document.getElementById('pdv-troco-inicial').value);
  if (troco < 0) { alert('Troco inicial inválido.'); return; }
  const usuario = usuarioLogado();
  const caixas = loadList('caixas');
  if (caixas.some(c => c.status === 'aberto')) { renderPdv(); return; }
  caixas.push({
    id: nextId(caixas), status: 'aberto', aberto_em: pdvAgora(),
    aberto_por: usuario ? usuario.nome : '', troco_inicial: arred2(troco), movimentos: [],
  });
  saveList('caixas', caixas);
  renderPdv();
}

/* ---------- busca e carrinho ---------- */

function pdvBuscar() {
  const campo = document.getElementById('pdv-busca');
  const alvo = document.getElementById('pdv-resultados');
  if (!campo || !alvo) return;
  const termo = campo.value.replace(/^\s*\d+([.,]\d+)?\s*\*/, '').trim();
  if (!termo) { pdvResultados = []; alvo.innerHTML = ''; return; }
  pdvResultados = filtrarProdutosPorTermo(loadList('produtos'), termo).slice(0, 8);
  alvo.innerHTML = pdvResultados.map(p => `
    <div class="pdv-resultado" style="padding:8px;border-bottom:1px solid #ddd;cursor:pointer" onclick="pdvAdicionarProduto(${p.id}, 1)">
      <strong>${escapeHtml(p.descricao)}</strong> <small>${escapeHtml(p.cod_interno || '')}</small><br>
      ${formatarMoeda(p.valor_venda)} · estoque: ${Number(p.estoque_atual) || 0}
    </div>`).join('') || '<em>Nenhum produto encontrado.</em>';
}

function pdvTeclaBusca(ev) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  const campo = document.getElementById('pdv-busca');
  const bruto = campo.value.trim();
  if (!bruto) return;
  const m = bruto.match(/^\s*(\d+(?:[.,]\d+)?)\s*\*\s*(.*)$/);
  const quantidade = m ? parseFloat(m[1].replace(',', '.')) : 1;
  const termo = (m ? m[2] : bruto).trim();
  const produtos = loadList('produtos');
  const exato = produtos.find(p => termo && (somenteDigitos(p.gtin_venda) === termo || String(p.cod_interno || '').trim().toLowerCase() === termo.toLowerCase()));
  const escolhido = exato || (pdvResultados.length ? pdvResultados[0] : null);
  if (!escolhido) { alert('Produto não encontrado.'); return; }
  pdvAdicionarProduto(escolhido.id, quantidade > 0 ? quantidade : 1);
}

function pdvAdicionarProduto(produtoId, quantidade) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  const existente = pdvCarrinho.find(i => i.produto_id === produtoId);
  if (existente) existente.quantidade = arred2(existente.quantidade + quantidade);
  else pdvCarrinho.push({
    produto_id: produto.id,
    descricao: produto.descricao,
    quantidade: quantidade,
    valor_unitario: Number(produto.valor_venda) || 0,
  });
  const campo = document.getElementById('pdv-busca');
  if (campo) { campo.value = ''; campo.focus(); }
  pdvResultados = [];
  const alvo = document.getElementById('pdv-resultados');
  if (alvo) alvo.innerHTML = '';
  pdvRenderCarrinho();
}

/* Carrega no carrinho um pedido de venda ainda sem faturamento (sem NF-e, estoque ou recebimento).
   Ao finalizar, o pedido é substituído pela venda do caixa. */
function pdvCarregarPedido() {
  const campo = document.getElementById('pdv-pedido');
  const termo = campo ? campo.value.trim() : '';
  if (!termo) return;
  const norm = x => String(x == null ? '' : x).trim().toLowerCase();
  const vendas = loadList('vendas').filter(v => v.origem !== 'pdv');
  const venda = vendas.find(v => norm(v.numero) === norm(termo)) || vendas.find(v => String(v.id) === termo);
  if (!venda) { alert('Pedido de venda não encontrado.'); return; }
  if (venda.recebimento_gerado || venda.status_nf === 'Emitida' || venda.nfe_ref) {
    alert('Este pedido já foi faturado (NF-e/recebimento gerado) e não pode ser carregado na Frente de Caixa.');
    return;
  }
  if (!(venda.itens || []).length) { alert('O pedido não tem itens.'); return; }
  if (pdvCarrinho.length && !confirm('Substituir o carrinho atual pelo pedido ' + (venda.numero || venda.id) + '?')) return;
  pdvCarrinho = venda.itens.map(i => ({
    produto_id: i.produto_id, descricao: i.descricao,
    quantidade: Number(i.quantidade) || 0, valor_unitario: Number(i.valor_unitario) || 0,
  }));
  pdvDescontoTexto = '';
  const cli = loadList('clientes').find(c => c.id === venda.cliente_id);
  const doc = cli ? somenteDigitos(cli.cnpj_cpf || cli.cpf_cnpj || cli.cnpj || cli.cpf) : '';
  pdvCpf = doc.length === 11 ? doc : '';
  pdvPedidoOrigemId = venda.id;
  renderPdv();
  const aviso = document.getElementById('pdv-pedido');
  if (aviso) aviso.placeholder = 'Pedido ' + (venda.numero || venda.id) + ' carregado';
}

function pdvRenderCarrinho() {
  const alvo = document.getElementById('pdv-carrinho');
  if (!alvo) return;
  if (!pdvCarrinho.length) {
    alvo.innerHTML = '<p><em>Carrinho vazio. Leia o código de barras ou busque o produto.</em></p>';
  } else {
    alvo.innerHTML = `<table class="tabela" style="width:100%"><thead><tr><th>Item</th><th>Qtd</th><th>Unit.</th><th>Total</th><th></th></tr></thead><tbody>
      ${pdvCarrinho.map((i, idx) => `<tr>
        <td>${escapeHtml(i.descricao)}</td>
        <td><input type="text" value="${String(i.quantidade).replace('.', ',')}" style="width:60px" onchange="pdvAlterarQuantidade(${idx}, this.value)"></td>
        <td><input type="text" value="${i.valor_unitario.toFixed(2).replace('.', ',')}" style="width:80px" onchange="pdvAlterarPreco(${idx}, this.value)"></td>
        <td>${formatarMoeda(arred2(i.quantidade * i.valor_unitario))}</td>
        <td><button onclick="pdvRemoverItem(${idx})" title="Remover">✖</button></td>
      </tr>`).join('')}</tbody></table>`;
  }
  pdvAtualizarTotais();
}

function pdvAtualizarTotais() {
  const alvo = document.getElementById('pdv-totais');
  if (!alvo) return;
  const sub = pdvSubtotal();
  const desc = pdvDesconto();
  alvo.innerHTML = `Subtotal: ${formatarMoeda(sub)}${desc ? ` · Desconto: −${formatarMoeda(desc)}` : ''}<br><strong>TOTAL: ${formatarMoeda(pdvTotal())}</strong>`;
}

function pdvAlterarQuantidade(idx, texto) {
  const q = parseFloat(String(texto).replace(',', '.'));
  if (!(q > 0)) pdvCarrinho.splice(idx, 1); else pdvCarrinho[idx].quantidade = q;
  pdvRenderCarrinho();
}
function pdvAlterarPreco(idx, texto) {
  const v = numeroBr(texto);
  if (v >= 0) pdvCarrinho[idx].valor_unitario = v;
  pdvRenderCarrinho();
}
function pdvRemoverItem(idx) { pdvCarrinho.splice(idx, 1); pdvRenderCarrinho(); }
function pdvLimparCarrinho(confirmar) {
  if (confirmar && pdvCarrinho.length && !confirm('Limpar o carrinho?')) return;
  pdvCarrinho = []; pdvDescontoTexto = ''; pdvCpf = ''; pdvPedidoOrigemId = null;
  if (document.getElementById('sec-pdv') && document.getElementById('sec-pdv').style.display !== 'none') renderPdv();
}

document.addEventListener('keydown', ev => {
  const sec = document.getElementById('sec-pdv');
  if (ev.key === 'F2' && sec && sec.style.display !== 'none' && pdvCaixaAberto() && document.getElementById('modal-overlay').style.display !== 'flex') {
    ev.preventDefault();
    pdvAbrirPagamento();
  }
});

/* ---------- pagamento ---------- */

function pdvAbrirPagamento() {
  if (!pdvCarrinho.length) { alert('Adicione ao menos um item.'); return; }
  const cpf = somenteDigitos(pdvCpf);
  if (cpf && cpf.length !== 11) { alert('CPF inválido: informe 11 dígitos ou deixe em branco.'); return; }
  const total = pdvTotal();
  if (!(total > 0)) { alert('O total da venda precisa ser maior que zero.'); return; }
  abrirModal(`
    <h3>Pagamento — ${formatarMoeda(total)}</h3>
    ${PDV_FORMAS.map(f => `
      <div class="form-group" style="display:flex;gap:8px;align-items:center">
        <label style="width:150px">${f.rotulo}</label>
        <input type="text" id="pdv-pg-${f.chave}" value="" placeholder="0,00" oninput="pdvAtualizarPagamento()" style="flex:1">
        <button type="button" class="btn-secondary" onclick="pdvPreencherRestante('${f.chave}')">Restante</button>
      </div>`).join('')}
    <div id="pdv-pg-resumo" style="font-size:18px;margin:12px 0"></div>
    <button class="btn-primary" id="pdv-pg-confirmar" onclick="pdvConfirmarVenda()">Confirmar venda</button>
    <button class="btn-secondary" onclick="fecharModal()">Voltar</button>`);
  pdvPreencherRestante('dinheiro', true);
}

function pdvLerPagamentos() {
  const p = {};
  PDV_FORMAS.forEach(f => { const el = document.getElementById('pdv-pg-' + f.chave); p[f.chave] = el ? numeroBr(el.value) : 0; });
  return p;
}

function pdvPreencherRestante(chave, limparOutros) {
  const total = pdvTotal();
  const atual = pdvLerPagamentos();
  atual[chave] = 0;
  const calc = pdvCalcularPagamento(total, atual);
  const campo = document.getElementById('pdv-pg-' + chave);
  if (campo) {
    campo.value = calc.restante > 0 ? calc.restante.toFixed(2).replace('.', ',') : '';
    campo.focus(); campo.select();
  }
  pdvAtualizarPagamento();
}

function pdvAtualizarPagamento() {
  const total = pdvTotal();
  const calc = pdvCalcularPagamento(total, pdvLerPagamentos());
  const resumo = document.getElementById('pdv-pg-resumo');
  const botao = document.getElementById('pdv-pg-confirmar');
  if (!resumo) return;
  resumo.innerHTML = `Recebido: ${formatarMoeda(calc.pago)} · ` +
    (calc.restante > 0 ? `<strong style="color:#c62828">Falta: ${formatarMoeda(calc.restante)}</strong>` : `<strong style="color:#2e7d32">Troco: ${formatarMoeda(calc.troco)}</strong>`) +
    (calc.pago >= total && !calc.valido ? '<br><small style="color:#c62828">Troco só pode sair do dinheiro; cartão/PIX não podem passar do total.</small>' : '');
  if (botao) botao.disabled = !calc.valido;
}

/* ---------- finalização ---------- */

function pdvConfirmarVenda() {
  const caixa = pdvCaixaAberto();
  if (!caixa) { alert('O caixa não está aberto.'); return; }
  const total = pdvTotal();
  const entregue = pdvLerPagamentos();
  const calc = pdvCalcularPagamento(total, entregue);
  if (!calc.valido) return;

  const pagamentos = [];
  PDV_FORMAS.forEach(f => {
    let valor = arred2(entregue[f.chave]);
    if (f.chave === 'dinheiro') valor = arred2(valor - calc.troco);
    if (valor > 0) pagamentos.push({ forma: f.chave, codigo: f.codigo, valor });
  });

  const usuario = usuarioLogado();
  const vendas = loadList('vendas');
  const id = nextId(vendas);
  const itens = pdvItensComDesconto(pdvCarrinho, pdvDesconto());
  const emitir = pdvEmitirNfce && !!urlIntermediarioNfe(configNfe());
  const venda = {
    id, origem: 'pdv', caixa_id: caixa.id, cliente_id: null,
    numero: 'PDV-' + id, data_venda: dataHojeLocalIso(), hora_venda: pdvAgora(),
    valor_total: total, desconto: pdvDesconto(), itens,
    vendedor: usuario ? usuario.nome : '', pagamentos, troco: calc.troco,
    cpf_consumidor: somenteDigitos(pdvCpf), prazos_pagamento: [0],
    status_nf: 'Pendente', numero_nf: '', serie_nf: '', data_emissao_nf: '', chave_nfe: '',
    nfce: emitir, recebimento_gerado: true,
  };
  if (pdvPedidoOrigemId) {
    const idxPedido = vendas.findIndex(v => v.id === pdvPedidoOrigemId && v.origem !== 'pdv' && !v.recebimento_gerado);
    if (idxPedido !== -1) {
      venda.pedido_origem = vendas[idxPedido].numero || String(vendas[idxPedido].id);
      vendas.splice(idxPedido, 1);
    }
  }
  vendas.push(venda);
  saveList('vendas', vendas);
  aplicarBaixaEstoqueVenda(itens);

  pdvCarrinho = []; pdvDescontoTexto = ''; pdvCpf = ''; pdvPedidoOrigemId = null;
  fecharModal();
  renderPdv();
  pdvMostrarConclusao(id, emitir);
  if (emitir) pdvTransmitirNfce(id, true);
}

function pdvMostrarConclusao(vendaId, emitindo) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  abrirModal(`
    <h3>✅ Venda #${venda.id} concluída — ${formatarMoeda(venda.valor_total)}</h3>
    ${venda.troco > 0 ? `<p style="font-size:22px"><strong>Troco: ${formatarMoeda(venda.troco)}</strong></p>` : ''}
    <div id="pdv-status-nfce">${emitindo ? '⏳ Emitindo NFC-e...' : (venda.nfce ? '' : 'Venda sem NFC-e.')}</div>
    <div style="margin-top:12px">
      <button class="btn-primary" onclick="pdvImprimirCupom(${venda.id})">🖨️ Imprimir cupom</button>
      <button class="btn-secondary" onclick="fecharModal()">Nova venda</button>
    </div>`);
}

function pdvMostrarStatusNfce(texto, tipo) {
  const alvo = document.getElementById('pdv-status-nfce');
  if (alvo) alvo.innerHTML = `<div style="padding:8px;border-radius:6px;background:${tipo === 'erro' ? '#ffebee' : tipo === 'ok' ? '#e8f5e9' : '#e3f2fd'}">${escapeHtml(texto).replace(/\n/g, '<br>')}</div>`;
}

/* ---------- NFC-e (Focus NFe) ---------- */

function montarNfceVenda(venda) {
  const cfg = configNfe();
  const empresa = dadosEmpresaAtuais();
  const produtos = loadList('produtos');
  const erros = [];
  const regime = cfg.regime_tributario;
  const simples = regime === '1' || regime === '2';
  const cnpjEmitente = somenteDigitos(empresa.cnpj);
  const ufEmitente = String(empresa.uf || '').trim().toUpperCase();
  if (cnpjEmitente.length !== 14) erros.push('CNPJ da empresa inválido ou não preenchido (Configurações → Dados da Empresa).');
  if (ufEmitente.length !== 2) erros.push('UF da empresa não preenchida.');
  if (!somenteDigitos(empresa.inscricao_estadual)) erros.push('Inscrição Estadual da empresa não preenchida.');

  const items = (venda.itens || []).map((it, i) => {
    const produto = produtos.find(p => p.id === it.produto_id) || {};
    const rotulo = `Item ${i + 1} (${it.descricao})`;
    const ncm = somenteDigitos(produto.ncm);
    if (ncm.length !== 8) erros.push(`${rotulo}: NCM não cadastrado ou inválido (8 dígitos) — ajuste no cadastro do produto.`);
    const cstInfo = decomporCstProduto(produto.cst_csosn || cfg.icms_cst_padrao, regime);
    const origemProduto = somenteDigitos(String(produto.origem || '').slice(0, 1));
    const origem = origemProduto || cstInfo.origem || somenteDigitos(cfg.origem_padrao) || '0';
    const cst = cstInfo.cst;
    if (simples && cst.length !== 3) erros.push(`${rotulo}: no Simples Nacional use CSOSN de 3 dígitos (ex.: 102, 500).`);
    if (!simples && cst.length !== 2) erros.push(`${rotulo}: no Regime Normal use CST de 2 dígitos.`);
    const cfop = ajustarCfopDestino(produto.cfop || cfg.cfop_padrao, false);
    if (cfop.length !== 4) erros.push(`${rotulo}: CFOP inválido.`);
    const quantidade = Number(it.quantidade) || 0;
    const bruto = arred2(it.valor_total);
    const unit = quantidade ? bruto / quantidade : 0;
    const unidade = (String(produto.unidade_medida || 'UN').trim().toUpperCase() || 'UN').slice(0, 6);
    const gtin = somenteDigitos(produto.gtin_venda);
    const gtinValido = [8, 12, 13, 14].includes(gtin.length) ? gtin : 'SEM GTIN';
    const item = {
      numero_item: i + 1,
      codigo_produto: String(produto.cod_interno || it.produto_id || i + 1),
      descricao: String(it.descricao || produto.descricao || '').slice(0, 120),
      codigo_ncm: ncm, cfop,
      unidade_comercial: unidade, quantidade_comercial: quantidade,
      valor_unitario_comercial: Number(unit.toFixed(10)),
      unidade_tributavel: unidade, quantidade_tributavel: quantidade,
      valor_unitario_tributavel: Number(unit.toFixed(10)),
      valor_bruto: bruto,
      codigo_barras_comercial: gtinValido, codigo_barras_tributavel: gtinValido,
      inclui_no_total: 1,
      icms_origem: Number(origem), icms_situacao_tributaria: cst,
    };
    if (!simples && cst === '00') {
      const aliq = Number(produto.aliquota_icms) || 0;
      if (!aliq) erros.push(`${rotulo}: CST 00 exige alíquota de ICMS no cadastro do produto.`);
      item.icms_modalidade_base_calculo = 3;
      item.icms_base_calculo = bruto;
      item.icms_aliquota = aliq;
      item.icms_valor = arred2(bruto * aliq / 100);
    }
    [['pis', cfg.pis_cst_padrao, produto.aliquota_pis], ['cofins', cfg.cofins_cst_padrao, produto.aliquota_cofins]].forEach(([tributo, cstPadrao, aliquotaProduto]) => {
      const cstTrib = somenteDigitos(cstPadrao).padStart(2, '0');
      item[`${tributo}_situacao_tributaria`] = cstTrib;
      const aliq = Number(aliquotaProduto) || 0;
      if (['01', '02'].includes(cstTrib) || Number(cstTrib) >= 49) {
        const base = ['01', '02'].includes(cstTrib) || aliq ? bruto : 0;
        item[`${tributo}_base_calculo`] = base;
        item[`${tributo}_aliquota_porcentual`] = aliq;
        item[`${tributo}_valor`] = arred2(base * aliq / 100);
      }
    });
    aplicarIbsCbsItem(item, produto, cfg, bruto, [], rotulo);
    return item;
  });
  if (!items.length) erros.push('A venda não tem itens.');
  const valorProdutos = arred2(items.reduce((s, it) => s + it.valor_bruto, 0));
  const payload = {
    natureza_operacao: 'VENDA AO CONSUMIDOR',
    data_emissao: dataHoraLocalComFuso(),
    tipo_documento: 1, finalidade_emissao: 1, consumidor_final: 1, presenca_comprador: 1,
    local_destino: 1, modalidade_frete: 9,
    cnpj_emitente: cnpjEmitente,
    nome_emitente: empresa.razao_social || '',
    nome_fantasia_emitente: empresa.nome_fantasia || '',
    logradouro_emitente: empresa.endereco || '',
    numero_emitente: empresa.numero || 'S/N',
    bairro_emitente: empresa.bairro || '',
    municipio_emitente: empresa.cidade || '',
    uf_emitente: ufEmitente,
    cep_emitente: somenteDigitos(empresa.cep),
    inscricao_estadual_emitente: somenteDigitos(empresa.inscricao_estadual),
    regime_tributario_emitente: Number(regime),
    valor_produtos: valorProdutos, valor_desconto: 0, valor_total: valorProdutos,
    formas_pagamento: (venda.pagamentos || []).map(p => ({ forma_pagamento: p.codigo, valor_pagamento: arred2(p.valor) })),
    items,
  };
  aplicarIbsCbsTotais(payload, items);
  if (arred2(valorProdutos) !== arred2(venda.valor_total)) erros.push('Total dos itens difere do total da venda.');
  if (somenteDigitos(venda.cpf_consumidor).length === 11) payload.cpf_destinatario = somenteDigitos(venda.cpf_consumidor);
  return { payload, erros };
}

/* Reenvia/consulta a NFC-e de uma venda do PDV. A venda já está gravada: se a nota falhar,
   fica "Pendente" e pode ser reenviada depois (lista abaixo do caixa). */
async function pdvTransmitirNfce(vendaId, noModal) {
  const venda = loadList('vendas').find(v => v.id === vendaId);
  if (!venda) return;
  const cfg = configNfe();
  const mostrar = (t, tipo) => { if (noModal) pdvMostrarStatusNfce(t, tipo); };
  const { payload, erros } = montarNfceVenda(venda);
  if (erros.length) {
    atualizarVendaNfe(vendaId, { nfe_mensagem: erros.join(' | ') });
    mostrar('NFC-e não enviada — corrija e reenvie depois:\n- ' + erros.join('\n- '), 'erro');
    pdvRenderPendentes();
    if (!noModal) alert('Corrija antes de enviar:\n\n- ' + erros.join('\n- '));
    return;
  }
  const ref = venda.nfe_ref && ['erro_autorizacao', 'processando_autorizacao'].includes(venda.nfe_status_api) && venda.nfe_ambiente === cfg.ambiente
    ? venda.nfe_ref : `paptech-pdv${venda.id}-${Date.now().toString(36)}`;
  mostrar('⏳ Enviando NFC-e para a SEFAZ...', 'info');
  try {
    let retorno;
    if (venda.nfe_ref === ref && venda.nfe_status_api === 'processando_autorizacao') {
      retorno = (await chamarFocusNfe('GET', `/v2/nfce/${encodeURIComponent(ref)}`)).dados || {};
    } else {
      const { status, dados } = await chamarFocusNfe('POST', `/v2/nfce?ref=${encodeURIComponent(ref)}`, payload);
      if (status >= 400 && !dados.status) {
        const msg = mensagemErroFocus(dados, status);
        atualizarVendaNfe(vendaId, { nfe_mensagem: msg });
        mostrar('NFC-e não aceita (a venda foi salva e pode ser reenviada):\n' + msg, 'erro');
        pdvRenderPendentes();
        return;
      }
      atualizarVendaNfe(vendaId, { nfe_ref: ref, nfe_ambiente: cfg.ambiente, nfe_status_api: dados.status || 'processando_autorizacao', nfe_mensagem: '' });
      retorno = dados;
    }
    for (let t = 0; t < 10 && (!retorno.status || retorno.status === 'processando_autorizacao'); t++) {
      mostrar(`⏳ Aguardando a SEFAZ autorizar... (${t + 1})`, 'info');
      await esperar(2000);
      retorno = (await chamarFocusNfe('GET', `/v2/nfce/${encodeURIComponent(ref)}`)).dados || {};
    }
    const resultado = processarRetornoNfe(vendaId, retorno);
    if (resultado === 'autorizado') {
      atualizarVendaNfe(vendaId, {
        nfce_qrcode_url: retorno.qrcode_url || '',
        nfce_url_consulta: retorno.url_consulta_nf || '',
      });
      mostrar(`NFC-e autorizada! Nº ${retorno.numero || ''} série ${retorno.serie || ''}`, 'ok');
    } else if (resultado === 'processando_autorizacao') {
      mostrar('A SEFAZ ainda está processando. Use "Consultar" na lista de NFC-e pendentes em alguns minutos.', 'info');
    } else {
      mostrar(`${textoStatusApiNfe(retorno.status)}:\n${mensagemErroFocus(retorno, 200)}\n\nA venda foi salva; corrija e reenvie.`, 'erro');
    }
  } catch (erro) {
    atualizarVendaNfe(vendaId, { nfe_mensagem: erro.message });
    mostrar('Sem conexão com o emissor (a venda foi salva e a NFC-e pode ser reenviada depois):\n' + erro.message, 'erro');
  }
  renderSecaoAtualAposNfe();
  pdvRenderPendentes();
}

function pdvRenderPendentes() {
  const alvo = document.getElementById('pdv-pendentes');
  if (!alvo) return;
  const pend = loadList('vendas').filter(v => v.origem === 'pdv' && v.nfce && v.status_nf === 'Pendente' && !v.cancelada_pdv).slice(-10).reverse();
  if (!pend.length) { alvo.innerHTML = '<strong>NFC-e pendentes:</strong> nenhuma.'; return; }
  alvo.innerHTML = `<strong>NFC-e pendentes (${pend.length})</strong>
    <table class="tabela" style="width:100%"><tbody>${pend.map(v => `<tr>
      <td>#${v.id} · ${pdvFormatarDataHora(v.hora_venda)}</td><td>${formatarMoeda(v.valor_total)}</td>
      <td><small>${escapeHtml(v.nfe_mensagem || v.nfe_status_api || 'não enviada')}</small></td>
      <td><button onclick="pdvTransmitirNfce(${v.id}, false)">${v.nfe_status_api === 'processando_autorizacao' ? 'Consultar' : 'Reenviar'}</button></td>
    </tr>`).join('')}</tbody></table>`;
}

    <body>${corpo}<script>window.onload=function(){window.print()}<\/script></body></html>`);

}

    <div>Venda ${escapeHtml(v.numero)} · ${pdvFormatarDataHora(v.hora_venda)}<br>Operador: ${escapeHtml(v.vendedor || '-')}${v.cpf_consumidor ? '<br>CPF: ' + escapeHtml(v.cpf_consumidor) : ''}</div><hr>
    <table>${(v.itens || []).map(i => `<tr><td colspan="2">${escapeHtml(i.descricao)}</td></tr><tr><td>${i.quantidade} x ${formatarMoeda(i.valor_unitario)}</td><td class="d">${formatarMoeda(i.valor_total)}</td></tr>`).join('')}</table><hr>
    <table>${v.desconto ? `<tr><td>Desconto</td><td class="d">−${formatarMoeda(v.desconto)}</td></tr>` : ''}
    <tr><td><strong>TOTAL</strong></td><td class="d"><strong>${formatarMoeda(v.valor_total)}</strong></td></tr>
    ${(v.pagamentos || []).map(p => `<tr><td>${rot[p.forma] || p.forma}</td><td class="d">${formatarMoeda(p.valor)}</td></tr>`).join('')}
    ${v.troco ? `<tr><td>Troco</td><td class="d">${formatarMoeda(v.troco)}</td></tr>` : ''}</table><hr>

/* ---------- sangria / suprimento ---------- */

function pdvAbrirMovimento(tipo) {
  abrirModal(`
    <h3>${tipo === 'sangria' ? 'Sangria (retirada de dinheiro)' : 'Suprimento (entrada de dinheiro)'}</h3>
    <div class="form-group"><label>Valor (R$)</label><input type="text" id="pdv-mov-valor"></div>
    <div class="form-group"><label>Motivo</label><input type="text" id="pdv-mov-motivo"></div>
    <button class="btn-primary" onclick="pdvSalvarMovimento('${tipo}')">Salvar</button>
    <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>`);
}

function pdvSalvarMovimento(tipo) {
  const valor = arred2(numeroBr(document.getElementById('pdv-mov-valor').value));
  if (!(valor > 0)) { alert('Informe um valor maior que zero.'); return; }
  const caixas = loadList('caixas');
  const caixa = caixas.find(c => c.status === 'aberto');
  if (!caixa) return;
  caixa.movimentos = caixa.movimentos || [];
  caixa.movimentos.push({ tipo, valor, motivo: document.getElementById('pdv-mov-motivo').value.trim(), hora: pdvAgora() });
  saveList('caixas', caixas);
  fecharModal();
  alert(tipo === 'sangria' ? 'Sangria registrada.' : 'Suprimento registrado.');
}

/* ---------- vendas do caixa / cancelamento ---------- */

function pdvAbrirVendasCaixa() {
  const caixa = pdvCaixaAberto();
  if (!caixa) return;
  const vs = loadList('vendas').filter(v => v.origem === 'pdv' && v.caixa_id === caixa.id).reverse();
  abrirModal(`
    <h3>Vendas do caixa #${caixa.id}</h3>
    <table class="tabela" style="width:100%"><thead><tr><th>Nº</th><th>Hora</th><th>Total</th><th>NFC-e</th><th></th></tr></thead><tbody>
    ${vs.map(v => `<tr><td>${escapeHtml(v.numero)}</td><td>${pdvFormatarDataHora(v.hora_venda)}</td><td>${formatarMoeda(v.valor_total)}</td>
      <td>${v.cancelada_pdv ? 'Cancelada' : escapeHtml(v.status_nf)}</td>
      <td><button onclick="pdvImprimirCupom(${v.id})" title="Cupom">🖨️</button>
      ${!v.cancelada_pdv ? `<button onclick="pdvCancelarVenda(${v.id})" title="Cancelar venda">✖</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5">Nenhuma venda ainda.</td></tr>'}
    </tbody></table><button class="btn-secondary" onclick="fecharModal()">Fechar</button>`);
}

function pdvCancelarVenda(vendaId) {
  const vendas = loadList('vendas');
  const v = vendas.find(x => x.id === vendaId);
  if (!v || v.cancelada_pdv) return;
  if (v.status_nf === 'Emitida') {
    alert('Esta venda já tem NFC-e autorizada. O cancelamento fiscal precisa ser feito no painel da Focus NFe (prazo da SEFAZ); depois ajuste aqui manualmente.');
    return;
  }
  if (v.nfe_status_api === 'processando_autorizacao') { alert('A NFC-e ainda está em processamento. Consulte antes de cancelar.'); return; }
  if (!confirm(`Cancelar a venda ${v.numero}? O estoque será devolvido e ela sairá do fechamento do caixa.`)) return;
  reverterEstoqueVenda(v.itens || []);
  v.cancelada_pdv = true;
  v.status_nf = 'Cancelada';
  saveList('vendas', vendas);
  pdvAbrirVendasCaixa();
  pdvRenderPendentes();
}

/* ---------- fechamento ---------- */

function pdvAbrirFechamento() {
  const caixa = pdvCaixaAberto();
  if (!caixa) return;
  const r = pdvResumoCaixa(caixa, loadList('vendas'));
  const pend = loadList('vendas').filter(v => v.origem === 'pdv' && v.caixa_id === caixa.id && v.nfce && v.status_nf === 'Pendente' && !v.cancelada_pdv).length;
  abrirModal(`
    <h3>Fechar caixa #${caixa.id}</h3>
    ${pend ? `<p style="color:#c62828">⚠ ${pend} venda(s) com NFC-e pendente. Você pode fechar mesmo assim e reenviar depois.</p>` : ''}
    ${pdvTabelaResumoHtml(caixa, r)}
    <div class="form-group"><label>Dinheiro contado na gaveta (R$)</label><input type="text" id="pdv-contado" oninput="pdvAtualizarDiferenca(${r.esperadoDinheiro})"></div>
    <div id="pdv-diferenca" style="margin:6px 0"></div>
    <button class="btn-danger" onclick="pdvConfirmarFechamento()">Fechar caixa e imprimir relatório</button>
    <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>`);
}

function pdvAtualizarDiferenca(esperado) {
  const campo = document.getElementById('pdv-contado');
  const alvo = document.getElementById('pdv-diferenca');
  if (!campo.value.trim()) { alvo.innerHTML = ''; return; }
  const dif = arred2(numeroBr(campo.value) - esperado);
  alvo.innerHTML = dif === 0 ? '✔ Caixa confere.' : `<strong style="color:#c62828">Diferença: ${dif > 0 ? 'sobra' : 'falta'} de ${formatarMoeda(Math.abs(dif))}</strong>`;
}

function pdvTabelaResumoHtml(caixa, r) {
  const rot = Object.fromEntries(PDV_FORMAS.map(f => [f.chave, f.rotulo]));
  return `<table class="tabela" style="width:100%"><tbody>
    <tr><td>Troco inicial</td><td class="d">${formatarMoeda(caixa.troco_inicial)}</td></tr>
    <tr><td>Vendas (${r.quantidade})</td><td class="d"><strong>${formatarMoeda(r.totalVendas)}</strong></td></tr>
    ${PDV_FORMAS.map(f => `<tr><td>&nbsp;&nbsp;${rot[f.chave]}</td><td class="d">${formatarMoeda(r.porForma[f.chave])}</td></tr>`).join('')}
    <tr><td>Suprimentos</td><td class="d">${formatarMoeda(r.suprimentos)}</td></tr>
    <tr><td>Sangrias</td><td class="d">−${formatarMoeda(r.sangrias)}</td></tr>
    <tr><td><strong>Dinheiro esperado na gaveta</strong></td><td class="d"><strong>${formatarMoeda(r.esperadoDinheiro)}</strong></td></tr>
  </tbody></table>`;
}

function pdvConfirmarFechamento() {
  const campo = document.getElementById('pdv-contado');
  if (!campo.value.trim()) { alert('Informe o dinheiro contado na gaveta.'); return; }
  const caixas = loadList('caixas');
  const caixa = caixas.find(c => c.status === 'aberto');
  if (!caixa) return;
  const r = pdvResumoCaixa(caixa, loadList('vendas'));
  const contado = arred2(numeroBr(campo.value));
  caixa.status = 'fechado';
  caixa.fechado_em = pdvAgora();
  caixa.fechado_por = (usuarioLogado() || {}).nome || '';
  caixa.dinheiro_contado = contado;
  caixa.diferenca = arred2(contado - r.esperadoDinheiro);
  caixa.resumo = r;
  saveList('caixas', caixas);
  pdvCarrinho = []; pdvDescontoTexto = ''; pdvCpf = ''; pdvPedidoOrigemId = null;
  fecharModal();
  renderPdv();
  pdvImprimirRelatorioCaixa(caixa.id);
}

function pdvImprimirRelatorioCaixa(caixaId) {
  const caixa = loadList('caixas').find(c => c.id === caixaId);
  if (!caixa) return;
  const r = caixa.resumo || pdvResumoCaixa(caixa, loadList('vendas'));
  const e = dadosEmpresaAtuais();
  const movs = (caixa.movimentos || []).map(m => `<tr><td>${m.tipo === 'sangria' ? 'Sangria' : 'Suprimento'} ${escapeHtml(m.motivo || '')}</td><td class="d">${formatarMoeda(m.valor)}</td></tr>`).join('');
  pdvAbrirImpressao('Fechamento de caixa #' + caixa.id, `
    <h3>${escapeHtml(e.nome_fantasia || e.razao_social || 'PAPTECH')}</h3>
    <h4>FECHAMENTO DE CAIXA #${caixa.id}</h4><hr>
    <div>Abertura: ${pdvFormatarDataHora(caixa.aberto_em)} (${escapeHtml(caixa.aberto_por || '-')})<br>
    Fechamento: ${pdvFormatarDataHora(caixa.fechado_em)} (${escapeHtml(caixa.fechado_por || '-')})</div><hr>
    ${pdvTabelaResumoHtml(caixa, r)}
    ${movs ? `<hr><strong>Movimentos</strong><table>${movs}</table>` : ''}<hr>
    <table><tr><td>Dinheiro contado</td><td class="d">${formatarMoeda(caixa.dinheiro_contado)}</td></tr>
    <tr><td><strong>Diferença</strong></td><td class="d"><strong>${formatarMoeda(caixa.diferenca)}</strong></td></tr></table>`);
}

function pdvAbrirHistoricoCaixas() {
  const fechados = loadList('caixas').filter(c => c.status === 'fechado').reverse();
  abrirModal(`
    <h3>Caixas anteriores</h3>
    <table class="tabela" style="width:100%"><thead><tr><th>#</th><th>Abertura</th><th>Fechamento</th><th>Vendas</th><th>Diferença</th><th></th></tr></thead><tbody>
    ${fechados.map(c => `<tr><td>${c.id}</td><td>${pdvFormatarDataHora(c.aberto_em)}</td><td>${pdvFormatarDataHora(c.fechado_em)}</td>
      <td>${formatarMoeda((c.resumo || {}).totalVendas)}</td><td>${formatarMoeda(c.diferenca)}</td>
      <td><button onclick="pdvImprimirRelatorioCaixa(${c.id})">🖨️</button></td></tr>`).join('') || '<tr><td colspan="6">Nenhum caixa fechado ainda.</td></tr>'}
    </tbody></table><button class="btn-secondary" onclick="fecharModal()">Fechar</button>`);

function reverterEstoqueVenda(itens) {
  const produtos = loadList('produtos');
  let alterou = false;
  itens.forEach(item => {
    if (!item.produto_id) return;
    const produto = produtos.find(p => p.id === item.produto_id);
    if (!produto) return;
    if (produto.baixa_automatica === false) return;
    produto.estoque_atual = (Number(produto.estoque_atual) || 0) + (Number(item.quantidade) || 0);
    alterou = true;
  });
  if (alterou) saveList('produtos', produtos);
}

function removerContasReceberDaVenda(vendaId) {
  const contas = loadList('contas_receber').filter(c => c.venda_id !== vendaId);
  saveList('contas_receber', contas);
}

function aplicarBaixaEstoqueVenda(itens) {
  const produtos = loadList('produtos');
  let alterou = false;
  itens.forEach(item => {
    if (!item.produto_id) return;
    const produto = produtos.find(p => p.id === item.produto_id);
    if (!produto) return;
    if (produto.baixa_automatica === false) return;
    produto.estoque_atual = (Number(produto.estoque_atual) || 0) - (Number(item.quantidade) || 0);
    alterou = true;
  });
  if (alterou) saveList('produtos', produtos);
}

function aplicarEntradaEstoqueCompra(itens) {
  const produtos = loadList('produtos');
  let alterou = false;
  itens.forEach(item => {
    if (!item.produto_id) return;
    const produto = produtos.find(p => p.id === item.produto_id);
    if (!produto) return;
    produto.estoque_atual = (Number(produto.estoque_atual) || 0) + (Number(item.quantidade) || 0);
    alterou = true;
  });
  if (alterou) saveList('produtos', produtos);
}
