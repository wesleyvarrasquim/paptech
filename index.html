<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPTECH - Gestão Comercial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg-app-1: #FFFFFF;
    --bg-app-2: #F2F7F2;
    --painel: #FFFFFF;
    --painel-solido: #FFFFFF;
    --borda: #DCE6DC;
    --texto: #1E2A20;
    --texto-suave: #5E6F60;
    --accent: #2E7D32;
    --accent-2: #1B5E20;
    --accent-glow: rgba(46,125,50,0.18);
    --perigo: #C62828;
    --alerta: #B8860B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(46,125,50,0.04), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(27,94,32,0.03), transparent 40%),
      linear-gradient(180deg, var(--bg-app-1), var(--bg-app-2));
    background-attachment: fixed;
    color: var(--texto);
    min-height: 100vh;
  }
  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  .marca-dagua {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: min(440px, 55vw) auto;
    opacity: 0.06;
  }
  .logo-preview { max-width: 220px; max-height: 120px; display: block; margin: 10px 0; border-radius: 8px; background: rgba(0,0,0,0.04); padding: 8px; }
  .totais-relatorio { margin-top: 14px; text-align: right; font-size: 15px; color: var(--accent-2); }

  .sidebar { width: 290px; display: flex; flex-direction: column; gap: 8px; padding: 22px 14px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; background: #F7FBF7; border-right: 1px solid var(--borda); overflow-y: auto; }
  .sidebar .logo { color: var(--accent-2); font-size: 20px; font-weight: 800; text-align: center; padding: 4px 0 16px; letter-spacing: 3px; }
  .sidebar .logo span { color: var(--accent); }
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .nav-btn {
    background: #FFFFFF;
    border: 1px solid var(--borda);
    color: var(--texto-suave);
    text-align: left;
    padding: 9px 10px;
    font-size: 12px;
    line-height: 1.2;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .nav-btn .icone { font-size: 16px; line-height: 1; }
  .nav-btn:hover { background: rgba(46,125,50,0.08); border-color: var(--accent); color: var(--accent-2); transform: translateY(-2px); }
  .nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px rgba(46,125,50,0.35);
  }

  .content { flex: 1; padding: 30px 36px; overflow-x: auto; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-header h1 { color: var(--texto); margin: 0; font-size: 23px; }
  .header-botoes { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn-primary { background: var(--accent); color: #fff; border: none; padding: 11px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 8px rgba(46,125,50,0.3); }
  .btn-primary:hover { background: var(--accent-2); box-shadow: 0 4px 14px rgba(46,125,50,0.4); }
  .btn-secondary { background: #FFFFFF; color: var(--accent-2); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 12px; cursor: pointer; }
  .btn-secondary:hover { background: rgba(46,125,50,0.08); color: var(--accent-2); }
  .file-label { display: inline-block; }

  .data-table { width: 100%; border-collapse: collapse; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
  .data-table th, .data-table td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--borda); font-size: 13.5px; }
  .data-table th { background: #F0F6F0; color: var(--accent-2); text-transform: uppercase; font-size: 11.5px; letter-spacing: .6px; }
  .data-table tr:hover td { background: rgba(46,125,50,0.05); }
  .data-table tr.linha-clicavel { cursor: pointer; }
  .tags-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 10px; }
  .tag-similar { display: inline-flex; align-items: center; gap: 6px; background: rgba(46,125,50,0.1); border: 1px solid rgba(46,125,50,0.35); color: var(--accent-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
  .tag-similar button { background: none; border: none; color: var(--accent-2); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .tag-similar button:hover { color: var(--perigo); }
  .data-table .acoes button, .data-table .acoes label.acao-label { background: none; border: none; cursor: pointer; font-size: 15px; margin-right: 6px; color: var(--texto-suave); display: inline-block; }
  .data-table .acoes button:hover, .data-table .acoes label.acao-label:hover { color: var(--accent); }
  .vazio { text-align: center; color: var(--texto-suave); padding: 20px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,30,20,0.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal { background: #FFFFFF; border: 1px solid var(--borda); box-shadow: 0 10px 40px rgba(0,0,0,0.18); border-radius: 16px; padding: 26px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; color: var(--texto); }
  .modal h2 { color: var(--accent-2); margin-top: 0; }
  .modal.modal-largo { max-width: 920px; }

  .produto-modal-layout { display: flex; gap: 22px; align-items: flex-start; }
  .produto-modal-principal { flex: 1; min-width: 0; }
  .produto-foto-painel { width: 220px; flex-shrink: 0; position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; }
  .produto-foto-painel label { font-size: 12.5px; color: var(--texto-suave); }
  .produto-foto-preview-wrap { width: 100%; aspect-ratio: 1; border: 1px solid var(--borda); border-radius: 12px; background: #F7FBF7; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .produto-foto-preview { width: 100%; height: 100%; object-fit: cover; }
  .produto-foto-placeholder { color: var(--texto-suave); font-size: 12.5px; text-align: center; padding: 10px; }
  .produto-foto-botao { width: 100%; }

  .tela-login { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 20%, rgba(46,125,50,0.08), transparent 55%), linear-gradient(135deg, #F2F7F2, #FFFFFF); padding: 20px; }
  .login-card { background: #FFFFFF; border: 1px solid var(--borda); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
  .login-logo { font-size: 26px; font-weight: 800; text-align: center; color: var(--texto); margin-bottom: 4px; }
  .login-logo span { color: var(--accent); }
  .login-subtitulo { text-align: center; color: var(--texto-suave); font-size: 13px; margin-bottom: 22px; }
  .login-erro { color: var(--perigo); font-size: 13px; min-height: 18px; margin: 4px 0 8px; text-align: center; }
  .login-botao { width: 100%; margin-top: 6px; }
  .login-dica { margin-top: 16px; font-size: 11.5px; color: var(--texto-suave); text-align: center; }

  .sidebar-usuario-info { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--borda); font-size: 12.5px; }
  .sidebar-usuario-info .usuario-nome { color: var(--texto); font-weight: 600; margin-bottom: 2px; }
  .sidebar-usuario-info .usuario-nivel { color: var(--texto-suave); font-weight: 400; font-size: 11px; display: block; margin-bottom: 8px; }
  .sidebar-usuario-info .btn-sair { width: 100%; background: #FFFFFF; border: 1px solid var(--perigo); color: var(--perigo); border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .sidebar-usuario-info .btn-sair:hover { background: var(--perigo); color: #fff; }

  .indicador-sync { margin-top: 10px; font-size: 11.5px; text-align: center; padding: 5px 8px; border-radius: 8px; }
  .indicador-sync.sync-ok { background: rgba(46,125,50,0.1); color: var(--accent-2); }
  .indicador-sync.sync-erro { background: rgba(184,134,11,0.12); color: #8A6400; }
  .indicador-sync.sync-off { background: rgba(0,0,0,0.04); color: var(--texto-suave); }

  .tela-carregando { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, #F2F7F2, #FFFFFF); }
  .tela-carregando .spinner { width: 34px; height: 34px; border: 4px solid var(--borda); border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite; }
  .tela-carregando .texto { color: var(--texto-suave); font-size: 13.5px; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .permissoes-grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin: 6px 0 14px; }
  .permissao-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--texto); }
  .permissao-item input { width: auto; }

  .campo { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 12.5px; color: var(--texto-suave); }
  .campo input, .campo select, .campo textarea { padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; font-size: 14px; width: 100%; background: #FFFFFF; color: var(--texto); font-family: inherit; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
  .campo textarea { resize: vertical; }
  .campo-linha { display: flex; gap: 8px; }
  .campo-linha input { flex: 1; }
  .campo-checkbox label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto); }
  .campo-checkbox input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .modal-botoes { display: flex; gap: 10px; margin-top: 16px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--borda); }
  .tab-btn { background: none; border: none; padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--texto-suave); border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
  .valor-calculado { font-weight: bold; color: var(--accent-2); padding: 8px 0; font-size: 16px; }

  .item-fieldset { border: 1px solid var(--borda); background: #FAFCFA; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .item-fieldset legend { padding: 0 6px; color: var(--texto-suave); font-size: 13px; }
  .info-cliente-caixa { background: #F5F9F5; border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--texto-suave); line-height: 1.7; margin-bottom: 14px; }
  .info-cliente-caixa strong { color: var(--texto); }
  .item-linha { display: flex; gap: 8px; flex-wrap: wrap; }
  .item-linha select, .item-linha input { padding: 8px; border: 1px solid var(--borda); border-radius: 8px; background: #FFFFFF; color: var(--texto); }
  .item-linha select { flex: 2; min-width: 150px; }
  .item-linha input { flex: 1; min-width: 80px; }

  .aviso { background: #FFF6DE; border: 1px solid #EBCB78; color: #7A5B00; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }

  .resumo-total { margin-bottom: 16px; font-size: 14px; color: var(--texto); background: var(--painel); border: 1px solid var(--borda); padding: 10px 16px; border-radius: 10px; display: inline-block; }  .resumo-total strong { color: var(--accent-2); }
  .filtro-periodo-caixa { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .filtro-periodo-caixa .campo { margin-bottom: 0; min-width: 160px; }
  .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: bold; display: inline-block; white-space: nowrap; }
  .status-pago { background: rgba(46,125,50,0.14); color: var(--accent-2); }
  .status-pendente { background: rgba(184,134,11,0.14); color: #8A6400; }
  .status-vencido { background: rgba(198,40,40,0.12); color: var(--perigo); }

  .autocomplete-wrap { position: relative; }
  .autocomplete-lista { position: absolute; top: 100%; left: 0; right: 0; background: #FFFFFF; border: 1px solid var(--borda); border-top: none; max-height: 190px; overflow-y: auto; z-index: 10; border-radius: 0 0 8px 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
  .autocomplete-item { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--borda); color: var(--texto); }
  .autocomplete-item:hover { background: rgba(46,125,50,0.08); }
  .autocomplete-item small { color: var(--texto-suave); display: block; margin-top: 2px; }
  .autocomplete-vazio { padding: 8px 10px; color: var(--texto-suave); font-size: 13px; }
  .produto-selecionado-info { background: rgba(46,125,50,0.1); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: var(--accent-2); font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .produto-selecionado-info button { background: none; border: none; cursor: pointer; color: var(--accent-2); font-size: 15px; }

  .campo.busca-produtos { max-width: 460px; margin-bottom: 18px; }

  .acoes-conta { white-space: nowrap; }
  .acoes-conta button { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-right: 6px; background: #F0F6F0; }
  .btn-baixa { border: 1px solid var(--accent); color: var(--accent-2); }
  .btn-baixa:hover { background: rgba(46,125,50,0.14); }
  .btn-excluir { border: 1px solid var(--perigo); color: var(--perigo); }
  .btn-excluir:hover { background: rgba(198,40,40,0.1); color: var(--perigo); }

  .dashboard-logo-painel { display: flex; align-items: center; justify-content: center; background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 22px; margin-bottom: 22px; min-height: 110px; }
  .dashboard-logo-painel-cheio { min-height: calc(100vh - 60px); }
  .dashboard-logo-img { max-height: min(60vh, 420px); max-width: 90%; object-fit: contain; }
  .dashboard-logo-vazio { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--texto-suave); font-size: 15px; text-align: center; }
  .dashboard-logo-icone { font-size: 46px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi-card { position: relative; overflow: hidden; background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 18px 20px; }
  .kpi-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top right, rgba(46,125,50,0.06), transparent 60%); pointer-events: none; }
  .kpi-icone { font-size: 22px; }
  .kpi-valor { font-size: 23px; font-weight: 800; color: var(--texto); margin-top: 10px; }
  .kpi-label { font-size: 11.5px; color: var(--texto-suave); margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; }
  .kpi-card.kpi-destaque { border-color: var(--accent); box-shadow: 0 2px 14px rgba(46,125,50,0.18); }
  .kpi-card.kpi-verde .kpi-valor { color: var(--accent); }
  .kpi-card.kpi-alerta .kpi-valor { color: #8A6400; }
  .kpi-card.kpi-perigo { border-color: var(--perigo); }
  .kpi-card.kpi-perigo .kpi-valor { color: var(--perigo); }

  .dashboard-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .dashboard-painel h2 { font-size: 15px; color: var(--texto); margin-bottom: 10px; font-weight: 700; }

  .launcher-titulo { font-size: 13px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 12px; }
  .launcher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .launcher-tile {
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 18px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    color: var(--texto);
  }
  .launcher-tile:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 4px 16px rgba(46,125,50,0.18); }
  .launcher-tile .launcher-icone { font-size: 26px; }
  .launcher-tile .launcher-label { font-size: 12.5px; text-align: center; color: var(--texto); font-weight: 600; }

  .calculadora-caixa { max-width: 300px; background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 18px; }
  .calculadora-visor { background: #F0F6F0; border-radius: 10px; padding: 16px; text-align: right; font-size: 28px; font-weight: 700; color: var(--accent-2); margin-bottom: 14px; word-break: break-all; }
  .calculadora-teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tecla-calc { padding: 14px 0; font-size: 16px; border-radius: 10px; border: 1px solid var(--borda); background: #FFFFFF; color: var(--texto); cursor: pointer; }
  .tecla-calc:hover { border-color: var(--accent); color: var(--accent-2); }

  .backup-caixa { max-width: 520px; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
  .backup-caixa h2 { font-size: 15px; color: var(--texto); margin: 0 0 8px; }
  .backup-caixa p { font-size: 13px; color: var(--texto-suave); margin: 0 0 12px; line-height: 1.5; }

  @media (max-width: 900px) {
    .dashboard-colunas { grid-template-columns: 1fr; }
  }

  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: visible; height: auto; position: static; padding: 14px; }
    .sidebar .logo { padding: 6px 14px; white-space: nowrap; }
    .nav-grid { display: contents; }
    .nav-btn { flex-direction: row; padding: 12px 14px; white-space: nowrap; }
    .content { padding: 18px; }
    .produto-modal-layout { flex-direction: column; }
    .produto-foto-painel { width: 100%; position: static; }
  }
</style>
</head>
<body>

<div id="marca-dagua-fundo" class="marca-dagua"></div>

<div id="tela-carregando" class="tela-carregando">
  <div class="spinner"></div>
  <div class="texto">Sincronizando dados...</div>
</div>

<div id="tela-login" class="tela-login" style="display:none">
  <form class="login-card" onsubmit="return tentarLogin(event)">
    <div class="login-logo">PAP<span>TECH</span></div>
    <p class="login-subtitulo">Acesse com seu usuário e senha</p>
    <div class="campo">
      <label>Usuário</label>
      <input type="text" id="login-usuario" autocomplete="username" required>
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" required>
    </div>
    <div id="login-erro" class="login-erro"></div>
    <button type="submit" class="btn-primary login-botao">Entrar</button>
    <p class="login-dica">Acesso padrão inicial: usuário <strong>admin</strong>, senha <strong>admin</strong>. Troque a senha em Configurações.</p>
  </form>
</div>

<div class="app" id="app-principal" style="display:none">
  <nav class="sidebar">
    <div class="logo">PAP<span>TECH</span></div>
    <div class="nav-grid">
      <button class="nav-btn active" data-section="dashboard"><span class="icone">📊</span>Dashboard</button>
      <button class="nav-btn" data-section="clientes"><span class="icone">🧑‍🔧</span>Clientes</button>
      <button class="nav-btn" data-section="fornecedores"><span class="icone">🏭</span>Fornecedores</button>
      <button class="nav-btn" data-section="transportadoras"><span class="icone">🚚</span>Transportadoras</button>
      <button class="nav-btn" data-section="produtos"><span class="icone">⚙️</span>Produtos</button>
      <button class="nav-btn" data-section="compras"><span class="icone">📦</span>Compras</button>
      <button class="nav-btn" data-section="vendas"><span class="icone">🧾</span>Vendas</button>
      <button class="nav-btn" data-section="contas-receber"><span class="icone">📥</span>Contas a Receber</button>
      <button class="nav-btn" data-section="contas-pagar"><span class="icone">📤</span>Contas a Pagar</button>
      <button class="nav-btn" data-section="cobranca"><span class="icone">☎️</span>Cobrança</button>

<script>
/* =========================================================
   PAPTECH - Sistema de Gestao Comercial (versao HTML)
   Todos os dados ficam salvos no localStorage do navegador,
   ou seja, ficam gravados neste computador/navegador.
   (Os nomes internos de armazenamento continuam com o
   prefixo "westech_" de propósito, para não perder os dados
   de quem já vinha usando o sistema antes da troca de nome.)
   ========================================================= */

const STORAGE_KEYS = {
  clientes: 'westech_clientes',
  fornecedores: 'westech_fornecedores',
  transportadoras: 'westech_transportadoras',
  produtos: 'westech_produtos',
  compras: 'westech_compras',
  vendas: 'westech_vendas',
  contas_receber: 'westech_contas_receber',

  vendedores: 'westech_vendedores',
  configuracoes: 'westech_configuracoes',
  usuarios: 'westech_usuarios',
};

/* Seções que podem ter acesso liberado/bloqueado por usuário.
   "dashboard" não entra aqui: todo usuário logado pode ver o Dashboard. */
const SECOES_PERMISSAO = [
  ['clientes', 'Clientes'],
  ['fornecedores', 'Fornecedores'],
  ['transportadoras', 'Transportadoras'],
  ['produtos', 'Produtos'],

  ['calculadora', 'Calculadora'],
  ['backup', 'Backup / Restauração'],
  ['configuracoes', 'Configurações'],
];
const CHAVE_SESSAO_USUARIO = 'westech_sessao_usuario_id';

/* ---------- banco de dados online (Supabase) ---------- */
/* Preencha estes dois valores com os dados do seu projeto Supabase
   (Project Settings -> API: "Project URL" e a chave "anon public").
   Enquanto estiverem em branco, o sistema funciona normalmente, só que
   100% local (como antes), sem compartilhar dados entre computadores. */
const SUPABASE_URL = 'https://cyvnsnebgumnbgfdapit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5dm5zbmViZ3VtbmJnZmRhcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzgyOTEsImV4cCI6MjEwNjQ1NDI5MX0.pojOH9crgsCJioR-DoMACmyxfjvdG0O_O_LCyl3JwD0';

const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function nuvemConfigurada() {
  return !!supabaseClient;
}

function atualizarIndicadorSync(status, mensagem) {
  const el = document.getElementById('indicador-sync');
  if (!el) return;
  el.className = 'indicador-sync ' + (status === 'ok' ? 'sync-ok' : status === 'erro' ? 'sync-erro' : 'sync-off');
  const textos = {
    ok: '☁ Sincronizado',
    erro: '⚠ Sem conexão com a nuvem',
    off: '☁ Somente local (nuvem não configurada)',
  };
  el.textContent = mensagem || textos[status] || '';
}

/* Busca TODAS as coleções na nuvem de uma vez e sobrescreve o localStorage
   local com o que estiver lá — a nuvem passa a ser a fonte da verdade.
   Chamado uma vez, ao abrir a página, antes de decidir login/painel. */
async function sincronizarComNuvem() {
  if (!nuvemConfigurada()) {
    atualizarIndicadorSync('off');
    return;
  }
  try {
    const { data, error } = await supabaseClient.from('registros').select('colecao, dados');
    if (error) throw error;

    const porColecao = {};
    Object.keys(STORAGE_KEYS).forEach(chave => { porColecao[chave] = []; });
    (data || []).forEach(linha => {
      if (porColecao[linha.colecao]) porColecao[linha.colecao].push(linha.dados);
    });
    Object.keys(porColecao).forEach(chave => {
      localStorage.setItem(STORAGE_KEYS[chave], JSON.stringify(porColecao[chave]));
    });
    atualizarIndicadorSync('ok');
  } catch (erro) {
    console.warn('Não foi possível sincronizar com a nuvem, usando dados locais:', erro);
    atualizarIndicadorSync('erro');
  }
}

/* Envia uma coleção inteira para a nuvem: grava/atualiza cada item da lista
   e apaga da nuvem qualquer item que não esteja mais nela (mesmo padrão de
   "substituir o array inteiro" que o resto do app já usa). Roda em segundo
   plano, sem travar a tela — se falhar, só avisa, não desfaz o salvamento
   local (que já aconteceu antes desta chamada). */
async function enviarParaNuvem(chave, lista) {
  if (!nuvemConfigurada()) return;
  try {
    const linhas = lista.filter(item => item && item.id != null).map(item => ({
      colecao: chave,
      registro_id: item.id,
      dados: item,
    }));

    if (linhas.length) {
      const { error: erroUpsert } = await supabaseClient
        .from('registros')
        .upsert(linhas, { onConflict: 'colecao,registro_id' });
      if (erroUpsert) throw erroUpsert;
    }

    const idsAtuais = lista.map(item => item.id).filter(id => id != null);
    let queryDelete = supabaseClient.from('registros').delete().eq('colecao', chave);
    queryDelete = idsAtuais.length ? queryDelete.not('registro_id', 'in', `(${idsAtuais.join(',')})` ) : queryDelete;
    const { error: erroDelete } = await queryDelete;
    if (erroDelete) throw erroDelete;

    atualizarIndicadorSync('ok');
  } catch (erro) {
    console.warn(`Não foi possível enviar "${chave}" para a nuvem:`, erro);
    atualizarIndicadorSync('erro');
  }
}

let itensCompraTemp = [];
let itensVendaTemp = [];
let produtoSelecionadoVenda = null;
let produtoSelecionadoCompra = null;
let produtoSelecionadoMovimento = null;
let similaresProdutoTemp = [];
let fotoProdutoTemp = null;
let filtroContasTemp = { receber: { inicio: '', fim: '' }, pagar: { inicio: '', fim: '' } };

/* ---------- utilidades gerais ---------- */

function loadList(chave) {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEYS[chave]) || '[]');
  } catch (e) {
    return [];
  }
}

function saveList(chave, lista) {
  localStorage.setItem(STORAGE_KEYS[chave], JSON.stringify(lista));
  // Envia para a nuvem em segundo plano (não espera/bloqueia a tela).
  enviarParaNuvem(chave, lista);
}

function nextId(lista) {
  return lista.length ? Math.max(...lista.map(x => x.id)) + 1 : 1;
}

function gerarCodigoInternoAleatorio() {
  const existentes = new Set(loadList('produtos').map(p => (p.cod_interno || '').trim()));
  let codigo;
  do {
    // 8 dígitos (0-99999999), sempre com zeros à esquerda para manter o tamanho fixo.
    codigo = String(Math.floor(Math.random() * 100000000)).padStart(8, '0');
  } while (existentes.has(codigo));
  return codigo;
}

function escapeHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function numeroBr(valor) {
  const n = parseFloat(String(valor ?? '0').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function formatarMoeda(valor) {
  return 'R$ ' + (Number(valor) || 0).toFixed(2).replace('.', ',');
}

function formatarDataBr(data) {
  if (!data) return '-';
  const partes = data.split('-');
  if (partes.length !== 3) return data;
  const [ano, mes, dia] = partes;
  return `${dia}/${mes}/${ano}`;
}

/* ---------- modal ---------- */

function abrirModal(html, classeExtra) {
  const caixa = document.getElementById('modal-box');

document.getElementById('modal-overlay').addEventListener('click', function (e) {

});

/* ---------- login / usuarios / controle de acesso ---------- */

function permissoesTotais() {
  const permissoes = {};
  SECOES_PERMISSAO.forEach(([chave]) => { permissoes[chave] = true; });
  return permissoes;
}

function permissoesVazias() {
  const permissoes = {};
  SECOES_PERMISSAO.forEach(([chave]) => { permissoes[chave] = false; });
  return permissoes;
}

/* Garante que exista ao menos um usuário Administrador, para nunca travar o acesso
   ao sistema (ex.: primeira vez que o sistema é aberto neste navegador). */
function inicializarUsuariosPadrao() {
  const lista = loadList('usuarios');
  if (lista.length === 0) {
    saveList('usuarios', [{
      id: 1,
      nome: 'Administrador',
      login: 'admin',
      senha: 'admin',
      nivel: 'Administrador',
      status: 'Ativo',
      permissoes: permissoesTotais(),
    }]);
  }
}

function usuarioLogado() {
  const id = Number(localStorage.getItem(CHAVE_SESSAO_USUARIO));
  if (!id) return null;
  const usuario = loadList('usuarios').find(u => u.id === id);
  if (!usuario || usuario.status === 'Inativo') return null;
  return usuario;
}

function temPermissao(secao) {
  if (secao === 'dashboard') return true;
  const usuario = usuarioLogado();
  if (!usuario) return false;
  if (usuario.nivel === 'Administrador') return true;
  return !!(usuario.permissoes && usuario.permissoes[secao]);
}

function mostrarTelaLogin(mensagemErro) {
  document.getElementById('app-principal').style.display = 'none';
  const tela = document.getElementById('tela-login');
  tela.style.display = 'flex';
  document.getElementById('login-erro').textContent = mensagemErro || '';
  const campoUsuario = document.getElementById('login-usuario');
  const campoSenha = document.getElementById('login-senha');
  campoUsuario.value = '';
  campoSenha.value = '';
  setTimeout(() => campoUsuario.focus(), 50);
}

function ocultarTelaLogin() {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app-principal').style.display = 'flex';
}

function tentarLogin(event) {
  event.preventDefault();
  const login = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const usuario = loadList('usuarios').find(u => (u.login || '').toLowerCase() === login.toLowerCase());

  if (!usuario || usuario.senha !== senha) {
    document.getElementById('login-erro').textContent = 'Usuário ou senha incorretos.';
    return false;
  }
  if (usuario.status === 'Inativo') {
    document.getElementById('login-erro').textContent = 'Este usuário está inativo. Fale com um administrador.';
    return false;
  }

  localStorage.setItem(CHAVE_SESSAO_USUARIO, String(usuario.id));
  ocultarTelaLogin();
  iniciarAppLogado();
  return false;
}

function fazerLogout() {
  localStorage.removeItem(CHAVE_SESSAO_USUARIO);
  mostrarTelaLogin();
}

/* Mostra/esconde os botões do menu lateral de acordo com as permissões
   do usuário logado, e exibe o nome dele + botão de sair. */
function aplicarPermissoesNaTela() {
  const usuario = usuarioLogado();
  if (!usuario) return;

  document.querySelectorAll('.nav-btn[data-section]').forEach(botao => {
    const secao = botao.dataset.section;
    botao.style.display = temPermissao(secao) ? '' : 'none';
  });

  const infoEl = document.getElementById('sidebar-usuario-info');
  if (infoEl) {
    infoEl.innerHTML = `
      <span class="usuario-nome">${escapeHtml(usuario.nome)}</span>
      <span class="usuario-nivel">${escapeHtml(usuario.nivel)}</span>
      <button type="button" class="btn-sair" onclick="fazerLogout()">Sair</button>
    `;
  }
}

function iniciarAppLogado() {
  aplicarPermissoesNaTela();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const botaoDashboard = document.querySelector('.nav-btn[data-section="dashboard"]');
  if (botaoDashboard) botaoDashboard.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.getElementById('sec-dashboard').style.display = 'block';
  renderDashboard();
}

/* ---------- navegacao ---------- */

function renderSecao(secao) {
  if (secao === 'dashboard') renderDashboard();
  else if (secao === 'clientes') renderPessoaSection('clientes');
  else if (secao === 'fornecedores') renderPessoaSection('fornecedores');
  else if (secao === 'transportadoras') renderPessoaSection('transportadoras');
  else if (secao === 'produtos') renderProdutos();
  else if (secao === 'compras') renderCompras();
  else if (secao === 'vendas') renderVendas();
  else if (secao === 'contas-receber') renderContas('receber');

  else if (secao === 'cobranca') renderCobranca();
  else if (secao === 'calendario') renderCalendarioFinanceiro();
  else if (secao === 'calculadora') renderCalculadora();
  else if (secao === 'backup') renderBackup();

/* Navega para uma seção a partir de um atalho fora da barra lateral
   (ex.: os cartões do Dashboard), mantendo o botão certo destacado. */
function irParaSecao(secao) {
  if (!temPermissao(secao)) {
    alert('Você não tem permissão para acessar esta área.');
    return;
  }
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const botao = document.querySelector(`.nav-btn[data-section="${secao}"]`);

  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');

document.querySelectorAll('.nav-btn').forEach(botao => {
  botao.addEventListener('click', () => {

    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  });
});

/* ---------- CLIENTES / FORNECEDORES (telas identicas) ---------- */

const CAMPOS_PESSOA = [
  ['razao_social', 'Razão Social *'],
  ['nome_fantasia', 'Nome Fantasia'],
  ['cnpj', 'CNPJ'],
  ['inscricao_estadual', 'Inscrição Estadual'],
  ['cep', 'CEP'],
  ['endereco', 'Endereço'],
  ['numero', 'Número'],
  ['bairro', 'Bairro'],
  ['cidade', 'Cidade'],
  ['uf', 'UF'],
  ['telefone', 'Telefone'],
  ['email', 'E-mail'],
];

const TITULOS_PESSOA = { clientes: 'Clientes', fornecedores: 'Fornecedores', transportadoras: 'Transportadoras' };
const SINGULAR_PESSOA = { clientes: 'Cliente', fornecedores: 'Fornecedor', transportadoras: 'Transportadora' };

function filtrarPessoasPorTermo(lista, termoBusca) {
  const fragmentos = normalizarTextoBusca(termoBusca)
    .split('*')
    .map(f => f.trim())
    .filter(Boolean);

  if (!fragmentos.length) return lista;

  return lista.filter(p => {
    const alvo = normalizarTextoBusca([
      p.razao_social || '',
      p.nome_fantasia || '',
      p.cnpj || '',
    ].join(' '));
    return fragmentos.every(frag => alvo.includes(frag));
  });
}

function renderPessoaSection(tipo) {
  const titulo = TITULOS_PESSOA[tipo];
  const singular = SINGULAR_PESSOA[tipo];
  const container = document.getElementById('sec-' + tipo);
  const buscaAtual = buscaPessoaTemp[tipo];

  container.innerHTML = `
    <div class="section-header">
      <h1>${titulo}</h1>
      <button class="btn-primary" onclick="abrirFormPessoa('${tipo}')">+ Cadastrar ${singular}</button>
    </div>
    <div class="campo busca-produtos">
      <label>Pesquisar por nome, CNPJ ou CPF (use * para separar trechos, ex: silva*0001)</label>
      <input type="text" id="busca-${tipo}" placeholder="Digite para buscar..." value="${escapeHtml(buscaAtual)}" oninput="onBuscaPessoaInput('${tipo}')" autocomplete="off">
    </div>
    <table class="data-table">
      <thead>
        <tr><th>Razão Social</th><th>CNPJ</th><th>Inscrição Estadual</th><th>Cidade</th><th>UF</th><th>Telefone</th><th></th></tr>
      </thead>
      <tbody id="${tipo}-tbody"></tbody>
    </table>
  `;
  atualizarTabelaPessoas(tipo);
}

function onBuscaPessoaInput(tipo) {
  buscaPessoaTemp[tipo] = document.getElementById(`busca-${tipo}`).value;
  atualizarTabelaPessoas(tipo);
}

function atualizarTabelaPessoas(tipo) {
  const todos = loadList(tipo);
  const lista = filtrarPessoasPorTermo(todos, buscaPessoaTemp[tipo]);
  const tbody = document.getElementById(`${tipo}-tbody`);
  if (!tbody) return;

  const linhas = lista.map(p => `
    <tr>
      <td>${escapeHtml(p.razao_social)}</td>
      <td>${escapeHtml(p.cnpj)}</td>
      <td>${escapeHtml(p.inscricao_estadual)}</td>
      <td>${escapeHtml(p.cidade)}</td>
      <td>${escapeHtml(p.uf)}</td>
      <td>${escapeHtml(p.telefone)}</td>
      <td class="acoes">
        <button onclick="abrirFormPessoa('${tipo}', ${p.id})" title="Editar">&#9998;</button>
        <button onclick="excluirPessoa('${tipo}', ${p.id})" title="Excluir">&#128465;</button>
      </td>
    </tr>
  `).join('');

  const mensagemVazio = todos.length
    ? 'Nenhum registro encontrado para essa busca.'
    : 'Nenhum registro cadastrado.';
  tbody.innerHTML = linhas || `<tr><td colspan="7" class="vazio">${mensagemVazio}</td></tr>`;
}

function abrirFormPessoa(tipo, id) {
  const lista = loadList(tipo);
  const registro = id ? lista.find(p => p.id === id) : null;
  const singular = SINGULAR_PESSOA[tipo];

  const camposHtml = CAMPOS_PESSOA.map(([chave, rotulo]) => {
    const valor = registro ? (registro[chave] || '') : '';
    const botaoBuscar = chave === 'cep'
      ? `<button type="button" class="btn-secondary" onclick="buscarCepForm()">Buscar</button>`
      : '';
    return `
      <div class="campo">
        <label>${rotulo}</label>
        <div class="campo-linha">
          <input type="text" id="campo-${chave}" value="${escapeHtml(valor)}">
          ${botaoBuscar}
        </div>
      </div>
    `;
  }).join('');

  abrirModal(`
    <h2>${registro ? 'Editar' : 'Cadastrar'} ${singular}</h2>
    <form id="form-pessoa" onsubmit="return salvarPessoa(event, '${tipo}', ${id || 'null'})">
      ${camposHtml}
      <div class="modal-botoes">
        <button type="submit" class="btn-primary">Salvar</button>
        <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      </div>
    </form>
  `);
}

async function buscarCepForm() {
  const cepInput = document.getElementById('campo-cep');
  const cep = (cepInput.value || '').replace(/\D/g, '');
  if (cep.length !== 8) {
    alert('Digite um CEP válido com 8 dígitos.');
    return;
  }
  try {
    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const dados = await resposta.json();
    if (dados.erro) {
      alert('CEP não encontrado.');
      return;
    }
    document.getElementById('campo-endereco').value = dados.logradouro || '';
    document.getElementById('campo-bairro').value = dados.bairro || '';
    document.getElementById('campo-cidade').value = dados.localidade || '';
    document.getElementById('campo-uf').value = dados.uf || '';
  } catch (erro) {
    alert('Não foi possível consultar o CEP. Verifique sua conexão com a internet.');
  }
}

function salvarPessoa(event, tipo, id) {
  event.preventDefault();
  const dados = {};
  CAMPOS_PESSOA.forEach(([chave]) => {
    dados[chave] = document.getElementById('campo-' + chave).value.trim();
  });
  if (!dados.razao_social) {
    alert('Informe a Razão Social.');
    return false;
  }

  const lista = loadList(tipo);
  if (id) {
    const idx = lista.findIndex(p => p.id === id);
    lista[idx] = { ...lista[idx], ...dados };
  } else {
    dados.id = nextId(lista);
    lista.push(dados);
  }
  saveList(tipo, lista);
  fecharModal();
  renderPessoaSection(tipo);
  return false;
}

function excluirPessoa(tipo, id) {
  if (!confirm('Deseja realmente excluir este registro?')) return;
  const lista = loadList(tipo).filter(p => p.id !== id);
  saveList(tipo, lista);
  renderPessoaSection(tipo);
}

function normalizarTextoBusca(texto) {
  return String(texto ?? '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

// C\u00f3digos similares sao guardados como lista de {codigo, marca}. Estas fun\u00e7\u00f5es tambem leem
// o formato antigo (lista simples de strings) de cadastros feitos antes dessa mudan\u00e7a.
function codigosSimilares(produto) {
  if (!produto || !Array.isArray(produto.similares)) return [];
  return produto.similares
    .map(item => (typeof item === 'string' ? item : (item && item.codigo) || ''))
    .filter(Boolean);
}

function textoSimilares(produto) {
  if (!produto || !Array.isArray(produto.similares)) return '';
  return produto.similares
    .map(item => {
      if (typeof item === 'string') return item;
      if (!item || !item.codigo) return '';
      return item.marca ? `${item.codigo} (${item.marca})` : item.codigo;
    })
    .filter(Boolean)
    .join(', ');
}

function filtrarProdutosPorTermo(produtos, termoBusca) {
  const fragmentos = normalizarTextoBusca(termoBusca)
    .split('*')
    .map(f => f.trim())
    .filter(Boolean);

  if (!fragmentos.length) return produtos;

  return produtos.filter(p => {
    const alvo = normalizarTextoBusca([
      p.cod_interno || '',
      p.cod_original || '',
      p.descricao || '',
      textoSimilares(p),
    ].join(' '));
    return fragmentos.every(frag => alvo.includes(frag));
  });
}

function estoqueBadge(p) {

    return `<span class="status-badge status-vencido">${atual} (baixo)</span>`;
  }
  return String(atual);
}

/* Redimensiona a imagem no navegador (lado maior até maxLargura, convertendo para JPEG)
   antes de guardar em base64, para não deixar o cadastro de produtos pesado demais
   com fotos em resolução de câmera/celular. */
function redimensionarImagem(arquivo, maxLargura) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maxLargura / Math.max(img.width, img.height));
        const largura = Math.round(img.width * escala);
        const altura = Math.round(img.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = largura;
        canvas.height = altura;
        canvas.getContext('2d').drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = leitor.result;
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(arquivo);
  });
}

async function previewFotoProduto(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;
  try {
    const dataUrl = await redimensionarImagem(arquivo, 900);
    fotoProdutoTemp = dataUrl;
    const preview = document.getElementById('produto-foto-preview');
    const placeholder = document.getElementById('produto-foto-placeholder');
    const botaoRemover = document.getElementById('produto-foto-botao-remover');
    preview.src = dataUrl;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
    botaoRemover.style.display = '';
  } catch (erro) {
    alert('Não foi possível ler essa imagem. Tente outro arquivo.');
  }
}

function mostrarAbaProduto(botao, idAba) {

  document.getElementById(idAba).style.display = 'block';
  botao.classList.add('active');
}

function recalcularVendaForm() {
  const custoEl = document.getElementById('campo-valor_custo');
  const margemEl = document.getElementById('campo-margem_lucro');
  const freteEl = document.getElementById('campo-frete_compra');
  const despesasEl = document.getElementById('campo-outras_despesas');
  const previewEl = document.getElementById('valor-venda-preview');
  const custoRealEl = document.getElementById('custo-real-preview');
  if (!custoEl || !margemEl || !previewEl) return;

  const custo = numeroBr(custoEl.value);
  const margem = numeroBr(margemEl.value);
  const frete = freteEl ? numeroBr(freteEl.value) : 0;
  const despesas = despesasEl ? numeroBr(despesasEl.value) : 0;
  const custoReal = custo + frete + despesas;

  if (custoRealEl) custoRealEl.textContent = formatarMoeda(custoReal);
  previewEl.textContent = formatarMoeda(custoReal * (1 + margem / 100));
}

function salvarProduto(event, id) {
  event.preventDefault();
  const dados = {};

  [...CAMPOS_PRODUTO_GERAL, ...CAMPOS_PRODUTO_IMPOSTOS, ...CAMPOS_PRODUTO_ADICIONAIS].forEach(([chave]) => {
    dados[chave] = document.getElementById('campo-' + chave).value.trim();
  });

  dados.frete_compra = document.getElementById('campo-frete_compra').value.trim();
  dados.outras_despesas = document.getElementById('campo-outras_despesas').value.trim();
  dados.estoque_minimo = document.getElementById('campo-estoque_minimo').value.trim();
  dados.estoque_maximo = document.getElementById('campo-estoque_maximo').value.trim();
  dados.baixa_automatica = document.getElementById('campo-baixa_automatica').checked;
  dados.fornecedor_principal_id = document.getElementById('campo-fornecedor_principal_id').value;
  dados.codigo_no_fornecedor = document.getElementById('campo-codigo_no_fornecedor').value.trim();
  dados.custo_fornecedor = document.getElementById('campo-custo_fornecedor').value.trim();
  dados.desc_percentual_fornecedor = document.getElementById('campo-desc_percentual_fornecedor').value.trim();
  dados.ipi_percentual_fornecedor = document.getElementById('campo-ipi_percentual_fornecedor').value.trim();
  dados.perc_aumento_fornecedor = document.getElementById('campo-perc_aumento_fornecedor').value.trim();
  dados.comentarios = document.getElementById('campo-comentarios').value.trim();

  if (!dados.descricao) {
    alert('Informe a Descrição do produto.');
    return false;
  }

  [
    'peso', 'valor_custo', 'margem_lucro', 'aliquota_icms', 'aliquota_ipi', 'aliquota_pis', 'aliquota_cofins',
    'frete_compra', 'outras_despesas', 'estoque_minimo', 'estoque_maximo', 'comissao', 'desconto_maximo',
    'custo_fornecedor', 'desc_percentual_fornecedor', 'ipi_percentual_fornecedor', 'perc_aumento_fornecedor',
  ].forEach(campo => {
    dados[campo] = numeroBr(dados[campo]);
  });

  dados.fornecedor_principal_id = dados.fornecedor_principal_id ? Number(dados.fornecedor_principal_id) : null;

  const custoReal = dados.valor_custo + dados.frete_compra + dados.outras_despesas;
  dados.valor_venda = custoReal * (1 + dados.margem_lucro / 100);

  dados.similares = similaresProdutoTemp.slice();
  dados.foto_base64 = fotoProdutoTemp || '';

  const lista = loadList('produtos');
  if (id) {
    const idx = lista.findIndex(p => p.id === id);
    lista[idx] = { ...lista[idx], ...dados };
  } else {
    dados.id = nextId(lista);
    dados.estoque_atual = 0;
    lista.push(dados);
  }
  saveList('produtos', lista);
  fecharModal();
  atualizarTabelaProdutos();
  return false;
}

function excluirProduto(id) {
  if (!confirm('Deseja realmente excluir este produto?')) return;
  const lista = loadList('produtos').filter(p => p.id !== id);
  saveList('produtos', lista);
  atualizarTabelaProdutos();
}

  if (produtoSelecionadoMovimento) {

function filtrarProdutosMovimento() {
  const campoBusca = document.getElementById('mov-busca-produto');
  const resultadosEl = document.getElementById('mov-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoMovimento && campoBusca.value !== produtoSelecionadoMovimento.descricao) {
    produtoSelecionadoMovimento = null;
    document.getElementById('mov-produto-info').style.display = 'none';
    document.getElementById('mov-historico').innerHTML = '';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoMovimento(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Estoque atual: ${Number(p.estoque_atual) || 0}</small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoMovimento(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  produtoSelecionadoMovimento = produto;

  document.getElementById('mov-busca-produto').value = produto.descricao;
  document.getElementById('mov-produto-resultados').innerHTML = '';
  document.getElementById('mov-produto-resultados').style.display = 'none';
  atualizarInfoProdutoMovimento();
}

function atualizarInfoProdutoMovimento() {
  const produto = produtoSelecionadoMovimento;
  const infoEl = document.getElementById('mov-produto-info');
  const historicoEl = document.getElementById('mov-historico');
  if (!produto || !infoEl) return;

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Produto:</strong> ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</div>
    <div><strong>Estoque Atual:</strong> ${Number(produto.estoque_atual) || 0} ${escapeHtml(produto.unidade_medida || '')}</div>
  `;

  const movimentos = loadList('movimentos_estoque')
    .filter(m => m.produto_id === produto.id)
    .slice(-5)
    .reverse();

  if (movimentos.length && historicoEl) {
    historicoEl.innerHTML = `
      <h3 style="margin-top:14px">Últimos movimentos deste produto</h3>
      <table class="data-table">
        <thead><tr><th>Data</th><th>Tipo</th><th>Qtd.</th><th>Motivo</th><th>Estoque Resultante</th></tr></thead>
        <tbody>
          ${movimentos.map(m => `
            <tr>
              <td>${formatarDataBr(m.data)}</td>
              <td>${m.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td>
              <td>${m.quantidade}</td>
              <td>${escapeHtml(m.motivo || '-')}</td>
              <td>${m.estoque_resultante}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else if (historicoEl) {
    historicoEl.innerHTML = '';
  }
}

function confirmarMovimentoEstoque() {
  if (!produtoSelecionadoMovimento) {
    alert('Busque e selecione um produto.');
    return;
  }
  const tipo = document.getElementById('mov-tipo').value;
  const quantidade = numeroBr(document.getElementById('mov-quantidade').value);
  const motivo = document.getElementById('mov-motivo').value.trim();

  if (!quantidade || quantidade <= 0) {
    alert('Informe uma quantidade válida.');
    return;
  }

  const produtos = loadList('produtos');
  const produto = produtos.find(p => p.id === produtoSelecionadoMovimento.id);
  if (!produto) return;

  const estoqueAtual = Number(produto.estoque_atual) || 0;
  if (tipo === 'saida' && quantidade > estoqueAtual) {
    if (!confirm(`A saída de ${quantidade} é maior que o estoque atual (${estoqueAtual}) e deixará o estoque negativo. Deseja continuar?`)) {
      return;
    }
  }

  produto.estoque_atual = tipo === 'entrada' ? estoqueAtual + quantidade : estoqueAtual - quantidade;
  saveList('produtos', produtos);

  const movimentos = loadList('movimentos_estoque');
  movimentos.push({
    id: nextId(movimentos),
    produto_id: produto.id,
    tipo: tipo,
    quantidade: quantidade,
    motivo: motivo,
    data: new Date().toISOString().slice(0, 10),
    estoque_resultante: produto.estoque_atual,
  });
  saveList('movimentos_estoque', movimentos);

  fecharModal();
  atualizarTabelaProdutos();
}

          <option value="Orçamento" ${tipoAtual === 'Orçamento' ? 'selected' : ''}>Orçamento (apenas cotação, não movimenta estoque)</option>
        </select>
      </div>
      <div class="campo">
        <label>Data do Pedido</label>
        <input type="date" id="compra-data" value="${registro ? registro.data_compra : new Date().toISOString().slice(0, 10)}">
      </div>
      <div class="campo">
        <label>Comprador</label>
        <input type="text" id="compra-comprador" placeholder="Nome de quem está comprando" value="${escapeHtml(registro ? (registro.comprador || '') : '')}">
      </div>
      <div class="campo">
        <label>Número do Pedido / NF</label>
        <input type="text" id="compra-numero-nf" value="${escapeHtml(registro ? (registro.numero_nf || '') : '')}">

    </div>

    <div id="aba-compra-transporte" class="tab-content" style="display:none">

        <label>Transportadora</label>
        <select id="compra-transportadora">

          ${transportadoras.map(t => `<option value="${t.id}" ${registro && Number(registro.transportadora_id) === t.id ? 'selected' : ''}>${escapeHtml(t.razao_social)}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label>Aos Cuidados de</label>
        <input type="text" id="compra-aos-cuidados" value="${escapeHtml(registro ? (registro.aos_cuidados || '') : '')}">
      </div>
      <div class="campo">
        <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x)</label>
        <input type="text" id="compra-prazos-pagamento" value="${escapeHtml(construirPrazosDisplay(registro))}" placeholder="30/45/60">
      </div>
      <div class="campo">
        <label>Observações</label>
        <textarea id="compra-observacoes" rows="3">${registro ? escapeHtml(registro.observacoes || '') : ''}</textarea>
      </div>
    </div>

    <div id="aba-compra-itens" class="tab-content" style="display:none">
      <fieldset class="item-fieldset">
        <legend>Adicionar item</legend>
        <div class="campo autocomplete-wrap">
          <label>Buscar Produto (código interno, código original ou descrição)</label>
          <input type="text" id="compra-busca-produto" placeholder="Digite para buscar..." oninput="filtrarProdutosCompra()" autocomplete="off">
          <div id="compra-produto-resultados" class="autocomplete-lista" style="display:none"></div>
        </div>
        <div id="compra-produto-selecionado" class="produto-selecionado-info" style="display:none"></div>
        <div class="item-linha">
          <input type="text" id="item-quantidade" placeholder="Qtd." value="1">
          <input type="text" id="item-icms" placeholder="ICMS %" value="0,00">
          <input type="text" id="item-ipi" placeholder="IPI %" value="0,00">
          <input type="text" id="item-valor-unit" placeholder="Vlr. Unit." value="0,00">
          <button type="button" class="btn-secondary" onclick="adicionarItemCompra()">Adicionar</button>
        </div>
      </fieldset>
      <table class="data-table">
        <thead><tr><th>Descrição</th><th>Qtd.</th><th>ICMS %</th><th>IPI %</th><th>Vlr. Unit.</th><th>Vlr. Total</th><th></th></tr></thead>
        <tbody id="itens-compra-tbody"><tr><td colspan="7" class="vazio">Nenhum item adicionado.</td></tr></tbody>
      </table>
    </div>

    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="salvarCompraManual(${id || 'null'})">Salvar Compra</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);

  atualizarInfoFornecedorCompra();
  atualizarTabelaItensTemp();
}

function atualizarInfoFornecedorCompra() {
  const select = document.getElementById('compra-fornecedor');
  const infoEl = document.getElementById('compra-info-fornecedor');
  if (!select || !infoEl) return;

  if (!select.value) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const fornecedor = loadList('fornecedores').find(f => f.id === Number(select.value));
  if (!fornecedor) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const comprasFornecedor = loadList('compras')
    .filter(c => c.fornecedor_id === fornecedor.id)
    .sort((a, b) => (a.data_compra || '').localeCompare(b.data_compra || ''));
  const ultimaCompra = comprasFornecedor.length
    ? `${formatarDataBr(comprasFornecedor[comprasFornecedor.length - 1].data_compra)} — ${formatarMoeda(comprasFornecedor[comprasFornecedor.length - 1].valor_total)}`
    : 'Nenhuma compra anterior';

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Endereço:</strong> ${escapeHtml(fornecedor.endereco || '-')}${fornecedor.numero ? ', ' + escapeHtml(fornecedor.numero) : ''}${fornecedor.bairro ? ' - ' + escapeHtml(fornecedor.bairro) : ''}</div>
    <div><strong>Cidade/UF:</strong> ${escapeHtml(fornecedor.cidade || '-')}${fornecedor.uf ? '/' + escapeHtml(fornecedor.uf) : ''} &nbsp; <strong>CEP:</strong> ${escapeHtml(fornecedor.cep || '-')}</div>
    <div><strong>Telefone:</strong> ${escapeHtml(fornecedor.telefone || '-')} &nbsp; <strong>I.E.:</strong> ${escapeHtml(fornecedor.inscricao_estadual || '-')}</div>
    <div><strong>Última Compra:</strong> ${ultimaCompra}</div>
  `;
}

function filtrarProdutosCompra() {
  const campoBusca = document.getElementById('compra-busca-produto');
  const resultadosEl = document.getElementById('compra-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoCompra && campoBusca.value !== produtoSelecionadoCompra.descricao) {
    produtoSelecionadoCompra = null;
    document.getElementById('compra-produto-selecionado').style.display = 'none';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoCompra(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>
        Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Cód. Original: ${escapeHtml(p.cod_original || '-')}
        ${textoSimilares(p) ? ` | Similares: ${escapeHtml(textoSimilares(p))}` : ''}
        | Custo: ${formatarMoeda(p.valor_custo)}
      </small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoCompra(produtoId) {
  const produto = loadList('produtos').find(p => p.id === produtoId);
  if (!produto) return;
  produtoSelecionadoCompra = produto;

  document.getElementById('compra-busca-produto').value = produto.descricao;
  document.getElementById('compra-produto-resultados').innerHTML = '';
  document.getElementById('compra-produto-resultados').style.display = 'none';
  document.getElementById('item-valor-unit').value = (Number(produto.valor_custo) || 0).toFixed(2).replace('.', ',');
  document.getElementById('item-icms').value = (Number(produto.aliquota_icms) || 0).toFixed(2).replace('.', ',');
  document.getElementById('item-ipi').value = (Number(produto.aliquota_ipi) || 0).toFixed(2).replace('.', ',');

  const infoEl = document.getElementById('compra-produto-selecionado');
  infoEl.style.display = 'flex';
  infoEl.innerHTML = `
    <span>Selecionado: ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</span>
    <button type="button" onclick="limparProdutoSelecionadoCompra()" title="Remover seleção">&times;</button>
  `;
}

function limparProdutoSelecionadoCompra() {
  produtoSelecionadoCompra = null;
  document.getElementById('compra-busca-produto').value = '';
  document.getElementById('compra-produto-selecionado').style.display = 'none';
  document.getElementById('compra-produto-selecionado').innerHTML = '';
}

function adicionarItemCompra() {
  if (!produtoSelecionadoCompra) {
    alert('Busque e selecione um produto antes de adicionar.');
    return;
  }
  const quantidade = numeroBr(document.getElementById('item-quantidade').value);
  const valorUnit = numeroBr(document.getElementById('item-valor-unit').value);
  const icms = numeroBr(document.getElementById('item-icms').value);
  const ipi = numeroBr(document.getElementById('item-ipi').value);
  if (!quantidade || quantidade <= 0) {
    alert('Informe uma quantidade válida.');
    return;
  }
  itensCompraTemp.push({
    produto_id: produtoSelecionadoCompra.id,
    descricao: produtoSelecionadoCompra.descricao,
    quantidade: quantidade,
    icms_percentual: icms,
    ipi_percentual: ipi,
    valor_unitario: valorUnit,
    valor_total: quantidade * valorUnit,
  });
  atualizarTabelaItensTemp();
  limparProdutoSelecionadoCompra();
  document.getElementById('item-quantidade').value = '1';
  document.getElementById('item-icms').value = '0,00';
  document.getElementById('item-ipi').value = '0,00';
  document.getElementById('item-valor-unit').value = '0,00';
}

function removerItemCompra(indice) {
  itensCompraTemp.splice(indice, 1);
  atualizarTabelaItensTemp();
}

function atualizarTabelaItensTemp() {
  const tbody = document.getElementById('itens-compra-tbody');
  if (!tbody) return;
  tbody.innerHTML = itensCompraTemp.map((it, idx) => `
    <tr>
      <td>${escapeHtml(it.descricao)}</td>
      <td>${it.quantidade}</td>
      <td>${(Number(it.icms_percentual) || 0).toFixed(2)}%</td>
      <td>${(Number(it.ipi_percentual) || 0).toFixed(2)}%</td>
      <td>${formatarMoeda(it.valor_unitario)}</td>
      <td>${formatarMoeda(it.valor_total)}</td>
      <td class="acoes"><button type="button" onclick="removerItemCompra(${idx})" title="Remover">&#128465;</button></td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="vazio">Nenhum item adicionado.</td></tr>';
}

function salvarCompraManual(id) {
  const fornecedorId = document.getElementById('compra-fornecedor').value;
  if (!fornecedorId) {
    alert('Selecione o fornecedor.');
    return;
  }
  if (!itensCompraTemp.length) {
    alert('Adicione ao menos um item à compra.');
    return;
  }

  const tipoPedido = document.getElementById('compra-tipo-pedido').value;
  const dataCompra = document.getElementById('compra-data').value || new Date().toISOString().slice(0, 10);
  const comprador = document.getElementById('compra-comprador').value.trim();
  const numeroNf = document.getElementById('compra-numero-nf').value.trim();
  const transportadoraId = document.getElementById('compra-transportadora').value;
  const aosCuidados = document.getElementById('compra-aos-cuidados').value.trim();
  const observacoes = document.getElementById('compra-observacoes').value.trim();
  const prazosPagamento = parsePrazosPagamento(document.getElementById('compra-prazos-pagamento').value);
  const valorTotal = itensCompraTemp.reduce((soma, it) => soma + it.valor_total, 0);

  const compras = loadList('compras');

  if (id) {
    // Edicao: desfaz os efeitos da compra antiga (retira estoque e apaga parcelas antigas)
    // antes de gravar os novos dados, para nao duplicar nem deixar numeros errados.
    const compraAntiga = compras.find(c => c.id === id);
    if (compraAntiga) {
      if ((compraAntiga.tipo_pedido || 'Nota Fiscal') === 'Nota Fiscal') {
        reverterEntradaEstoqueCompra(compraAntiga.itens || []);
      }
      removerContasPagarDaCompra(id);
    }
  }

  const compraSalva = {
    id: id || nextId(compras),
    fornecedor_id: Number(fornecedorId),
    tipo_pedido: tipoPedido,
    numero_nf: numeroNf,
    chave_nfe: (id && compras.find(c => c.id === id) && compras.find(c => c.id === id).chave_nfe) || '',
    data_compra: dataCompra,
    comprador: comprador,
    transportadora_id: transportadoraId ? Number(transportadoraId) : null,
    aos_cuidados: aosCuidados,
    observacoes: observacoes,
    prazos_pagamento: prazosPagamento,
    valor_total: valorTotal,
    itens: itensCompraTemp,
  };

  if (id) {
    const idx = compras.findIndex(c => c.id === id);
    compras[idx] = compraSalva;
  } else {
    compras.push(compraSalva);
  }
  saveList('compras', compras);

  if (tipoPedido === 'Nota Fiscal') {
    aplicarEntradaEstoqueCompra(itensCompraTemp);
    gerarParcelasPagar(compraSalva);
  }

  fecharModal();
  renderCompras();
}

function reverterEntradaEstoqueCompra(itens) {
  const produtos = loadList('produtos');
  let alterou = false;
  itens.forEach(item => {
    if (!item.produto_id) return;
    const produto = produtos.find(p => p.id === item.produto_id);
    if (!produto) return;
    produto.estoque_atual = (Number(produto.estoque_atual) || 0) - (Number(item.quantidade) || 0);
    alterou = true;
  });
  if (alterou) saveList('produtos', produtos);
}

function removerContasPagarDaCompra(compraId) {
  const contas = loadList('contas_pagar').filter(c => c.compra_id !== compraId);
  saveList('contas_pagar', contas);
}

function gerarParcelasPagar(compra) {
  const prazos = Array.isArray(compra.prazos_pagamento) && compra.prazos_pagamento.length ? compra.prazos_pagamento : [0];
  const totalParcelas = prazos.length;
  const valorBase = Math.floor((compra.valor_total / totalParcelas) * 100) / 100;
  let somaParcial = 0;

  const contas = loadList('contas_pagar');
  prazos.forEach((dias, i) => {
    const ultimaParcela = i === totalParcelas - 1;
    const valorParcela = ultimaParcela ? Math.round((compra.valor_total - somaParcial) * 100) / 100 : valorBase;
    somaParcial += valorParcela;

    contas.push({
      id: nextId(contas),
      fornecedor_id: compra.fornecedor_id,
      compra_id: compra.id,
      descricao: totalParcelas > 1 ? `Compra #${compra.id} - Parcela ${i + 1}/${totalParcelas}` : `Compra #${compra.id}`,
      valor: valorParcela,
      data_vencimento: adicionarDias(compra.data_compra, dias),
      data_pagamento: null,
    });
  });
  saveList('contas_pagar', contas);
}

function gerarParcelasPagarPorDuplicatas(compra, duplicatas) {
  // Usado quando o XML da NF-e traz as duplicatas (cobr/dup): cada parcela usa exatamente
  // o vencimento e o valor informados na nota, em vez do rateio uniforme por prazos em dias.
  const contas = loadList('contas_pagar');
  const totalParcelas = duplicatas.length;
  duplicatas.forEach((dup, i) => {
    contas.push({
      id: nextId(contas),
      fornecedor_id: compra.fornecedor_id,
      compra_id: compra.id,
      descricao: totalParcelas > 1
        ? `Compra #${compra.id} - Duplicata ${dup.numero || (i + 1)}/${totalParcelas} (NF-e)`
        : `Compra #${compra.id} - Duplicata (NF-e)`,
      valor: dup.valor,
      data_vencimento: dup.vencimento,
      data_pagamento: null,
    });
  });
  saveList('contas_pagar', contas);
}

function gerarPagamentoCompraExistente(compraId) {
  const compras = loadList('compras');
  const compra = compras.find(c => c.id === compraId);
  if (!compra) return;

  const jaTemParcelas = loadList('contas_pagar').some(c => c.compra_id === compraId);
  if (jaTemParcelas) {
    if (!confirm('Esta compra já tem parcela(s) em Contas a Pagar. Deseja substituí-las pelas novas parcelas geradas agora?')) {
      return;
    }
  }

  abrirModal(`
    <h2>Gerar Pagamento — Compra #${compra.id}</h2>
    <div class="info-cliente-caixa">
      <div><strong>Valor Total da Compra:</strong> ${formatarMoeda(compra.valor_total)}</div>
    </div>
    <div class="campo">
      <label>Condição de Pagamento — prazos em dias, separados por / (ex: 30/45/60, máximo 10x). Deixe em branco para à vista.</label>
      <input type="text" id="gerar-pagamento-prazos" value="${escapeHtml(construirPrazosDisplay(compra))}" placeholder="30/45/60">
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="confirmarGerarPagamentoCompra(${compra.id})">Gerar Pagamento</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}

function confirmarGerarPagamentoCompra(compraId) {
  const compras = loadList('compras');
  const idx = compras.findIndex(c => c.id === compraId);
  if (idx === -1) return;

  const prazos = parsePrazosPagamento(document.getElementById('gerar-pagamento-prazos').value);
  removerContasPagarDaCompra(compraId);

  const compraAtualizada = { ...compras[idx], prazos_pagamento: prazos, duplicatas_nfe: [] };
  compras[idx] = compraAtualizada;
  saveList('compras', compras);
  gerarParcelasPagar(compraAtualizada);

  fecharModal();
  renderCompras();
  alert('Pagamento gerado e lançado em Contas a Pagar.');
}

/* ---------- relatorios de compras ---------- */

let relatorioComprasTemp = null;

function abrirRelatorioCompras() {
  const compras = loadList('compras');
  const compradores = [...new Set(compras.map(c => (c.comprador || '').trim()).filter(Boolean))].sort();

  abrirModal(`
    <h2>Relatório de Compras</h2>
    <div class="campo">
      <label>Comprador</label>
      <select id="rel-compras-comprador">
        <option value="">Todos (Geral)</option>
        ${compradores.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="item-linha">
      <div class="campo">
        <label>Data Início</label>
        <input type="date" id="rel-compras-data-inicio">
      </div>
      <div class="campo">
        <label>Data Fim</label>
        <input type="date" id="rel-compras-data-fim">
      </div>
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn-primary" onclick="gerarRelatorioCompras()">Gerar Relatório</button>
      <button type="button" class="btn-secondary" onclick="imprimirRelatorioCompras()">Imprimir</button>
      <button type="button" class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
    <div id="rel-compras-resultado" style="margin-top:16px"></div>
  `);

  gerarRelatorioCompras();
}

function gerarRelatorioCompras() {
  const compradorFiltro = document.getElementById('rel-compras-comprador').value;
  const dataInicio = document.getElementById('rel-compras-data-inicio').value;
  const dataFim = document.getElementById('rel-compras-data-fim').value;

  const fornecedores = loadList('fornecedores');
  let compras = loadList('compras');

  if (compradorFiltro) {
    compras = compras.filter(c => (c.comprador || '').trim() === compradorFiltro);
  }
  if (dataInicio) {
    compras = compras.filter(c => (c.data_compra || '') >= dataInicio);
  }
  if (dataFim) {
    compras = compras.filter(c => (c.data_compra || '') <= dataFim);
  }

  // Agrupamento por comprador (no relatório geral mostra todos; filtrado por um comprador, mostra só ele).
  const porComprador = {};
  compras.forEach(c => {
    const nome = (c.comprador || '').trim() || '(Não informado)';
    if (!porComprador[nome]) porComprador[nome] = { qtd: 0, valor: 0 };
    porComprador[nome].qtd += 1;
    porComprador[nome].valor += Number(c.valor_total) || 0;
  });

  const valorTotalGeral = compras.reduce((soma, c) => soma + (Number(c.valor_total) || 0), 0);

  const linhasResumo = Object.keys(porComprador).sort().map(nome => `
    <tr>
      <td>${escapeHtml(nome)}</td>
      <td>${porComprador[nome].qtd}</td>
      <td>${formatarMoeda(porComprador[nome].valor)}</td>
    </tr>
  `).join('');

  const linhasDetalhe = compras.slice().sort((a, b) => (a.data_compra || '').localeCompare(b.data_compra || '')).map(c => {
    const forn = fornecedores.find(f => f.id === c.fornecedor_id);
    return `
      <tr>
        <td>${formatarDataBr(c.data_compra)}</td>
        <td>${escapeHtml(c.comprador || '(Não informado)')}</td>
        <td>${escapeHtml(forn ? forn.razao_social : '-')}</td>
        <td>${escapeHtml(c.numero_nf || '-')}</td>
        <td>${escapeHtml(c.tipo_pedido || 'Nota Fiscal')}</td>
        <td>${formatarMoeda(c.valor_total)}</td>
      </tr>
    `;
  }).join('');

  const html = `
    <h3>Resumo por Comprador</h3>
    <table class="data-table">
      <thead><tr><th>Comprador</th><th>Qtd. Pedidos</th><th>Valor Total</th></tr></thead>
      <tbody>${linhasResumo || '<tr><td colspan="3" class="vazio">Nenhuma compra encontrada para esse filtro.</td></tr>'}</tbody>
    </table>
    <h3 style="margin-top:16px">Detalhamento</h3>
    <table class="data-table">
      <thead><tr><th>Data</th><th>Comprador</th><th>Fornecedor</th><th>Número NF</th><th>Tipo</th><th>Valor</th></tr></thead>
      <tbody>${linhasDetalhe || '<tr><td colspan="6" class="vazio">Nenhuma compra encontrada para esse filtro.</td></tr>'}</tbody>
    </table>
    <div class="totais-relatorio"><strong>Total Geral:</strong> ${formatarMoeda(valorTotalGeral)} &nbsp; (${compras.length} pedido(s))</div>

/* Monta o selo de status da Nota Fiscal de uma venda (Emitida / Pendente / Cancelada),
   junto com o número da NF quando já estiver preenchido. */
function badgeStatusNfVenda(venda) {
  const status = venda.status_nf || 'Pendente';
  const classePorStatus = { Emitida: 'status-pago', Pendente: 'status-pendente', Cancelada: 'status-vencido' };
  const classe = classePorStatus[status] || 'status-pendente';
  const numero = venda.numero_nf ? ` nº ${escapeHtml(venda.numero_nf)}` : '';
  return `<span class="status-badge ${classe}">${escapeHtml(status)}${numero}</span>`;
}

function excluirVenda(id) {
  if (!confirm('Deseja realmente excluir esta venda? O estoque baixado será devolvido e as parcelas geradas em Contas a Receber serão removidas.')) return;
  const vendas = loadList('vendas');
  const venda = vendas.find(v => v.id === id);
  if (venda) {
    reverterEstoqueVenda(venda.itens || []);
    removerContasReceberDaVenda(id);
  }
  saveList('vendas', vendas.filter(v => v.id !== id));
  renderVendas();
}

function atualizarInfoClienteVenda() {
  const select = document.getElementById('venda-cliente');
  const infoEl = document.getElementById('venda-info-cliente');
  if (!select || !infoEl) return;

  if (!select.value) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const cliente = loadList('clientes').find(c => c.id === Number(select.value));
  if (!cliente) {
    infoEl.style.display = 'none';
    infoEl.innerHTML = '';
    return;
  }

  const vendasCliente = loadList('vendas')
    .filter(v => v.cliente_id === cliente.id)
    .sort((a, b) => (a.data_venda || '').localeCompare(b.data_venda || ''));
  const ultimaCompra = vendasCliente.length
    ? `${formatarDataBr(vendasCliente[vendasCliente.length - 1].data_venda)} — ${formatarMoeda(vendasCliente[vendasCliente.length - 1].valor_total)}`
    : 'Nenhuma compra anterior';

  infoEl.style.display = 'block';
  infoEl.innerHTML = `
    <div><strong>Endereço:</strong> ${escapeHtml(cliente.endereco || '-')}${cliente.numero ? ', ' + escapeHtml(cliente.numero) : ''}${cliente.bairro ? ' - ' + escapeHtml(cliente.bairro) : ''}</div>
    <div><strong>Cidade/UF:</strong> ${escapeHtml(cliente.cidade || '-')}${cliente.uf ? '/' + escapeHtml(cliente.uf) : ''} &nbsp; <strong>CEP:</strong> ${escapeHtml(cliente.cep || '-')}</div>
    <div><strong>Telefone:</strong> ${escapeHtml(cliente.telefone || '-')} &nbsp; <strong>I.E.:</strong> ${escapeHtml(cliente.inscricao_estadual || '-')}</div>
    <div><strong>Última Compra:</strong> ${ultimaCompra}</div>
  `;
}

function filtrarProdutosVenda() {
  const campoBusca = document.getElementById('venda-busca-produto');
  const resultadosEl = document.getElementById('venda-produto-resultados');
  const termo = campoBusca.value.trim().toLowerCase();

  if (produtoSelecionadoVenda && campoBusca.value !== produtoSelecionadoVenda.descricao) {
    // o usuario alterou o texto depois de ja ter selecionado um produto
    produtoSelecionadoVenda = null;
    document.getElementById('venda-produto-selecionado').style.display = 'none';
  }

  if (!termo) {
    resultadosEl.innerHTML = '';
    resultadosEl.style.display = 'none';
    return;
  }

  const produtos = loadList('produtos');
  const encontrados = produtos.filter(p =>
    (p.cod_interno && p.cod_interno.toLowerCase().includes(termo)) ||
    (p.cod_original && p.cod_original.toLowerCase().includes(termo)) ||
    (p.descricao && p.descricao.toLowerCase().includes(termo)) ||
    codigosSimilares(p).some(codigo => codigo.toLowerCase().includes(termo))
  ).slice(0, 15);

  if (!encontrados.length) {
    resultadosEl.innerHTML = '<div class="autocomplete-vazio">Nenhum produto encontrado.</div>';
    resultadosEl.style.display = 'block';
    return;
  }

  resultadosEl.innerHTML = encontrados.map(p => `
    <div class="autocomplete-item" onclick="selecionarProdutoVenda(${p.id})">
      ${escapeHtml(p.descricao)}
      <small>
        Cód. Interno: ${escapeHtml(p.cod_interno || '-')} | Cód. Original: ${escapeHtml(p.cod_original || '-')}
        ${textoSimilares(p) ? ` | Similares: ${escapeHtml(textoSimilares(p))}` : ''}
        | Venda: ${formatarMoeda(p.valor_venda)}
      </small>
    </div>
  `).join('');
  resultadosEl.style.display = 'block';
}

function selecionarProdutoVenda(produtoId) {

  if (!produto) return;
  produtoSelecionadoVenda = produto;

  document.getElementById('venda-busca-produto').value = produto.descricao;
  document.getElementById('venda-produto-resultados').innerHTML = '';
  document.getElementById('venda-produto-resultados').style.display = 'none';
  document.getElementById('venda-item-valor-unit').value = (Number(produto.valor_venda) || 0).toFixed(2).replace('.', ',');

  const infoEl = document.getElementById('venda-produto-selecionado');
  infoEl.style.display = 'flex';
  infoEl.innerHTML = `
    <span>Selecionado: ${escapeHtml(produto.descricao)} (Cód: ${escapeHtml(produto.cod_interno || produto.cod_original || '-')})</span>
    <button type="button" onclick="limparProdutoSelecionadoVenda()" title="Remover seleção">&times;</button>

function limparProdutoSelecionadoVenda() {

function adicionarItemVenda() {

  }
  const quantidade = numeroBr(document.getElementById('venda-item-quantidade').value);

    alert('Informe uma quantidade válida.');
    return;
  }

  itensVendaTemp.push({
    produto_id: produtoSelecionadoVenda.id,
    descricao: produtoSelecionadoVenda.descricao,

  });

  document.getElementById('venda-item-valor-unit').value = '0,00';

function removerItemVenda(indice) {
  itensVendaTemp.splice(indice, 1);

}

function atualizarTabelaItensVendaTemp() {
  const tbody = document.getElementById('itens-venda-tbody');
  tbody.innerHTML = itensVendaTemp.map((it, idx) => `
    <tr>
      <td>${escapeHtml(it.descricao)}</td>

    </tr>
  `).join('') || '<tr><td colspan="5" class="vazio">Nenhum item adicionado.</td></tr>';
